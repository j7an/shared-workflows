name: Changed-line coverage
description: Evaluate a caller-provided coverage report against committed changes.

inputs:
  report-path:
    description: Path to one Cobertura XML or LCOV coverage report.
    required: true
  diff-cover-path:
    description: Path to the caller-installed diff-cover executable.
    required: true
  base-sha:
    description: Full commit SHA used as the comparison base.
    required: true
  minimum:
    description: Minimum changed-line coverage percentage.
    required: true
  source-paths:
    description: Newline-separated positive Git pathspecs for production files.
    required: true
  exclude-paths:
    description: Newline-separated positive Git pathspecs excluded from production files.
    required: false
  working-directory:
    description: Checkout root containing the tested commit.
    required: false
    default: .

runs:
  using: composite
  steps:
    - id: evaluate
      env:
        COVERAGE_REPORT_PATH: ${{ inputs.report-path }}
        COVERAGE_DIFF_COVER_PATH: ${{ inputs.diff-cover-path }}
        COVERAGE_BASE_SHA: ${{ inputs.base-sha }}
        COVERAGE_MINIMUM: ${{ inputs.minimum }}
        COVERAGE_SOURCE_PATHS: ${{ inputs.source-paths }}
        COVERAGE_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        COVERAGE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        COVERAGE_OUTPUT_DIRECTORY: ${{ runner.temp }}/shared-coverage/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.action }}
        COVERAGE_RUNNER_OS: ${{ runner.os }}
      run: python3 "$GITHUB_ACTION_PATH/evaluate.py"
      shell: bash
      continue-on-error: true
    - id: upload
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.action }}
        path: ${{ runner.temp }}/shared-coverage/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.action }}
        if-no-files-found: error
    - id: finalize
      if: always()
      env:
        COVERAGE_OUTPUT_DIRECTORY: ${{ runner.temp }}/shared-coverage/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.action }}
        COVERAGE_EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
        COVERAGE_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
      run: python3 "$GITHUB_ACTION_PATH/finalize.py"
      shell: bash
