version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "18:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
