name: Script Tests

on:
  pull_request:
    paths:
      - 'actions/coverage/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          github-token: ${{ github.token }}
          bats-version: "1.14.0"
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Install current diff-cover
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/diff-cover-current"
          "$RUNNER_TEMP/diff-cover-current/bin/python" -m pip install 'diff-cover>=10.2,<11'
          printf 'DIFF_COVER_PATH=%s\n' "$RUNNER_TEMP/diff-cover-current/bin/diff-cover" >> "$GITHUB_ENV"

      - name: Run bats
        run: bats tests/

  coverage-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          github-token: ${{ github.token }}
          bats-version: "1.14.0"
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Install lower-bound diff-cover
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/diff-cover-10.2.0"
          "$RUNNER_TEMP/diff-cover-10.2.0/bin/python" -m pip install 'diff-cover==10.2.0'
          printf 'DIFF_COVER_PATH=%s\n' "$RUNNER_TEMP/diff-cover-10.2.0/bin/diff-cover" >> "$GITHUB_ENV"

      - name: Run lower-bound coverage action tests
        run: bats tests/coverage-action.bats

  inline-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify inline bash matches scripts/*.sh
        run: ./scripts/check-inline-sync.sh

  lint-workflow-call:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflow_call files for caller-context refs
        run: ./scripts/lint-workflow-call.sh
