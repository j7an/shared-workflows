name: Security Scan

on:
  workflow_call:
    inputs:
      run_codeql:
        type: boolean
        default: true
        description: "Run CodeQL analysis."
      run_trufflehog:
        type: boolean
        default: true
        description: "Run TruffleHog verified-secret scanning."
      run_zizmor:
        type: boolean
        default: true
        description: "Run Zizmor workflow analysis."
      run_trivy:
        type: boolean
        default: true
        description: "Run Trivy filesystem vulnerability scanning."
      run_osv_full:
        type: boolean
        default: true
        description: "Run OSV full scan on push and schedule events."
      run_osv_pr:
        type: boolean
        default: true
        description: "Run OSV PR diff scan on pull_request events."
      codeql_language:
        type: string
        default: "python"
        description: "Single CodeQL language token. Use javascript-typescript for Node repos."
      codeql_queries:
        type: string
        default: "security-extended"
        description: "CodeQL query set."
      zizmor_online_audits:
        type: boolean
        default: true
        description: "Enable Zizmor online audits, including vulnerable-action checks."
      support_merge_group:
        type: boolean
        default: false
        description: "Allow general scanner jobs on merge_group events. OSV PR remains pull_request-only."

permissions: {}

jobs:
  validate-event:
    name: Validate event
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate caller event
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUPPORT_MERGE_GROUP: ${{ inputs.support_merge_group }}
        run: |
          case "$EVENT_NAME" in
            push|pull_request|schedule)
              exit 0
              ;;
            merge_group)
              if [[ "$SUPPORT_MERGE_GROUP" == "true" ]]; then
                exit 0
              fi
              echo "::error::merge_group event requires support_merge_group: true. Supported events are push, pull_request, schedule, and merge_group when support_merge_group is true."
              exit 1
              ;;
            *)
              echo "::error::Unsupported event '$EVENT_NAME'. Supported events are push, pull_request, schedule, and merge_group when support_merge_group is true."
              exit 1
              ;;
          esac

  codeql:
    name: CodeQL
    needs: validate-event
    if: ${{ inputs.run_codeql && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'merge_group' && inputs.support_merge_group)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ inputs.codeql_language }}
          queries: ${{ inputs.codeql_queries }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ inputs.codeql_language }}

  trufflehog:
    name: TruffleHog
    needs: validate-event
    if: ${{ inputs.run_trufflehog && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'merge_group' && inputs.support_merge_group)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog secret scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        continue-on-error: true
        with:
          path: ./
          extra_args: --results=verified

      - name: Fail on verified secrets
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::TruffleHog scan failed or detected verified secrets. Review the scan output above."
          exit 1

  zizmor:
    name: Zizmor
    needs: validate-event
    if: ${{ inputs.run_zizmor && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'merge_group' && inputs.support_merge_group)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zizmor workflow scan
        id: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: true
          min-severity: medium
          min-confidence: medium
          online-audits: ${{ inputs.zizmor_online_audits }}
          version: "1.30.1"

      - name: Fail on Zizmor findings
        env:
          SARIF_FILE: ${{ steps.zizmor.outputs.output-file }}
        run: |
          # --- BEGIN inline:scripts/zizmor-sarif-gate.sh ---
          zizmor_sarif_gate() (
          # zizmor-sarif-gate.sh — fail the job when uploaded Zizmor SARIF has findings.
          #
          # Usage: scripts/zizmor-sarif-gate.sh <sarif-path>
          # Exit: 0 = no findings, 1 = findings, 2 = unusable input.
          # Pass/finding messages go to stdout; fail-closed diagnostics go to stderr.
          # Bash 3.2 compatible. No network or upload; the action uploads SARIF first.

          set -uo pipefail

          path=${1:-}
          if [ -z "$path" ]; then
            printf '%s\n' '::error::Zizmor SARIF gate: no SARIF path provided' >&2
            exit 2
          fi

          if [ ! -r "$path" ] || [ ! -s "$path" ]; then
            printf '::error::Zizmor SARIF gate: SARIF file not found or unreadable: %s\n' "$path" >&2
            exit 2
          fi

          if ! count=$(jq '[.runs[].results[]] | length' "$path" 2>/dev/null) || ! [[ "$count" =~ ^[0-9]+$ ]]; then
            printf '::error::Zizmor SARIF gate: SARIF file is not valid SARIF JSON: %s\n' "$path" >&2
            exit 2
          fi

          if [ "$count" -eq 0 ]; then
            printf '%s\n' 'Zizmor: no findings at the configured thresholds.'
            exit 0
          fi

          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$path"
          printf '::error::Zizmor reported %s finding(s); see the Security tab (code scanning, category: zizmor).\n' "$count"
          exit 1
          )
          # --- END inline:scripts/zizmor-sarif-gate.sh ---

          zizmor_sarif_gate "$SARIF_FILE"

  trivy:
    name: Trivy
    needs: validate-event
    if: ${{ inputs.run_trivy && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'merge_group' && inputs.support_merge_group)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  osv-full:
    name: OSV full
    needs: validate-event
    if: ${{ inputs.run_osv_full && (github.event_name == 'push' || github.event_name == 'schedule') }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --recursive ./

  osv-pr:
    name: OSV PR
    needs: validate-event
    if: ${{ inputs.run_osv_pr && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --recursive ./
