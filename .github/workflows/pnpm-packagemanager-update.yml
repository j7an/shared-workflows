name: pnpm packageManager Update

on:
  workflow_call:
    inputs:
      manifest_path:
        type: string
        default: "package.json"
        description: "Path to the package.json carrying the packageManager field."
      minimum_release_age_days:
        type: number
        default: 5
        description: "A pnpm release must be at least this old before a PR is opened. Bypassed when the currently pinned version is deprecated. Set 0 to disable waiting. Unlike dependency-safety.yml's input of the same name, this gates whether the PR is created at all and has no off switch — the lookup is load-bearing."
      branch:
        type: string
        default: "deps/pnpm-packagemanager"
        description: "Pull request branch."
      title:
        type: string
        default: "deps: update pnpm packageManager"
        description: "Pull request title."
      commit_message:
        type: string
        default: "deps: update pnpm packageManager"
        description: "Commit message."
      labels:
        type: string
        default: "dependencies"
        description: "Labels passed to create-pull-request."
      sign_commits:
        type: boolean
        default: true
        description: "Whether create-pull-request signs commits."
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  update:
    name: Update pnpm packageManager
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Preflight auth
        id: preflight
        env:
          APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Derive a boolean and drop the secret. Never echo APP_PRIVATE_KEY, and
          # never write it to GITHUB_OUTPUT — outputs are readable by later steps
          # and appear in the run's step summary.
          if [ -n "$APP_PRIVATE_KEY" ]; then
            HAS_APP_PRIVATE_KEY=true
          else
            HAS_APP_PRIVATE_KEY=false
          fi
          unset APP_PRIVATE_KEY

          # Half-configured App auth fails loudly rather than degrading to the
          # GITHUB_TOKEN fallback. A repo that set vars.RELEASE_BOT_APP_ID asked
          # for App-authored PRs; silently opening GITHUB_TOKEN-authored ones
          # instead leaves required CI unstarted with nothing to notice.
          # pre-commit-autoupdate.yml:139-145 establishes this contract and this
          # mirrors it, asymmetry included: a private key arriving through
          # `secrets: inherit` with no repo-level APP_ID is an org-wide secret
          # this repo never opted into, not a half-configuration.
          AUTH_MODE="fallback"
          USE_FALLBACK_CAVEAT="true"
          if [ -n "$APP_ID" ]; then
            if [ "$HAS_APP_PRIVATE_KEY" != "true" ]; then
              echo "::error::App auth half-configured - set both vars.RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY, or neither."
              exit 1
            fi
            AUTH_MODE="app"
            USE_FALLBACK_CAVEAT="false"
          fi

          {
            echo "auth_mode=$AUTH_MODE"
            echo "use_fallback_caveat=$USE_FALLBACK_CAVEAT"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        if: steps.preflight.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not `app-id` — matches pre-commit-autoupdate.yml:172.
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scope the token to what this workflow actually needs rather than
          # inheriting every permission the installation holds.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and update
        id: update
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_MIN_AGE_DAYS: ${{ inputs.minimum_release_age_days }}
        run: |
          # --- BEGIN inline:scripts/packagemanager-bump.sh ---
          packagemanager_bump() (
          # packagemanager-bump.sh — all package.json#packageManager semantics for pnpm.
          #
          # Pure stdin -> stdout. No network, no file reads. Bash 3.2 compatible.
          #
          # Modes:
          #   --mode=current
          #       stdin:  package.json
          #       stdout: pnpm<TAB><version><TAB><major><TAB><suffix>
          #               <suffix> is the full "+sha224.<hex>" or empty.
          #   --mode=select --current=<x.y.z> --now=<epoch> --min-age-days=<n>
          #       stdin:  the npm registry packument for pnpm
          #       stdout: <version><TAB>normal|bypass, or nothing when none is eligible
          #   --mode=rewrite --version=<x.y.z[+suffix]>
          #       stdin:  package.json
          #       stdout: the same document with only the packageManager value replaced
          #
          # Exit: 0 success (including the zero-result case)
          #       2 malformed input, missing/repeated --mode, unknown argument
          #       3 (select only) pinned version deprecated, no eligible replacement
          #       4 (rewrite only) ambiguous-manifest: the target value appears under
          #         more than one packageManager key; refusing textual replacement
          #
          # Each mode only validates the flags it consumes. Passing a flag another mode
          # ignores (e.g. --mode=current --version=1.2.3) is a silent no-op, not an
          # error — there is no cross-mode "unexpected flag for this mode" guard. A
          # typo'd flag name in a caller workflow will not be caught here.
          #
          # pipefail is set for defense-in-depth around future edits; every pipeline in
          # this script today already reports failure through its last command's exit
          # status (die's own checks, or `... || die ...` directly on the pipeline), so
          # no current test exercises pipefail itself.
          set -uo pipefail

          die() { echo "packagemanager-bump.sh: $1" >&2; exit "${2:-2}"; }

          MODE=""; CURRENT=""; NOW=""; MIN_AGE_DAYS=""; VERSION=""
          for arg in "$@"; do
            case "$arg" in
              --mode=current|--mode=select|--mode=rewrite)
                [ -n "$MODE" ] && die "repeated --mode"
                MODE="${arg#--mode=}"
                ;;
              --mode=*)         die "unknown mode: ${arg#--mode=}" ;;
              --current=*)      CURRENT="${arg#--current=}" ;;
              --now=*)          NOW="${arg#--now=}" ;;
              --min-age-days=*) MIN_AGE_DAYS="${arg#--min-age-days=}" ;;
              --version=*)      VERSION="${arg#--version=}" ;;
              *)                die "unknown argument: $arg" ;;
            esac
          done

          [ -n "$MODE" ] || die "--mode=current, --mode=select, or --mode=rewrite required"

          # Plain $(cat) strips ALL trailing newlines, which would make --mode=rewrite
          # silently drop a manifest's final newline. The sentinel round-trips them.
          INPUT=$(cat; printf 'X')
          INPUT="${INPUT%X}"

          case "$MODE" in
            current)
              raw=$(printf '%s' "$INPUT" | jq -er '.packageManager // empty' 2>/dev/null) \
                || die "package.json is not valid JSON, or has no top-level packageManager"
              [ -n "$raw" ] || die "no top-level packageManager field"
              case "$raw" in
                pnpm@*) ;;
                *)      die "packageManager is not pnpm: $raw" ;;
              esac
              rest="${raw#pnpm@}"
              ver="${rest%%+*}"
              if [ "$ver" = "$rest" ]; then suffix=""; else suffix="+${rest#*+}"; fi
              [[ "$ver" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] \
                || die "packageManager version is not an exact x.y.z: $ver"
              printf 'pnpm\t%s\t%s\t%s\n' "$ver" "${BASH_REMATCH[1]}" "$suffix"
              ;;
            select)
              [ -n "$CURRENT" ]      || die "--mode=select requires --current"
              [ -n "$NOW" ]          || die "--mode=select requires --now"
              [ -n "$MIN_AGE_DAYS" ] || die "--mode=select requires --min-age-days"
              [[ "$CURRENT" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] || die "--current is not x.y.z: $CURRENT"
              major="${BASH_REMATCH[1]}"
              [[ "$NOW" =~ ^[0-9]+$ ]]          || die "--now is not an epoch: $NOW"
              [[ "$MIN_AGE_DAYS" =~ ^[0-9]+$ ]] || die "--min-age-days is not a number: $MIN_AGE_DAYS"

              printf '%s' "$INPUT" | jq -e 'has("versions") and has("time")' >/dev/null 2>&1 \
                || die "packument is not valid JSON or lacks .versions/.time"

              # Any stable release in this major at all? Empty means the major is unknown
              # to the registry, which is a different condition from "nothing newer" and
              # must not be reported as a clean no-op.
              in_major=$(printf '%s' "$INPUT" | jq -r --arg maj "$major" '
                [ .versions | keys[] | select(test("^" + $maj + "\\.[0-9]+\\.[0-9]+$")) ] | length')
              [ "$in_major" -gt 0 ] || die "no published stable pnpm releases in major $major"

              # has("deprecated") — NOT `.deprecated // empty`. A version deprecated with
              # an empty string is still deprecated, and `// empty` would read it as healthy.
              if printf '%s' "$INPUT" | jq -e --arg v "$CURRENT" \
                   '.versions[$v] | has("deprecated")' >/dev/null 2>&1; then
                soak="0"; label="bypass"
                pin_dep=$(printf '%s' "$INPUT" | jq -r --arg v "$CURRENT" '.versions[$v].deprecated')
              else
                soak="1"; label="normal"; pin_dep=""
              fi

              # Candidates: stable, in-major, not deprecated, strictly newer.
              cands=$(printf '%s' "$INPUT" | jq -r \
                --arg maj "$major" --arg cur "$CURRENT" '
                def semver: split(".") | map(tonumber);
                [ .versions
                  | to_entries[]
                  | select(.key | test("^" + $maj + "\\.[0-9]+\\.[0-9]+$"))
                  | select(.value | has("deprecated") | not)
                  | .key
                ]
                | map(select(semver > ($cur | semver)))
                | sort_by(semver)[]') || die "packument selection failed"

              if [ -z "$cands" ]; then
                if [ -n "$pin_dep" ]; then
                  die "deprecated-no-escape: pinned version $CURRENT is deprecated and no eligible replacement exists in major $major: $pin_dep" 3
                fi
                # Distinguish the reasons rather than reporting one undifferentiated no-op.
                # major-available is checked BEFORE prerelease-only: if the pinned major
                # is end-of-life, no stable release will ever land in it, so reporting
                # prerelease-only would imply a wait that never ends. major-available is
                # the honest, actionable signal whenever both are true. (Task 3 ruling,
                # 2026-08-06: this reorders the brief's prescribed check order.)
                if printf '%s' "$INPUT" | jq -e --arg maj "$major" '
                     [ .versions | keys[]
                       | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                       | select((split(".")[0] | tonumber) > ($maj | tonumber)) ] | length > 0
                   ' >/dev/null 2>&1; then
                  echo "major-available" >&2; exit 0
                fi
                if printf '%s' "$INPUT" | jq -e --arg maj "$major" --arg cur "$CURRENT" '
                     def semver: split(".") | map(tonumber);
                     [ .versions | keys[]
                       | select(test("^" + $maj + "\\.[0-9]+\\.[0-9]+-"))
                       | select((split("-")[0] | semver) > ($cur | semver)) ] | length > 0
                   ' >/dev/null 2>&1; then
                  echo "prerelease-only" >&2; exit 0
                fi
                echo "current" >&2; exit 0
              fi

              # Every candidate MUST have a timestamp. Silently dropping one would let a
              # malformed packument look like a clean cooldown, which is fail-open.
              cutoff=$(( NOW - MIN_AGE_DAYS * 86400 ))
              selected=""
              while IFS= read -r v; do
                # Structurally unreachable today: $cands is non-empty by this point
                # (the empty case was intercepted above), and `read` on a non-empty
                # here-string does not yield a trailing empty line. Kept as
                # forward-defense against a future change to how $cands is produced.
                [ -n "$v" ] || continue
                iso=$(printf '%s' "$INPUT" | jq -r --arg v "$v" '.time[$v] // empty')
                [ -n "$iso" ] || die "malformed-packument: no .time entry for candidate $v"
                pub=$(printf '%s' "$INPUT" | jq -r --arg t "$iso" \
                        '$t | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601') \
                  || die "malformed-packument: unparseable timestamp for $v: $iso"
                if [ "$soak" = "0" ] || [ "$pub" -le "$cutoff" ]; then
                  selected="$v"
                fi
              done <<< "$cands"

              if [ -z "$selected" ]; then
                # Structurally unreachable today: pin_dep non-empty implies soak="0",
                # which forces `selected` on every loop iteration whenever $cands is
                # non-empty, and the empty-$cands case was already intercepted above.
                # Kept as forward-defense against a future change to the loop's
                # selection logic; do not delete as a copy-paste artifact.
                if [ -n "$pin_dep" ]; then
                  die "deprecated-no-escape: pinned version $CURRENT is deprecated and no eligible replacement exists in major $major: $pin_dep" 3
                fi
                echo "cooldown" >&2
                exit 0
              fi
              printf '%s\t%s\n' "$selected" "$label"
              exit 0
              ;;
            rewrite)
              [ -n "$VERSION" ] || die "--mode=rewrite requires --version"
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[A-Za-z0-9._-]+)?$ ]] \
                || die "--version is not x.y.z or x.y.z+suffix: $VERSION"

              # Validate the same way --mode=current does, so rewrite refuses everything
              # current refuses: absent field, non-pnpm, range, nested-only.
              raw=$(printf '%s' "$INPUT" | jq -er '.packageManager // empty' 2>/dev/null) \
                || die "package.json is not valid JSON, or has no top-level packageManager"
              case "$raw" in pnpm@*) ;; *) die "packageManager is not pnpm: $raw" ;; esac
              [[ "${raw#pnpm@}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+.*)?$ ]] \
                || die "packageManager version is not an exact x.y.z: $raw"

              # Structure-aware, byte-preserving replacement. See the notes below —
              # every line of this is load-bearing and was validated empirically.
              printf '%sX' "$INPUT" | awk -v old="$raw" -v new="pnpm@$VERSION" '
                BEGIN { RS = "\0" }
                {
                  s = substr($0, 1, length($0) - 1)   # drop the sentinel X
                  key = "\"packageManager\""
                  target = "\"" old "\""
                  pos = 1; count = 0; hit = 0
                  while ((i = index(substr(s, pos), key)) > 0) {
                    abs = pos + i - 1
                    j = abs + length(key)
                    # Skips whitespace between the key and the colon (valid JSON like
                    # "packageManager" : ...). No fixture in this suite exercises it —
                    # every manifest here has the colon immediately after the key — so
                    # deleting this line does not redden any test. It fails closed
                    # (falls through to "could not locate") rather than misbehaving
                    # if removed; kept for real-world manifests that use this spacing.
                    while (substr(s, j, 1) ~ /[ \t\r\n]/) j++
                    if (substr(s, j, 1) == ":") {
                      j++
                      while (substr(s, j, 1) ~ /[ \t\r\n]/) j++
                      if (substr(s, j, length(target)) == target) {
                        count++
                        if (count == 1) hit = j
                      }
                    }
                    pos = abs + length(key)
                  }
                  if (count == 0) exit 3
                  if (count > 1) exit 4
                  printf "%s", substr(s, 1, hit - 1) "\"" new "\"" substr(s, hit + length(target))
                }'
              rc=$?
              [ "$rc" -eq 3 ] && die "could not locate the packageManager value in the document"
              [ "$rc" -eq 4 ] && die "ambiguous-manifest: the value $raw appears under more than one packageManager key; refusing textual replacement" 4
              [ "$rc" -eq 0 ] || die "rewrite failed"
              ;;
          esac
          )
          # --- END inline:scripts/packagemanager-bump.sh ---
          # --- BEGIN inline:scripts/packagemanager-integrity.sh ---
          packagemanager_integrity() (
          # packagemanager-integrity.sh - verify a downloaded tarball against the registry's
          # own SRI claim, then emit the Corepack integrity suffix body.
          #
          # Usage:
          #   packagemanager-integrity.sh --tarball=<path> --algo=<name> [--expect=<sri>]
          #
          # --algo    algorithm for the OUTPUT digest, taken from the algorithm the pin
          #           already declares. Allowlist: sha512 sha384 sha256 sha224 sha1.
          # --expect  the packument's `dist.integrity`, SRI form `<algo>-<base64>`. When
          #           empty or absent, byte verification is skipped and a warning goes to
          #           stderr - the caller decided the packument had no claim to check.
          #
          # stdout    `<algo>.<lowercase-hex>` - the suffix body, WITHOUT the leading `+`.
          # exit 0    success
          # exit 2    malformed arguments, unreadable tarball, or unsupported algorithm
          # exit 5    integrity-failure: bytes do not match --expect
          #
          # No network. Bash 3.2 compatible. The caller downloads the tarball; keeping the
          # fetch out of here is what makes every path testable offline from a fixture.
          #
          # Two properties are load-bearing and silent when wrong:
          #
          #   1. --algo governs the OUTPUT digest; --expect's own algorithm governs
          #      VERIFICATION. They are independent. A sha224 pin verified against a
          #      sha512-... claim must verify with sha512 and emit sha224. Deriving one
          #      from the other silently upgrades a sha224 pin to the default, and no
          #      exit status changes to announce it.
          #   2. Verification runs BEFORE the output digest is computed. Hashing
          #      unverified bytes faithfully records whatever was downloaded, which is
          #      precisely the failure this gate exists to prevent.
          #
          # Corepack's contract, confirmed by round-trip against corepack 0.35.0 on
          # 2026-08-06 (`corepack use pnpm@11.20.0` in a scratch project): the suffix body
          # is the digest of the downloaded tarball *stream*, lowercase hex, and it agreed
          # byte-for-byte with both `openssl dgst -sha512` over the registry tarball and
          # with the registry's own dist.integrity decoded from base64. The extracted-file
          # branch in corepackUtils.ts does not apply to a pnpm tarball.
          #
          # openssl is used rather than shasum/base64 for portability: `openssl dgst -hex`
          # emits lowercase hex on both OpenSSL 1.1 (`SHA512(f)= ...`) and 3.x
          # (`SHA2-512(f)= ...`), and `awk '{print $NF}'` strips either prefix. macOS
          # `base64` wants -D where GNU wants -d; `openssl base64 -d -A` is the same
          # everywhere.
          set -uo pipefail

          die() { echo "packagemanager-integrity.sh: $1" >&2; exit "${2:-2}"; }

          # Digest byte length per algorithm, as hex characters. Bash 3.2 has no
          # associative arrays, so this is a case, not a map.
          hex_len_for() {
            case "$1" in
              sha512) echo 128 ;;
              sha384) echo 96  ;;
              sha256) echo 64  ;;
              sha224) echo 56  ;;
              sha1)   echo 40  ;;
              *)      echo 0   ;;
            esac
          }

          TARBALL=""; ALGO=""; EXPECT=""
          for arg in "$@"; do
            case "$arg" in
              --tarball=*) TARBALL="${arg#--tarball=}" ;;
              --algo=*)    ALGO="${arg#--algo=}" ;;
              --expect=*)  EXPECT="${arg#--expect=}" ;;
              *)           die "unknown argument: $arg" ;;
            esac
          done

          [ -n "$TARBALL" ] || die "--tarball=<path> required"
          [ -n "$ALGO" ]    || die "--algo=<name> required"

          # The allowlist is what keeps --algo out of the openssl command line as an
          # arbitrary string. Reject before touching the filesystem.
          [ "$(hex_len_for "$ALGO")" != "0" ] || die "unsupported --algo: $ALGO"

          # An absent file must not read as a pass. A fetch failure is the caller's to
          # diagnose, but silence here would let it become a hash of nothing.
          [ -e "$TARBALL" ] || die "tarball not found: $TARBALL"
          [ -f "$TARBALL" ] || die "tarball is not a regular file: $TARBALL"
          [ -r "$TARBALL" ] || die "tarball is not readable: $TARBALL"

          # --- Verification. Runs before any output digest is computed. ---
          if [ -n "$EXPECT" ]; then
            case "$EXPECT" in
              *-*) ;;
              *)   die "--expect is not SRI form <algo>-<base64>: $EXPECT" ;;
            esac
            EXP_ALGO="${EXPECT%%-*}"
            EXP_B64="${EXPECT#*-}"

            EXP_HEX_LEN=$(hex_len_for "$EXP_ALGO")
            [ "$EXP_HEX_LEN" != "0" ] || die "unsupported --expect algorithm: $EXP_ALGO"
            [ -n "$EXP_B64" ] || die "--expect carries no digest: $EXPECT"

            # openssl base64 -d is lenient about garbage, so screen the charset first and
            # confirm the decoded length afterwards. A claim that cannot be read is a
            # malformed argument (2), not an integrity failure (5) - conflating them would
            # let a truncated claim masquerade as tampered bytes.
            [[ "$EXP_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
              || die "--expect digest is not base64: $EXPECT"
            EXP_HEX=$(printf '%s' "$EXP_B64" | openssl base64 -d -A 2>/dev/null | od -An -tx1 | tr -d ' \n') \
              || die "--expect digest could not be decoded: $EXPECT"
            [ "${#EXP_HEX}" -eq "$EXP_HEX_LEN" ] \
              || die "--expect digest is not a valid ${EXP_ALGO} digest: $EXPECT"

            # Verify with the CLAIM's algorithm, not --algo. These are independent.
            ACT_HEX=$(openssl dgst -"$EXP_ALGO" -hex "$TARBALL" | awk '{print $NF}') \
              || die "could not compute ${EXP_ALGO} digest of ${TARBALL}"
            [ "${#ACT_HEX}" -eq "$EXP_HEX_LEN" ] \
              || die "could not compute ${EXP_ALGO} digest of ${TARBALL}"

            if [ "$ACT_HEX" != "$EXP_HEX" ]; then
              die "integrity-failure: ${EXP_ALGO} of ${TARBALL} is ${ACT_HEX}, expected ${EXP_HEX}" 5
            fi
          else
            echo "packagemanager-integrity.sh: warning: no --expect claim supplied; skipping byte verification" >&2
          fi

          # --- Output digest. Uses --algo, and only --algo. ---
          OUT_HEX=$(openssl dgst -"$ALGO" -hex "$TARBALL" | awk '{print $NF}') \
            || die "could not compute ${ALGO} digest of ${TARBALL}"
          OUT_LEN=$(hex_len_for "$ALGO")
          [ "${#OUT_HEX}" -eq "$OUT_LEN" ] || die "could not compute ${ALGO} digest of ${TARBALL}"

          printf '%s.%s\n' "$ALGO" "$OUT_HEX"
          )
          # --- END inline:scripts/packagemanager-integrity.sh ---

          set -euo pipefail

          case "$INPUT_MANIFEST_PATH" in
            /*|*..*) echo "::error::manifest_path must be a relative path without '..': $INPUT_MANIFEST_PATH"; exit 1 ;;
          esac
          # Mirrors pre-commit-autoupdate.yml:129-131. The value also flows into
          # create-pull-request's `add-paths:`, which is newline-separated, so a
          # newline would silently widen the commit's path restriction.
          case "$INPUT_MANIFEST_PATH" in
            *$'\n'*|*$'\r'*) echo "::error::manifest_path must not contain newlines or carriage returns"; exit 1 ;;
          esac

          # Normalize leading "./". `gh api .../pulls/{n}/files` reports paths in
          # normalized form ("package.json"), so an unnormalized "./package.json"
          # would make the post-PR verify step compare unequal strings and fail
          # AFTER the pull request already exists. Validation, `add-paths:`, and
          # the verify comparison all read the normalized value below.
          MANIFEST="$INPUT_MANIFEST_PATH"
          while [ "${MANIFEST#./}" != "$MANIFEST" ]; do
            MANIFEST="${MANIFEST#./}"
          done
          [ -n "$MANIFEST" ] || { echo "::error::manifest_path must not be empty"; exit 1; }
          echo "manifest_path=$MANIFEST" >> "$GITHUB_OUTPUT"

          [ -f "$MANIFEST" ] || { echo "::error::manifest not found: $MANIFEST"; exit 1; }

          if ! CUR_ROW=$(packagemanager_bump --mode=current < "$MANIFEST"); then
            echo "::error::could not read a pnpm packageManager pin from $MANIFEST"
            exit 1
          fi
          CUR_VER=$(printf '%s' "$CUR_ROW" | cut -f2)
          CUR_MAJ=$(printf '%s' "$CUR_ROW" | cut -f3)
          CUR_SUF=$(printf '%s' "$CUR_ROW" | cut -f4)
          echo "Current pin: pnpm@${CUR_VER}${CUR_SUF} (major ${CUR_MAJ})"

          PACKUMENT="${RUNNER_TEMP}/packument.json"
          if ! curl -sfS --max-time 120 https://registry.npmjs.org/pnpm -o "$PACKUMENT"; then
            echo "::error::registry fetch failed; refusing to proceed (a network error is not 'already current')"
            exit 1
          fi

          SEL_STATUS=0
          SEL=$(packagemanager_bump --mode=select \
                  --current="$CUR_VER" \
                  --now="$(date -u +%s)" \
                  --min-age-days="$INPUT_MIN_AGE_DAYS" \
                  < "$PACKUMENT") || SEL_STATUS=$?

          case "$SEL_STATUS" in
            0) ;;
            3)
              echo "::error::pinned pnpm ${CUR_VER} is deprecated and no eligible replacement exists in major ${CUR_MAJ}. A major upgrade is likely required and is deliberately left to a human."
              exit 1
              ;;
            *)
              echo "::error::version selection failed"
              exit 1
              ;;
          esac

          if [ -z "$SEL" ]; then
            echo "Nothing to do: pnpm ${CUR_VER} is current, or no newer release has passed the ${INPUT_MIN_AGE_DAYS}-day minimum age."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET=$(printf '%s' "$SEL" | cut -f1)
          SELECT_MODE=$(printf '%s' "$SEL" | cut -f2)
          echo "Target: pnpm@${TARGET} (${SELECT_MODE})"

          if [ -z "$CUR_SUF" ]; then
            NEW_VALUE="$TARGET"
          else
            # Preserve the algorithm the pin already declares, read from the
            # existing suffix. This branch only ever rewrites a suffix that is
            # already there — the empty-$CUR_SUF branch above writes a bare
            # version and never reaches packagemanager_integrity — so no
            # algorithm default is chosen here or anywhere in this workflow.
            CUR_ALGO="${CUR_SUF#+}"; CUR_ALGO="${CUR_ALGO%%.*}"

            TARBALL=$(jq -r --arg v "$TARGET" '.versions[$v].dist.tarball // empty' "$PACKUMENT")
            INTEGRITY=$(jq -r --arg v "$TARGET" '.versions[$v].dist.integrity // empty' "$PACKUMENT")
            [ -n "$TARBALL" ] || { echo "::error::no tarball URL for pnpm ${TARGET}"; exit 1; }

            # The tarball URL and the dist.integrity it is checked against come
            # from the SAME document, so a hostile packument controls both sides
            # and the integrity check proves nothing about origin. Constrain the
            # host before fetching, so the bytes at least come from the registry
            # this workflow decided to trust.
            case "$TARBALL" in
              https://*) ;;
              *) echo "::error::tarball URL for pnpm ${TARGET} is not https: $TARBALL"; exit 1 ;;
            esac
            TARBALL_HOST="${TARBALL#https://}"
            TARBALL_HOST="${TARBALL_HOST%%/*}"
            # Strip any userinfo: "https://registry.npmjs.org@evil.example/x" has
            # authority "registry.npmjs.org@evil.example" and host evil.example.
            case "$TARBALL_HOST" in
              *@*) TARBALL_HOST="${TARBALL_HOST##*@}" ;;
            esac
            if [ "$TARBALL_HOST" != "registry.npmjs.org" ]; then
              echo "::error::tarball URL for pnpm ${TARGET} is not hosted on registry.npmjs.org: $TARBALL"
              exit 1
            fi

            if [ -z "$INTEGRITY" ]; then
              # packagemanager-integrity.sh warns on plain stderr, which never
              # surfaces in the checks UI. The annotation belongs to the caller.
              echo "::warning::the npm registry published no dist.integrity for pnpm ${TARGET}; the new packageManager suffix records the downloaded bytes without verifying them."
            fi

            curl -sfS --max-time 120 "$TARBALL" -o "${RUNNER_TEMP}/pnpm.tgz" \
              || { echo "::error::integrity-failure: tarball fetch failed for pnpm ${TARGET}"; exit 1; }

            INT_STATUS=0
            SUFFIX_BODY=$(packagemanager_integrity \
                            --tarball="${RUNNER_TEMP}/pnpm.tgz" \
                            --algo="$CUR_ALGO" \
                            --expect="$INTEGRITY") || INT_STATUS=$?
            case "$INT_STATUS" in
              0) ;;
              5) echo "::error::integrity-failure: downloaded bytes do not match dist.integrity for pnpm ${TARGET}"; exit 1 ;;
              *) echo "::error::integrity check failed for pnpm ${TARGET}"; exit 1 ;;
            esac
            NEW_VALUE="${TARGET}+${SUFFIX_BODY}"
          fi
          echo "New packageManager value: pnpm@${NEW_VALUE}"

          TMP_MANIFEST="${RUNNER_TEMP}/package.json.new"
          packagemanager_bump --mode=rewrite --version="$NEW_VALUE" < "$MANIFEST" > "$TMP_MANIFEST" \
            || { echo "::error::rewrite failed"; exit 1; }
          mv "$TMP_MANIFEST" "$MANIFEST"

          {
            echo "target=$TARGET"
            echo "new_value=$NEW_VALUE"
            echo "select_mode=$SELECT_MODE"
            echo "current=$CUR_VER"
          } >> "$GITHUB_OUTPUT"

          if [ "$SELECT_MODE" = "bypass" ]; then
            # Write registry-controlled prose to a FILE, never to $GITHUB_OUTPUT
            # with a fixed heredoc delimiter. A deprecation message containing a
            # bare `EOF` line would escape the block and inject arbitrary outputs,
            # and that text comes from the registry, not from us.
            jq -r --arg v "$CUR_VER" '.versions[$v].deprecated' "$PACKUMENT" \
              > "${RUNNER_TEMP}/deprecation.txt"
            echo "deprecation_file=${RUNNER_TEMP}/deprecation.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose pull request body
        id: body
        if: steps.update.outputs.skip != 'true'
        env:
          CURRENT: ${{ steps.update.outputs.current }}
          TARGET: ${{ steps.update.outputs.target }}
          SELECT_MODE: ${{ steps.update.outputs.select_mode }}
          DEPRECATION_FILE: ${{ steps.update.outputs.deprecation_file }}
          MIN_AGE_DAYS: ${{ inputs.minimum_release_age_days }}
          USE_FALLBACK_CAVEAT: ${{ steps.preflight.outputs.use_fallback_caveat }}
        run: |
          set -euo pipefail
          {
            echo "Updates the pinned pnpm toolchain version."
            echo
            echo "\`packageManager\`: \`pnpm@${CURRENT}\` → \`pnpm@${TARGET}\`"
            echo
            if [ "$SELECT_MODE" = "bypass" ]; then
              echo "> **Minimum release age was bypassed.**"
              echo ">"
              echo "> The previously pinned version \`${CURRENT}\` is deprecated on the npm"
              echo "> registry, so the usual ${MIN_AGE_DAYS}-day wait was skipped: staying on a"
              echo "> known-broken toolchain is a present, confirmed problem, while the wait"
              echo "> guards against a hypothetical one."
              echo ">"
              echo "> The registry's notice for \`${CURRENT}\`, verbatim:"
              echo ">"
              # Two independent neutralizations, both required.
              #   s/</\&lt;/g  — blockquoting stops Markdown but NOT raw HTML.
              #     `> > <img src=x>` renders a live image tag in the PR body,
              #     leaking a viewer's IP and User-Agent to whoever the registry
              #     prose names, and `<details>` can hide text from a reviewer.
              #     Escaping `<` is enough to disarm every tag while leaving the
              #     notice readable; `&` is deliberately left alone so ordinary
              #     prose ("A & B") is not rewritten to `&amp;`.
              #   s/^/> > /   — quote every line, so a multi-line notice cannot
              #     break out of the blockquote and inject Markdown.
              sed -e 's/</\&lt;/g' -e 's/^/> > /' "$DEPRECATION_FILE"
            else
              echo "The target release is at least ${MIN_AGE_DAYS} days old and is not deprecated."
            fi
            echo
            echo "Only the \`packageManager\` value changed; no lockfile was touched."
            if [ "$USE_FALLBACK_CAVEAT" = "true" ]; then
              echo
              echo "Note: GITHUB_TOKEN-authored PRs may not trigger required CI automatically due to GitHub's recursion guard. If checks do not start, close and reopen this PR or push an empty commit."
            fi
          } > "${RUNNER_TEMP}/pr-body.md"
          echo "path=${RUNNER_TEMP}/pr-body.md" >> "$GITHUB_OUTPUT"

      - name: Create or refresh the pull request
        id: cpr
        if: steps.update.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: ${{ inputs.branch }}
          delete-branch: true
          commit-message: ${{ inputs.commit_message }}
          labels: ${{ inputs.labels }}
          sign-commits: ${{ inputs.sign_commits }}
          # The NORMALIZED path, not inputs.manifest_path: `./package.json` and
          # `package.json` must be one string by the time it reaches add-paths,
          # the verify step, and the GitHub API's own normalized reply.
          add-paths: ${{ steps.update.outputs.manifest_path }}
          body-path: ${{ steps.body.outputs.path }}
          title: ${{ steps.update.outputs.select_mode == 'bypass' && format('{0} (cooldown bypassed — previous pin deprecated)', inputs.title) || inputs.title }}

      - name: Verify the pull request touches only the manifest
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          MANIFEST: ${{ steps.update.outputs.manifest_path }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${GH_REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if [ "$files" != "$MANIFEST" ]; then
            echo "::error::pull request touches unexpected paths:"
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Post the pnpm packageManager evidence status
        # Gated on the PR NUMBER, not the head SHA. Gating on the head SHA meant
        # a run that created a pull request but reported no head SHA skipped the
        # status silently and went green — a PR with no evidence, which is the
        # exact state this status exists to make impossible. The missing-SHA
        # case is now a hard failure inside the step, below.
        if: steps.update.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          TARGET: ${{ steps.update.outputs.target }}
          SELECT_MODE: ${{ steps.update.outputs.select_mode }}
          MIN_AGE_DAYS: ${{ inputs.minimum_release_age_days }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_SHA" ]; then
            # Never guess a SHA here. A status posted to the wrong commit is
            # worse than no status: it reads as evidence for something else.
            echo "::error::pull request #${PR} exists but create-pull-request reported no head SHA, so the 'pnpm-packageManager / evidence' status cannot be posted. Refusing to guess a commit."
            exit 1
          fi
          if [ "$SELECT_MODE" = "bypass" ]; then
            DESC="pnpm ${TARGET}: exact published version, not deprecated, major unchanged, manifest only. Cooldown bypassed — prior pin deprecated."
          else
            DESC="pnpm ${TARGET}: exact published version, not deprecated, ${MIN_AGE_DAYS}d+ old, major unchanged, manifest only."
          fi
          # GitHub truncates at 140. Assert rather than hope: the first draft of
          # the bypass string measured 141 and would have silently lost its tail.
          if [ "${#DESC}" -gt 140 ]; then
            echo "::error::status description is ${#DESC} chars, over GitHub's 140 limit: $DESC"
            exit 1
          fi
          gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="pnpm-packageManager / evidence" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
