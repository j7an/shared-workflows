name: Tag Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (auto = infer from conventional commits since last tag)"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      tag-prefix:
        description: "Tag prefix (e.g. 'v' for v1.2.3, 'tools/v' for tools/v1.2.3)"
        type: string
        required: false
        default: "v"
  workflow_call:
    inputs:
      bump:
        type: string
        required: false
        default: auto
        description: "Semver bump (auto/patch/minor/major)"
      tag-prefix:
        type: string
        required: false
        default: "v"
        description: "Tag prefix (e.g. 'v' for v1.2.3, 'tools/v' for tools/v1.2.3)"
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        required: true
    outputs:
      tag:
        description: "The semver tag that was created (e.g. v1.2.3)"
        value: ${{ jobs.release.outputs.tag }}

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    # Releases must originate from main's latest commit. workflow_dispatch
    # lets the operator pick any branch in the Actions UI, so we gate
    # explicitly instead of relying on trust.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.compute.outputs.source_sha }}
      first_release: ${{ steps.compute.outputs.first_release }}
      latest_tag: ${{ steps.compute.outputs.latest_tag }}
      latest_ref_sha: ${{ steps.compute.outputs.latest_ref_sha }}
      latest_commit_sha: ${{ steps.compute.outputs.latest_commit_sha }}
      tag_snapshot_sha256: ${{ steps.compute.outputs.tag_snapshot_sha256 }}
      next_tag: ${{ steps.compute.outputs.next_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute release plan
        id: compute
        env:
          CHOICE: ${{ inputs.bump }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          PREFIX="${TAG_PREFIX:-v}"

          # Reject prefixes containing characters that would break `git tag -l`
          # globbing or shell expansion. Allow alnum, '/', '-', '_', '.'.
          if ! printf '%s' "$PREFIX" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid tag-prefix '$PREFIX' (must match [A-Za-z0-9._/-]+)"
            exit 1
          fi

          # --- Find previous tag ---
          LATEST=$(git tag -l "${PREFIX}*.*.*" --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="${PREFIX}0.0.0"
            FIRST_RELEASE="true"
            echo "No existing semver tags — bootstrapping from ${LATEST}"
          else
            FIRST_RELEASE="false"
            echo "Latest tag: $LATEST"
          fi

          # --- Collect commits since LATEST ---
          if [ "$FIRST_RELEASE" = "true" ]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi

          # Subjects only (for display in the step summary)
          SUBJECTS=$(git log --format='%s' "$RANGE")
          # Full messages (subject + body) for BREAKING CHANGE detection
          FULL=$(git log --format='%s%n%b%n---COMMIT---' "$RANGE")

          COMMIT_COUNT=$(printf '%s\n' "$SUBJECTS" | grep -c . || true)
          echo "Commits since $LATEST: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            {
              echo "### Release blocked: no commits since $LATEST"
              echo ""
              echo "Refusing to create an empty release. Merge some PRs and try again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No commits since $LATEST, refusing to create empty release"
            exit 1
          fi

          # --- Analyze commits for bump level ---
          ANALYSIS_BUMP="patch"
          ANALYSIS_REASON="no feat or breaking-change markers found"

          if printf '%s\n' "$FULL" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            ANALYSIS_BUMP="major"
            ANALYSIS_REASON="found ! suffix in commit subject (breaking change)"
          elif printf '%s\n' "$FULL" | grep -q 'BREAKING CHANGE'; then
            ANALYSIS_BUMP="major"
            ANALYSIS_REASON="found 'BREAKING CHANGE' in commit body"
          elif printf '%s\n' "$FULL" | grep -qE '^feat(\(.+\))?:'; then
            ANALYSIS_BUMP="minor"
            ANALYSIS_REASON="found feat: prefix"
          fi
          echo "Analysis suggests: $ANALYSIS_BUMP ($ANALYSIS_REASON)"

          # --- Resolve operator choice ---
          if [ "$CHOICE" = "auto" ]; then
            CHOSEN="$ANALYSIS_BUMP"
            CHOICE_NOTE="resolved via auto -> **$CHOSEN**"
            OVERRIDE_WARN=""
          else
            CHOSEN="$CHOICE"
            if [ "$CHOSEN" = "$ANALYSIS_BUMP" ]; then
              CHOICE_NOTE="explicit: **$CHOSEN** (matches analysis)"
              OVERRIDE_WARN=""
            else
              CHOICE_NOTE="explicit: **$CHOSEN** (overrides analysis suggestion of $ANALYSIS_BUMP)"
              OVERRIDE_WARN="> **Operator override:** chose \`$CHOSEN\` but analysis suggested \`$ANALYSIS_BUMP\` ($ANALYSIS_REASON). Verify this is intentional."
            fi
          fi

          # --- Compute next version ---
          VERSION="${LATEST#"${PREFIX}"}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$CHOSEN" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *)
              echo "::error::Unknown bump level: $CHOSEN"
              exit 1
              ;;
          esac

          NEXT_TAG="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT_TAG"

          SOURCE_SHA="${GITHUB_SHA}"
          if [ "$FIRST_RELEASE" = "true" ]; then
            LATEST_OUTPUT=""
            LATEST_REF_SHA=""
            LATEST_COMMIT_SHA=""
          else
            LATEST_OUTPUT="$LATEST"
            LATEST_REF_SHA=$(git rev-parse "refs/tags/$LATEST")
            LATEST_COMMIT_SHA=$(git rev-parse "$LATEST^{commit}")
          fi
          TAG_SNAPSHOT_SHA256=$(
            git for-each-ref \
              --format='%(refname)%09%(objectname)' \
              "refs/tags/${PREFIX}*.*.*" |
              LC_ALL=C sort |
              shasum -a 256 |
              awk '{print $1}'
          )

          # --- Write step summary ---
          {
            echo "### Release $NEXT_TAG ($CHOSEN bump)"
            echo "**Source commit:** \`$SOURCE_SHA\`"
            if [ "$FIRST_RELEASE" = "true" ]; then
              echo "**Previous tag commit:** _none (first release)_"
            else
              echo "**Previous tag commit:** \`$LATEST_COMMIT_SHA\`"
            fi
            echo ""
            echo "**Source:** \`$LATEST\` -> \`$NEXT_TAG\`"
            echo "**Input:** \`$CHOICE\` -> $CHOICE_NOTE"
            echo "**Analysis would have picked:** \`$ANALYSIS_BUMP\` - $ANALYSIS_REASON"
            if [ -n "$OVERRIDE_WARN" ]; then
              echo ""
              echo "$OVERRIDE_WARN"
            fi
            echo ""
            echo "**Commits since $LATEST** ($COMMIT_COUNT):"
            echo ""
            git log --format='- %s (%h)' "$RANGE"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "source_sha=$SOURCE_SHA"
            echo "first_release=$FIRST_RELEASE"
            echo "latest_tag=$LATEST_OUTPUT"
            echo "latest_ref_sha=$LATEST_REF_SHA"
            echo "latest_commit_sha=$LATEST_COMMIT_SHA"
            echo "tag_snapshot_sha256=$TAG_SNAPSHOT_SHA256"
            echo "next_tag=$NEXT_TAG"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Approve and create ${{ needs.plan.outputs.next_tag }}
    needs: plan
    # Gate secret access on a named environment so a malicious workflow edit
    # can't reach RELEASE_BOT_PRIVATE_KEY without passing the environment's
    # branch-policy check (main only).
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Revalidate approved release plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PLANNED_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          PLANNED_FIRST_RELEASE: ${{ needs.plan.outputs.first_release }}
          PLANNED_LATEST_TAG: ${{ needs.plan.outputs.latest_tag }}
          PLANNED_LATEST_REF_SHA: ${{ needs.plan.outputs.latest_ref_sha }}
          PLANNED_LATEST_COMMIT_SHA: ${{ needs.plan.outputs.latest_commit_sha }}
          PLANNED_TAG_SNAPSHOT_SHA256: ${{ needs.plan.outputs.tag_snapshot_sha256 }}
          PLANNED_NEXT_TAG: ${{ needs.plan.outputs.next_tag }}
        run: |
          # --- BEGIN inline:scripts/revalidate-tag-release-plan.sh ---
          revalidate_tag_release_plan() (

          set -euo pipefail

          die_input() {
            printf '::error::revalidate tag-release plan: %s\n' "$1" >&2
            exit 2
          }

          die_state() {
            printf '::error::revalidate tag-release plan: %s\n' "$1" >&2
            exit 1
          }

          require_value() {
            eval "value=\${$1-}"
            [ -n "$value" ] || die_input "$1 is required"
          }

          is_sha1() {
            printf '%s' "$1" | grep -qE '^[0-9a-f]{40}$'
          }

          tag_snapshot_sha256() {
            git for-each-ref \
              --format='%(refname)%09%(objectname)' \
              "refs/tags/${TAG_PREFIX}*.*.*" |
              LC_ALL=C sort |
              shasum -a 256 |
              awk '{print $1}'
          }

          for name in \
            GITHUB_REPOSITORY GH_TOKEN TAG_PREFIX PLANNED_SOURCE_SHA \
            PLANNED_FIRST_RELEASE PLANNED_TAG_SNAPSHOT_SHA256 PLANNED_NEXT_TAG; do
            require_value "$name"
          done

          printf '%s' "$GITHUB_REPOSITORY" |
            grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' ||
            die_input "GITHUB_REPOSITORY must be owner/repo"
          printf '%s' "$TAG_PREFIX" | grep -qE '^[A-Za-z0-9._/-]+$' ||
            die_input "TAG_PREFIX has an invalid shape"
          is_sha1 "$PLANNED_SOURCE_SHA" ||
            die_input "PLANNED_SOURCE_SHA is not a lowercase 40-character SHA"
          printf '%s' "$PLANNED_TAG_SNAPSHOT_SHA256" |
            grep -qE '^[0-9a-f]{64}$' ||
            die_input "PLANNED_TAG_SNAPSHOT_SHA256 is not a lowercase SHA-256"

          case "$PLANNED_FIRST_RELEASE" in
            true|false) ;;
            *) die_input "PLANNED_FIRST_RELEASE must be true or false" ;;
          esac

          version=${PLANNED_NEXT_TAG#"$TAG_PREFIX"}
          [ "$version" != "$PLANNED_NEXT_TAG" ] &&
            printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' ||
            die_input "PLANNED_NEXT_TAG is not the selected prefix plus stable SemVer"

          if [ "$PLANNED_FIRST_RELEASE" = true ]; then
            [ -z "${PLANNED_LATEST_TAG-}" ] ||
              die_input "PLANNED_LATEST_TAG must be empty for a first release"
            [ -z "${PLANNED_LATEST_REF_SHA-}" ] ||
              die_input "PLANNED_LATEST_REF_SHA must be empty for a first release"
            [ -z "${PLANNED_LATEST_COMMIT_SHA-}" ] ||
              die_input "PLANNED_LATEST_COMMIT_SHA must be empty for a first release"
          else
            require_value PLANNED_LATEST_TAG
            require_value PLANNED_LATEST_REF_SHA
            require_value PLANNED_LATEST_COMMIT_SHA
            is_sha1 "$PLANNED_LATEST_REF_SHA" ||
              die_input "PLANNED_LATEST_REF_SHA is not a lowercase 40-character SHA"
            is_sha1 "$PLANNED_LATEST_COMMIT_SHA" ||
              die_input "PLANNED_LATEST_COMMIT_SHA is not a lowercase 40-character SHA"
          fi

          head_sha=$(git rev-parse HEAD 2>/dev/null) ||
            die_state "could not inspect checked-out source"
          [ "$head_sha" = "$PLANNED_SOURCE_SHA" ] ||
            die_state "checked-out source does not match the approved source"

          if ! main_json=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" 2>/dev/null); then
            die_state "could not inspect live main"
          fi
          if ! live_main=$(printf '%s\n' "$main_json" |
            jq -er 'select(.object.type == "commit") | .object.sha |
              select(type == "string")' 2>/dev/null); then
            die_state "live main response was malformed"
          fi
          is_sha1 "$live_main" || die_state "live main response was malformed"
          [ "$live_main" = "$PLANNED_SOURCE_SHA" ] ||
            die_state "main changed after release planning"

          if ! current_latest=$(git tag -l "${TAG_PREFIX}*.*.*" \
            --sort=-version:refname 2>/dev/null | sed -n '1p'); then
            die_state "could not inspect matching tags"
          fi
          if [ -z "$current_latest" ]; then
            current_first_release=true
            current_ref_sha=
            current_commit_sha=
          else
            current_first_release=false
            current_ref_sha=$(git rev-parse "refs/tags/$current_latest" 2>/dev/null) ||
              die_state "could not inspect latest tag ref"
            current_commit_sha=$(git rev-parse "$current_latest^{commit}" 2>/dev/null) ||
              die_state "could not inspect latest tag target"
          fi

          [ "$current_first_release" = "$PLANNED_FIRST_RELEASE" ] ||
            die_state "first-release state changed"
          [ "$current_latest" = "${PLANNED_LATEST_TAG-}" ] ||
            die_state "highest matching tag changed"
          [ "$current_ref_sha" = "${PLANNED_LATEST_REF_SHA-}" ] ||
            die_state "latest tag ref changed"
          [ "$current_commit_sha" = "${PLANNED_LATEST_COMMIT_SHA-}" ] ||
            die_state "latest tag target changed"

          if ! current_digest=$(tag_snapshot_sha256 2>/dev/null); then
            die_state "could not inspect matching tag set"
          fi
          [ "$current_digest" = "$PLANNED_TAG_SNAPSHOT_SHA256" ] ||
            die_state "matching tag set changed"

          if ! matches_json=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${PLANNED_NEXT_TAG}" \
            2>/dev/null); then
            die_state "could not inspect proposed tag"
          fi
          if ! exact_count=$(printf '%s\n' "$matches_json" |
            jq -er --arg ref "refs/tags/$PLANNED_NEXT_TAG" \
              'if type == "array" and
                  all(.[];
                    (.ref | type == "string") and
                    (.object | type == "object") and
                    (.object.type == "commit" or .object.type == "tag") and
                    ((.object.sha | type) == "string") and
                    (.object.sha | test("^[0-9a-f]{40}$")))
               then
                 [.[] | select(.ref == $ref)] | length
               else error("not an array")
               end' 2>/dev/null); then
            die_state "proposed-tag response was malformed"
          fi
          [ "$exact_count" -eq 0 ] || die_state "proposed tag already exists"

          printf 'revalidate tag-release plan: approved release plan is still current\n' >&2
          )
          # --- END inline:scripts/revalidate-tag-release-plan.sh ---
          revalidate_tag_release_plan

      - name: Preflight — verify Release Bot App credentials
        env:
          APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
        run: |
          if [ -z "${APP_ID}" ]; then
            {
              echo "### Release Bot App not configured"
              echo ""
              echo "\`vars.RELEASE_BOT_APP_ID\` is empty. Tag Release needs a GitHub App identity"
              echo "to push tags so that \`release.yml\` fires (the default \`GITHUB_TOKEN\` is"
              echo "suppressed by GitHub's recursion guard)."
              echo ""
              echo "See [README › Release Bot App setup](../../README.md#release-bot-app-setup)"
              echo "for one-time provisioning steps."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Release Bot App not configured (see README#release-bot-app-setup)"
            exit 1
          fi
          echo "Release Bot App ID present: ${APP_ID}"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Least privilege: read for checkout, write for Git Data API
          # content/ref/tag operations (blobs, trees, commits, refs, tags).
          permission-contents: write

      - name: Bump version files
        env:
          NEXT_TAG: ${{ needs.plan.outputs.next_tag }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PLANNED_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PREFIX="${TAG_PREFIX:-v}"
          VERSION="${NEXT_TAG#"${PREFIX}"}"

          # --- BEGIN inline:scripts/bump-version-files.sh ---
          bump_version_files() (
          # bump-version-files.sh — apply version bumps from .version-bump.json
          #
          # Reads .version-bump.json and writes the supplied version into each
          # entry's target. Supports two per-entry forms (mutually exclusive):
          #
          #   { "path": "X.json", "field": "version" }                 — legacy
          #   { "path": "X.json", "path_expr": ".pkg[0].version" }     — new
          #
          # Usage:
          #   ./scripts/bump-version-files.sh <config-path> <version>
          #   VERSION=1.2.3 ./scripts/bump-version-files.sh .version-bump.json
          #
          # Exit codes:
          #   0 — at least one entry was modified (caller should commit)
          #   1 — config error: malformed JSON, missing files array, schema
          #       violation. Caller MUST fail the workflow.
          #   2 — config valid but nothing modified: no config file, or all
          #       entries already up to date, or all entries skipped. Caller
          #       should NOT commit, but workflow continues.

          set -euo pipefail

          # Manifest file path — the unique set of modified paths, consumed by
          # tag-release.yml's Git Data API tree builder. Overridable so parallel
          # test runs and concurrent script invocations don't clobber one
          # another through a shared /tmp file (the default preserves prior
          # behavior).
          BUMP_MODIFIED_FILE="${BUMP_MODIFIED_FILE:-/tmp/bump.modified}"

          # Strict allowlist: identifiers, integer indices, bracket-quoted string keys
          # (npm/composer style: kebab-case, @scope/pkg, dotted paths), and the []
          # iterator (applies-to-every). The jq [*] form is NOT valid jq grammar and
          # stays rejected.
          PATH_EXPR_RE='^\.[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*|\[[0-9]+\]|\["[A-Za-z0-9._@/-]+"\]|\[\])*$'

          validate_path_expr() {
            local expr="$1"
            printf '%s' "$expr" | grep -qE "$PATH_EXPR_RE"
          }

          display_path() {
            local field="$1" path_expr="$2"
            if [ -n "$path_expr" ]; then
              printf '%s' "$path_expr"
            else
              printf '.%s' "$field"
            fi
          }

          read_current() {
            local file="$1" field="$2" path_expr="$3"
            if [ -n "$path_expr" ]; then
              jq -r "$path_expr" "$file"
            else
              jq -r --arg f "$field" '.[$f]' "$file"
            fi
          }

          write_value() {
            local file="$1" field="$2" path_expr="$3" version="$4" tmpfile
            tmpfile=$(mktemp)
            if [ -n "$path_expr" ]; then
              jq --indent 2 --arg v "$version" "$path_expr = \$v" "$file" > "$tmpfile"
            else
              jq --indent 2 --arg f "$field" --arg v "$version" '.[$f] = $v' "$file" > "$tmpfile"
            fi
            mv "$tmpfile" "$file"
          }

          # bump_entry — process one .files[] entry
          # Returns 0 if file was modified, 1 if skipped (any reason).
          bump_entry() {
            local file_path="$1" field="$2" path_expr="$3" version="$4"
            local disp; disp=$(display_path "$field" "$path_expr")

            if [ -n "$path_expr" ] && ! validate_path_expr "$path_expr"; then
              printf '::error file=.version-bump.json::Entry for %q has invalid path_expr %q\n' \
                "$file_path" "$path_expr" >&2
              printf '| `%s` | `%s` | - | skipped (invalid path_expr) |\n' "$file_path" "$disp"
              return 1
            fi

            case "$file_path" in
              /*|*..*)
                printf '::warning::%s contains path traversal or is absolute\n' "$file_path" >&2
                printf '| `%s` | `%s` | - | skipped (unsafe path) |\n' "$file_path" "$disp"
                return 1 ;;
            esac
            if [ ! -f "$file_path" ]; then
              printf '::warning::%s not found\n' "$file_path" >&2
              printf '| `%s` | `%s` | - | skipped (file not found) |\n' "$file_path" "$disp"
              return 1
            fi
            case "$file_path" in
              *.json) ;;
              *)
                printf '::warning::%s is not a JSON file\n' "$file_path" >&2
                printf '| `%s` | `%s` | - | skipped (not JSON) |\n' "$file_path" "$disp"
                return 1 ;;
            esac
            if ! jq -e . "$file_path" >/dev/null 2>&1; then
              printf '::warning::%s is not valid JSON\n' "$file_path" >&2
              printf '| `%s` | `%s` | - | skipped (invalid JSON) |\n' "$file_path" "$disp"
              return 1
            fi

            local current; current=$(read_current "$file_path" "$field" "$path_expr")
            if [ "$current" = "$version" ]; then
              printf '| `%s` | `%s` | `%s` | already up to date |\n' "$file_path" "$disp" "$current"
              return 1
            fi

            write_value "$file_path" "$field" "$path_expr" "$version"
            printf '%s\n' "$file_path" >> "$BUMP_MODIFIED_FILE"
            printf '| `%s` | `%s` | `%s` -> `%s` | updated |\n' \
              "$file_path" "$disp" "$current" "$version"
            return 0
          }

          # --- Main procedural body ---

          config="${1:-.version-bump.json}"
          version="${2:-${VERSION:-}}"
          : "${version:?usage: $0 <config> <version> | VERSION=X $0 [config]}"

          # Manifest of unique modified paths (consumed by tag-release.yml's
          # Git Data API path to build POST /git/trees). Truncate-or-create at
          # start so the file is always a fresh, well-defined snapshot of THIS
          # invocation's modifications. De-dup happens at end of apply pass.
          : > "$BUMP_MODIFIED_FILE"

          if [ ! -f "$config" ]; then
            echo "No $config found, skipping version file bump"
            exit 2
          fi

          if ! jq -e '.files | type == "array" and length > 0' "$config" >/dev/null 2>&1; then
            echo "::error::$config is missing or has an invalid 'files' array" >&2
            exit 1
          fi

          # Schema validation pass — hard fail before touching any file
          while IFS= read -r row; do
            file_path=$(jq -r '.path // ""' <<<"$row")
            field=$(jq -r '.field // ""' <<<"$row")
            path_expr=$(jq -r '.path_expr // ""' <<<"$row")

            if [ -z "$file_path" ]; then
              echo "::error::$config has an entry missing 'path'" >&2
              exit 1
            fi
            if [ -n "$field" ] && [ -n "$path_expr" ]; then
              echo "::error::$config entry for '$file_path' has both 'field' and 'path_expr' (mutually exclusive)" >&2
              exit 1
            fi
            if [ -z "$field" ] && [ -z "$path_expr" ]; then
              echo "::error::$config entry for '$file_path' has neither 'field' nor 'path_expr'" >&2
              exit 1
            fi
          done < <(jq -c '.files[]' "$config")

          # Apply pass — per-entry, accumulates summary
          changed=0
          while IFS= read -r row; do
            file_path=$(jq -r '.path // ""' <<<"$row")
            field=$(jq -r '.field // ""' <<<"$row")
            path_expr=$(jq -r '.path_expr // ""' <<<"$row")
            if bump_entry "$file_path" "$field" "$path_expr" "$version"; then
              changed=1
            fi
          done < <(jq -c '.files[]' "$config")

          # De-dup manifest in place: a single file may appear N times if
          # .version-bump.json has multiple entries against it (see test
          # `multi-entry: two path_expr entries against same file write both`).
          # sort -u keeps the contract that /tmp/bump.modified is a unique set.
          if [ -s "$BUMP_MODIFIED_FILE" ]; then
            sort -u "$BUMP_MODIFIED_FILE" -o "$BUMP_MODIFIED_FILE"
          fi

          if [ "$changed" -eq 1 ]; then
            exit 0
          else
            exit 2
          fi
          )
          # --- END inline:scripts/bump-version-files.sh ---

          set +e
          bump_version_files .version-bump.json "$VERSION" > /tmp/bump.summary
          BUMP_EXIT=$?
          set -e

          case "$BUMP_EXIT" in
            0)
              # --- Git Data API rewrite (spec §3.1) ---
              # BASE_SHA is the source commit captured by the approved plan.
              # Reading refs/heads/main fresh here would race with concurrent
              # pushes (spec §2).
              REPO="${GITHUB_REPOSITORY}"
              BASE_SHA="${PLANNED_SOURCE_SHA}"

              # Step 4 (spec): read parent tree SHA from BASE_SHA's commit.
              PARENT_TREE_SHA=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq '.tree.sha')

              # Steps 3+5: create blobs for each modified file, accumulate
              # tree[] entries, then create the tree. The manifest path must
              # match the one bump_version_files wrote — same default, same
              # BUMP_MODIFIED_FILE override if the step env sets it.
              MANIFEST="${BUMP_MODIFIED_FILE:-/tmp/bump.modified}"
              TREE_ENTRIES='[]'
              while IFS= read -r modified_path; do
                [ -z "$modified_path" ] && continue
                blob_content_b64=$(base64 < "$modified_path" | tr -d '\n')
                blob_sha=$(jq -nc \
                  --arg c "$blob_content_b64" \
                  '{content: $c, encoding: "base64"}' \
                  | gh api -X POST "repos/${REPO}/git/blobs" --input - --jq '.sha')
                TREE_ENTRIES=$(jq --arg p "$modified_path" --arg s "$blob_sha" \
                  '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' \
                  <<<"$TREE_ENTRIES")
              done < "$MANIFEST"

              TREE_SHA=$(jq -nc \
                --arg base "$PARENT_TREE_SHA" \
                --argjson entries "$TREE_ENTRIES" \
                '{base_tree: $base, tree: $entries}' \
                | gh api -X POST "repos/${REPO}/git/trees" --input - --jq '.sha')

              # Step 6: create commit. NO author/committer fields — GitHub
              # auto-signs with the bot/web-flow key only when the request is
              # authenticated as the App AND the body has no identity overrides
              # (spec §3.3).
              NEW_COMMIT_SHA=$(jq -nc \
                --arg msg "chore(release): bump version files to $VERSION" \
                --arg tree "$TREE_SHA" \
                --arg parent "$BASE_SHA" \
                '{message: $msg, tree: $tree, parents: [$parent]}' \
                | gh api -X POST "repos/${REPO}/git/commits" --input - --jq '.sha')

              # Acceptance criterion #2 (spec §6): bump commit MUST verify.
              # Verify the commit OBJECT *before* advancing main. A commit is
              # addressable by SHA the instant POST /git/commits returns —
              # independent of any ref — so this check needs no branch update
              # first. Verifying first means a verification failure (or a
              # failed lookup) leaves main untouched: no dangling unverified
              # commit for a later rerun to pick up via the no-bump path.
              # Note jq path: GET /git/commits/{sha} returns the raw Git commit
              # object with `verification` at the TOP level. The higher-level
              # /commits/{sha} endpoint (no `git/` prefix) wraps it as
              # `.commit.verification` — do NOT confuse the two.
              VERIFIED=$(gh api "repos/${REPO}/git/commits/${NEW_COMMIT_SHA}" \
                --jq '.verification.verified')
              REASON=$(gh api "repos/${REPO}/git/commits/${NEW_COMMIT_SHA}" \
                --jq '.verification.reason')
              if [ "$VERIFIED" != "true" ]; then
                echo "::error::Bump commit ${NEW_COMMIT_SHA} did not auto-sign (verified=${VERIFIED} reason=${REASON})"
                echo "::error::This means the API rewrite is not satisfying the required_signatures rule — investigate before proceeding."
                exit 1
              fi

              # Step 7: fast-forward main to the verified commit. force=false
              # (default). 422 = non-fast-forward = main moved past BASE_SHA
              # after checkout → fail the run loudly (spec §3.1 step 7,
              # race-detection backstop).
              #
              # RECOVERY NOTE: this PATCH is the point of no return for main.
              # If the run fails AFTER this succeeds but before the tag is
              # created, do NOT use GitHub's "Re-run failed jobs" — it reuses
              # the original GITHUB_SHA, recreates a sibling bump commit
              # (different timestamp → different SHA), and this non-force PATCH
              # will 422 (non-fast-forward). Recover with a fresh
              # `workflow_dispatch` from main, using the SAME `bump` and
              # `tag-prefix` inputs as the failed run. The plan
              # derives the version from the last *tag* — still unchanged,
              # since the tag was never created — so a different `bump` (e.g.
              # `auto` in place of an explicit override) or `tag-prefix` would
              # recompute a different version and create a second, wrong bump
              # commit instead of taking the no-bump path. With the same
              # inputs the recomputed version matches the already-bumped
              # files: the bump step takes the no-bump path, tag points at it.
              gh api -X PATCH "repos/${REPO}/git/refs/heads/main" \
                -f sha="$NEW_COMMIT_SHA" \
                -F force=false

              # Export TAG_TARGET_SHA for the Create-and-push-tag step.
              echo "TAG_TARGET_SHA=${NEW_COMMIT_SHA}" >> "$GITHUB_ENV"
              RESULT="Committed and pushed version file updates via Git Data API (sha: ${NEW_COMMIT_SHA}, verified: true, reason: ${REASON})"
              # Operator-facing recovery guidance, surfaced in the step summary
              # below. Set only on this path — case 0 is the only one that
              # advances main, so it is the only partial-failure-recoverable
              # state. See the RECOVERY NOTE on the PATCH above.
              RECOVERY_HINT="> **Partial-failure recovery:** \`main\` now carries this bump commit. If a later step fails, do NOT use GitHub's \"Re-run failed jobs\" — start a fresh \`workflow_dispatch\` from \`main\` with the **same \`bump\` and \`tag-prefix\` inputs** used for this run."
              ;;
            1)
              echo "::error::Bump version files step failed due to .version-bump.json error"
              exit 1
              ;;
            2)
              # No bump created. The commit to tag is exactly the commit that
              # approved plan semver-analyzed — i.e. the planned
              # source SHA. Reading
              # live refs/heads/main here instead would race with concurrent
              # pushes (spec §2) and could tag a commit that was never
              # analyzed, publishing it under a bump computed from a different
              # tree. PLANNED_SOURCE_SHA also covers rerun-after-partial-failure:
              # a fresh dispatch resolves it to current main HEAD anyway.
              echo "TAG_TARGET_SHA=${PLANNED_SOURCE_SHA}" >> "$GITHUB_ENV"
              RESULT="No changes — config absent, all up to date, or all entries skipped (tag will point at analyzed commit: ${PLANNED_SOURCE_SHA})"
              ;;
            *)
              echo "::error::bump-version-files.sh exited with unexpected code $BUMP_EXIT"
              exit 1
              ;;
          esac

          {
            echo "### Version file bump"
            echo ""
            echo "**Target version:** \`$VERSION\`"
            echo ""
            echo "| File | Path | Version | Status |"
            echo "|------|------|---------|--------|"
            cat /tmp/bump.summary
            echo ""
            echo "$RESULT"
            if [ -n "${RECOVERY_HINT:-}" ]; then
              echo ""
              echo "$RECOVERY_HINT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push tag
        id: create-tag
        env:
          NEXT_TAG: ${{ needs.plan.outputs.next_tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # TAG_TARGET_SHA is set by the prior "Bump version files" step:
          #   - case 0: the new bump commit's SHA (returned by POST /git/commits)
          #   - case 2: PLANNED_SOURCE_SHA — the semver-analyzed commit, no ref read
          #            (spec §2 / review Finding 1)
          # Either way, NEVER from local checkout state (spec §2).
          REPO="${GITHUB_REPOSITORY}"

          if [ -z "${TAG_TARGET_SHA:-}" ]; then
            echo "::error::TAG_TARGET_SHA not set by Bump version files step — workflow contract violated"
            exit 1
          fi

          if ! LIVE_MAIN_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" \
            --jq 'select(.object.type == "commit") | .object.sha' 2>/dev/null); then
            echo "::error::Could not verify live main immediately before tag creation"
            exit 1
          fi
          if [ "$LIVE_MAIN_SHA" != "$TAG_TARGET_SHA" ]; then
            echo "::error::Main changed before tag creation; expected ${TAG_TARGET_SHA}"
            exit 1
          fi

          # Create a lightweight tag ref directly to the target commit.
          # Do not create an annotated tag object; GitHub does not auto-sign
          # App-created tag objects under the release provenance model we need.
          gh api -X POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${NEXT_TAG}" \
            -f sha="$TAG_TARGET_SHA"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

          TARGET_VERIFIED=$(gh api "repos/${REPO}/git/commits/${TAG_TARGET_SHA}" --jq '.verification.verified' 2>/dev/null || printf 'unknown')
          TARGET_REASON=$(gh api "repos/${REPO}/git/commits/${TAG_TARGET_SHA}" --jq '.verification.reason' 2>/dev/null || printf 'unavailable')

          {
            echo "### Tag created"
            echo ""
            echo "**Tag:** \`$NEXT_TAG\`"
            echo "**Target commit SHA:** \`$TAG_TARGET_SHA\`"
            echo "**Target commit verification:** \`verified=$TARGET_VERIFIED\` \`reason=$TARGET_REASON\`"
            echo ""
            echo "Tag created as a lightweight ref via the GitHub API. Target verification is reported here; only workflow-created bump commits are hard-gated before \`main\` advances."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Tag $NEXT_TAG created as lightweight ref to ${TAG_TARGET_SHA} (target verified=$TARGET_VERIFIED reason=$TARGET_REASON)."
