name: Dependency Safety

on:
  workflow_call:
    inputs:
      enable_scorecard:
        type: boolean
        default: true
        description: "Include OpenSSF Scorecard in scan results"
      auto_merge:
        type: boolean
        default: true
        description: "Auto-merge clean PRs after scan completes. Default on; set false for manual merges (required if the caller grants only contents: read)."
      release_age_policy:
        type: string
        default: "off"
        description: "Release-age verification policy: off (default - no age lookup), advisory (label + comment on young targets, gate stays green, auto-merge suppressed), blocking (gate fails on young targets). Quote off in caller YAML."
      minimum_release_age_days:
        type: number
        default: 5
        description: "Threshold used when release_age_policy is advisory or blocking; ignored when off. Should match cooldown.default-days in your dependabot.yml."

jobs:
  scan:
    runs-on: ubuntu-latest
    # Gate discipline (see #29): `Set initial status` must be the first
    # step after `Harden runner`. Every subsequent step must carry
    # `if: steps.gate.outputs.skip == 'false'` unless it is itself part
    # of the gate. This avoids making non-bot PRs pay for fallible work
    # (cross-repo fetches, API calls, script execution) that would only
    # be used for Dependabot PRs.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Set initial status
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" != "dependabot[bot]" ]]; then
            # Non-bot PR: post a neutral success and skip the scan. The status
            # write can fail on external fork PRs, where GitHub downgrades the
            # token to read-only even when the caller declares statuses: write.
            # Treat ONLY that known denial as expected (notice, stay green); any
            # other failure still aborts. Do NOT extend this handling to the
            # bot/pending or final status writes — those stay fail-loud. See
            # README › Fork PRs and the required gate.
            if err=$(gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state="success" \
              -f context="dependency-safety / gate" \
              -f description="Non-bot PR — no cool-down required" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" 2>&1); then
              :  # posted (same-repo non-bot PR) — behaviorally unchanged
            elif printf '%s' "$err" | grep -q "Resource not accessible by integration" \
              && printf '%s' "$err" | grep -Eq 'HTTP 403|"status":"403"'; then
              MSG="dependency-safety: cannot post the 'dependency-safety / gate' commit status — read-only token or missing statuses:write permission. On external fork PRs this is expected; see README › Fork PRs and the required gate."
              echo "::notice::${MSG}"
              echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '%s\n' "$err" >&2
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state="pending" \
              -f context="dependency-safety / gate" \
              -f description="Scanning dependencies for known exploits..." \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan and report
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ENABLE_SCORECARD: ${{ inputs.enable_scorecard }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
          # COOLDOWN_DAYS is intentionally named for the inlined check-release-age.sh,
          # which requires that env name unchanged from its standalone-script form.
          # MINIMUM_RELEASE_AGE_DAYS feeds safety-verdict.sh and human-readable strings.
          COOLDOWN_DAYS: ${{ inputs.minimum_release_age_days }}
          MINIMUM_RELEASE_AGE_DAYS: ${{ inputs.minimum_release_age_days }}
          RELEASE_AGE_POLICY: ${{ inputs.release_age_policy }}
        run: |
          # --- BEGIN inline:scripts/extract-deps.sh ---
          extract_deps() (
          # extract-deps.sh — parse unified diff on stdin, emit dependency TSV on stdout
          #
          # Output: <name>\t<version>\t<ecosystem>  where ecosystem ∈ {actions, pypi}
          # Exit:   0 on success (possibly zero rows), 2 on malformed input
          #
          # Handles THREE shapes observed in real PR diffs:
          #   1. GitHub Actions `uses:` lines (single-line name@version)
          #   2. pip/requirements `name==version` single-line format
          #   3. TOML lockfile [[package]] stanzas (uv.lock, poetry.lock) where the
          #      name line may be on an unchanged context line while only the version
          #      is `+`-prefixed — section-aware parsing required.
          #
          # The TOML lockfile parser addresses issue #52: Dependabot bumps to uv.lock
          # and poetry.lock previously yielded zero rows, cascading to silent-green
          # cooldown gates on unscanned code.

          set -euo pipefail

          # pypi-shape lockfiles only. Cargo.lock / package-lock.json would need
          # downstream ecosystem support (registry clients, OSV enums) before rows
          # could be scanned — the fail-loud guard in dependency-safety.yml covers
          # unhandled lockfiles.
          filename_to_ecosystem() {
            case "$1" in
              uv.lock|poetry.lock) echo "pypi" ;;
              *) echo "" ;;
            esac
          }

          # Dedup sentinel: newline-delimited list of "ecosystem:name" keys.
          # Plain string (not `declare -A`) for bash 3.2 compatibility — macOS ships
          # bash 3.2 and bats invokes bash directly.
          seen=$'\n'
          rows=()

          # Lockfile parser state
          current_file=""
          current_name=""
          current_ecosystem=""

          input=$(cat)

          # Empty input → exit 0 with no output
          if [ -z "$input" ]; then
            exit 0
          fi

          # Malformed input detection: here-string (not pipeline) to avoid SIGPIPE
          # under pipefail on large valid diffs (issue #50).
          if ! grep -qE '^(\+\+\+|---|@@|diff --git)' <<< "$input"; then
            echo "extract-deps.sh: input is not a unified diff" >&2
            exit 2
          fi

          while IFS= read -r line; do
            # Strip CR for CRLF-encoded diffs
            line="${line%$'\r'}"

            # --- Branch 1: diff --git file header — track current file/ecosystem ---
            if [[ "$line" =~ ^diff[[:space:]]--git[[:space:]]a/([^[:space:]]+)[[:space:]]b/([^[:space:]]+) ]]; then
              current_file="${BASH_REMATCH[2]##*/}"
              current_ecosystem=$(filename_to_ecosystem "$current_file")
              current_name=""
              continue
            fi

            # Skip diff file headers (+++ b/path)
            [[ "$line" == +++* ]] && continue

            # --- Branch 3: [[package]] stanza boundary (context or +, not -) ---
            if [ -n "$current_ecosystem" ] && [[ "$line" =~ ^[+\ ][[:space:]]*\[\[package\]\] ]]; then
              current_name=""
              continue
            fi

            # --- Branch 4: name = "..." line (context or +, not -) ---
            if [ -n "$current_ecosystem" ] && [[ "$line" =~ ^[+\ ][[:space:]]*name[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              current_name="${BASH_REMATCH[1]}"
              continue
            fi

            # --- Branch 5: + version = "..." line (only + lines emit rows) ---
            if [ -n "$current_ecosystem" ] && [ -n "$current_name" ] \
               && [[ "$line" =~ ^\+[[:space:]]*version[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              key="$current_ecosystem:$current_name"
              case "$seen" in *$'\n'"$key"$'\n'*) continue ;; esac
              seen="${seen}${key}"$'\n'
              rows+=("$current_name"$'\t'"${BASH_REMATCH[1]}"$'\t'"$current_ecosystem")
              continue
            fi

            # --- GitHub Actions parser (existing, unchanged) ---
            if [[ "$line" =~ ^\+[[:space:]]+(-[[:space:]]+)?uses:[[:space:]]+([^[:space:]@]+)@[^[:space:]]+(.*)$ ]]; then
              name="${BASH_REMATCH[2]}"
              rest="${BASH_REMATCH[3]}"

              [[ "$name" == ./* ]] && continue
              [[ "$name" == docker://* ]] && continue

              version=""
              if [[ "$rest" =~ \#[[:space:]]*v?([0-9][0-9.]*) ]]; then
                version="${BASH_REMATCH[1]}"
              fi

              key="actions:$name"
              case "$seen" in *$'\n'"$key"$'\n'*) continue ;; esac
              seen="${seen}${key}"$'\n'
              rows+=("$name"$'\t'"$version"$'\t'"actions")
              continue
            fi

            # --- Python deps parser (existing, unchanged) ---
            [[ "$line" =~ ^\+[[:space:]]*# ]] && continue

            if [[ "$line" =~ ^\+[[:space:]]*([a-zA-Z][a-zA-Z0-9_.\-]*)[[:space:]]*(==|\>=|\<=|~=|\!=|\>|\<)[[:space:]]*([0-9][0-9a-zA-Z.\-]*) ]]; then
              name="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[3]}"
              key="pypi:$name"
              case "$seen" in *$'\n'"$key"$'\n'*) continue ;; esac
              seen="${seen}${key}"$'\n'
              rows+=("$name"$'\t'"$version"$'\t'"pypi")
              continue
            fi
          done <<< "$input"

          if [ ${#rows[@]} -gt 0 ]; then
            printf '%s\n' "${rows[@]}" | sort -t$'\t' -k1,1
          fi
          )
          # --- END inline:scripts/extract-deps.sh ---

          # --- BEGIN inline:scripts/diff-touches-lockfile.sh ---
          diff_touches_lockfile() (
          # diff-touches-lockfile.sh — detect dependency-relevant file edits in a
          # unified diff (lockfiles, manifests, and GitHub Actions workflow YAMLs).
          # Used by dependency-safety.yml's fail-loud guard to refuse green gates
          # when the dep extractor returns zero rows on a diff that touches files
          # which *should* have produced deps.
          #
          # Input:  unified diff on stdin
          # Output: matched paths (b/ side of diff --git headers), sorted & deduped,
          #         one per line; empty stdout if nothing matched.
          # Exit:   0 if any dependency-relevant path touched, 1 if none, 2 on malformed input.

          set -euo pipefail

          input=$(cat)

          if [ -z "$input" ]; then
            exit 1
          fi

          if ! grep -qE '^diff --git ' <<< "$input"; then
            echo "diff-touches-lockfile.sh: input is not a unified diff" >&2
            exit 2
          fi

          matches=()
          while IFS= read -r path; do
            base="${path##*/}"
            # Add new lockfile/manifest filename patterns to this case list as needed.
            case "$base" in
              *.lock|requirements*.txt|pyproject.toml|Pipfile|go.mod|Cargo.toml \
                |package.json|package-lock.json|yarn.lock|pnpm-lock.yaml)
                matches+=("$path")
                continue
                ;;
            esac
            # GitHub Actions workflow YAMLs are dependency declarations (uses: lines).
            # Matched by full path, not basename, to avoid over-triggering on any *.yml.
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                matches+=("$path")
                ;;
            esac
          done < <(grep -oE '^diff --git a/[^ ]+ b/[^ ]+' <<< "$input" \
                   | sed -E 's|^diff --git a/[^ ]+ b/||')

          if [ ${#matches[@]} -eq 0 ]; then
            exit 1
          fi

          printf '%s\n' "${matches[@]}" | sort -u
          )
          # --- END inline:scripts/diff-touches-lockfile.sh ---

          # --- BEGIN inline:scripts/classify-touched-paths.sh ---
          classify_touched_paths() (
          # classify-touched-paths.sh — filter dependency-relevant paths down to
          # those that extract-deps.sh does NOT parse.
          #
          # Input:  newline-delimited paths on stdin (typically the output of
          #         diff-touches-lockfile.sh).
          # Output: subset of input paths whose filename/location is NOT in the
          #         extract-deps.sh supported set, sorted & deduped, one per line.
          #         Empty stdout when every input path is supported.
          # Exit:   0 on success (zero or more output rows). No exit-2 path: malformed
          #         input here is "an unrecognised filename" which is exactly what we
          #         report on stdout.
          #
          # Supported set (must stay in sync with scripts/extract-deps.sh):
          #   - .github/workflows/*.yml | *.yaml  (GitHub Actions `uses:` line parser)
          #   - uv.lock | poetry.lock             (TOML [[package]] stanza parser)
          #   - requirements*.txt                 (pip line-shape parser)
          #
          # `requirements*.txt` is supported by line-shape parsing, not by a full
          # requirements-file parser. The extractor recognizes added requirement lines
          # with operators ==, >=, <=, ~=, !=, >, or < and a numeric version prefix;
          # comments, includes like `-r other.txt`, hash/check option lines, and other
          # requirements-file structure are ignored. Standard Dependabot bumps reliably
          # surface as added pinned requirement lines, which is what we promise.
          #
          # Everything else diff-touches-lockfile.sh emits — pyproject.toml, Pipfile,
          # Pipfile.lock, go.mod, Cargo.toml, Cargo.lock, package.json,
          # package-lock.json, yarn.lock, pnpm-lock.yaml, and any other *.lock — is
          # unsupported and printed to stdout. Layer 2 (PR-body fallback) may still
          # recover deps from some of these for the scan loop, but the guard fires
          # because the diff parser cannot prove the scan was complete.
          #
          # pyproject.toml is path-level unsupported here and may be cleared by
          # scripts/pyproject-bump-extract.sh at the workflow composition layer
          # when its hunks are proven to be bump-only. This script remains
          # path-only and intentionally conservative; the final unsupported set
          # in the workflow is produced by composition, not by this classifier
          # alone.

          set -euo pipefail

          while IFS= read -r path || [ -n "$path" ]; do
            [ -z "$path" ] && continue
            base="${path##*/}"

            # Supported (drop from output).
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml) continue ;;
            esac
            case "$base" in
              uv.lock|poetry.lock) continue ;;
              requirements*.txt)   continue ;;
            esac

            # Anything else: emit as unsupported.
            printf '%s\n' "$path"
          done | sort -u
          )
          # --- END inline:scripts/classify-touched-paths.sh ---

          # --- BEGIN inline:scripts/pyproject-bump-extract.sh ---
          pyproject_bump_extract() (
          # pyproject-bump-extract.sh — diff-aware extractor for pyproject.toml bump-only edits.
          #
          # Owns all pyproject.toml diff semantics for the dependency-safety
          # workflow. Recognizes the narrow set of bump shapes Dependabot emits for
          # uv/poetry ecosystems and emits either extracted dep rows (mode=deps) or
          # the paths it proved are bump-only (mode=cleared-paths). Files with any
          # unparseable changed line (build-system edits, new-dep additions, marker
          # changes, etc.) are disqualified and left unsupported so the existing
          # fail-loud guard fires.
          #
          # Input:  unified diff on stdin
          # Flag:   --mode=deps  OR  --mode=cleared-paths  (exactly one, required)
          # Output (deps):          TSV <name>\t<version>\tpypi, sorted by name, deduped
          # Output (cleared-paths): newline-delimited pyproject.toml paths, sorted, deduped
          # Exit:   0 on success (possibly zero rows / zero paths)
          #         2 on malformed input, missing --mode, unknown mode, or repeated --mode
          #
          # Bash 3.2 compatible: no `declare -A`, no `mapfile`/`readarray`. Dedup uses a
          # newline-delimited string sentinel, matching scripts/extract-deps.sh.
          #
          # See docs/superpowers/specs/2026-05-23-pyproject-toml-parser-design.md.
          
          set -euo pipefail
          
          MODE=""
          for arg in "$@"; do
            case "$arg" in
              --mode=deps|--mode=cleared-paths)
                if [ -n "$MODE" ]; then
                  echo "pyproject-bump-extract.sh: --mode specified more than once" >&2
                  exit 2
                fi
                MODE="${arg#--mode=}"
                ;;
              *)
                echo "pyproject-bump-extract.sh: unknown argument: $arg" >&2
                exit 2
                ;;
            esac
          done
          
          if [ -z "$MODE" ]; then
            echo "pyproject-bump-extract.sh: --mode=deps or --mode=cleared-paths required" >&2
            exit 2
          fi
          
          input=$(cat)
          
          # Empty input → exit 0 with no output (matches extract-deps.sh).
          if [ -z "$input" ]; then
            exit 0
          fi
          
          # Malformed input detection: here-string (not pipeline) to avoid SIGPIPE under
          # pipefail on large valid diffs (issue #50 pattern).
          if ! grep -qE '^(\+\+\+|---|@@|diff --git)' <<< "$input"; then
            echo "pyproject-bump-extract.sh: input is not a unified diff" >&2
            exit 2
          fi
          
          # --- Parser state ---
          # Per-file (reset on each diff --git boundary):
          current_path=""
          current_basename=""
          current_table=""        # "" | "project_other" | "project_optional_deps" | "dependency_groups"
                                  # | "tool_uv" | "poetry_main" | "poetry_group" | "poetry_dev"
                                  # | "build_system" | "other"
          current_key=""          # array-opening key for tables where keys are dep arrays
          verdict="clean"
          file_rows=$'\n'
          
          # Global:
          out_deps_rows=()
          out_cleared_paths=()
          seen=$'\n'              # dedup sentinel "\npypi:<name>\n"
          
          # Single pending tracker. Lifetime = exactly one line. If pending is set,
          # the IMMEDIATELY NEXT line MUST be the matching + (same kind, same name,
          # same skeleton). Anything else (other -, unmatched +, context, comment,
          # header, hunk boundary, file boundary, EOF) disqualifies.
          pending_kind=""         # "" | "pep508" | "poetry_keyval" | "poetry_inline"
          pending_name=""
          pending_skeleton=""     # entry with version-spec field substituted by sentinel
          pending_minus_version=""
          
          # --- Helpers ---
          
          # extract_target_version "$spec" — §3.3.1. Prints target on stdout, returns 1 on disqualify.
          extract_target_version() {
            local spec="$1" stripped
            spec="${spec#"${spec%%[![:space:]]*}"}"
            spec="${spec%"${spec##*[![:space:]]}"}"
            case "$spec" in *,*) return 1 ;; esac
            case "$spec" in
              \^*)    stripped="${spec#\^}" ;;
              \~=*)   stripped="${spec#~=}" ;;
              \~*)    stripped="${spec#~}" ;;
              \>=*)   stripped="${spec#>=}" ;;
              ==*)    stripped="${spec#==}" ;;
              \<*|\<=*|\>*|!=*) return 1 ;;
              *)      stripped="$spec" ;;
            esac
            stripped="${stripped#"${stripped%%[![:space:]]*}"}"
            stripped="${stripped%"${stripped##*[![:space:]]}"}"
            if [[ "$stripped" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc|alpha|beta)[0-9]*)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
              printf '%s' "$stripped"
              return 0
            fi
            return 1
          }
          
          # parse_pep508_entry "$content" — captures name/extras/version_spec/marker.
          # Sets _pep_name, _pep_extras (with brackets, or empty), _pep_version_spec,
          # _pep_marker (with leading ';', or empty). Returns 0/1.
          parse_pep508_entry() {
            local content="$1" trimmed
            _pep_name=""; _pep_extras=""; _pep_version_spec=""; _pep_marker=""
            if [[ "$content" =~ ^[[:space:]]*\"([A-Za-z][A-Za-z0-9_.-]*)(\[[^]]*\])?([^\";]*)(;.*)?\"[[:space:]]*,?[[:space:]]*$ ]]; then
              _pep_name="${BASH_REMATCH[1]}"
              _pep_extras="${BASH_REMATCH[2]}"
              _pep_version_spec="${BASH_REMATCH[3]}"
              _pep_marker="${BASH_REMATCH[4]}"
              # Validate: non-empty version_spec must start with a PEP 508 operator.
              # Bare versions (e.g., "foo 1.0") are malformed PEP 508 and must not parse.
              trimmed="${_pep_version_spec#"${_pep_version_spec%%[![:space:]]*}"}"
              if [ -n "$trimmed" ]; then
                case "$trimmed" in
                  \^*|\~=*|\~*|\>=*|==*|\<=*|\<*|\>*|!=*) ;;
                  *) return 1 ;;
                esac
              fi
              return 0
            fi
            return 1
          }
          
          # parse_poetry_keyval "$value" — for "spec" form. Sets _poetry_keyval_version.
          parse_poetry_keyval() {
            local value="$1"
            _poetry_keyval_version=""
            if [[ "$value" =~ ^[[:space:]]*\"([^\"]*)\"[[:space:]]*$ ]]; then
              _poetry_keyval_version="${BASH_REMATCH[1]}"
              return 0
            fi
            return 1
          }
          
          # parse_poetry_inline "$value" — for { version = "spec", ... } form.
          # Sets _poetry_inline_version and _poetry_inline_skeleton (version VALUE
          # substituted, surrounding whitespace preserved). Requires `version` to be
          # preceded by start-of-string, comma, or whitespace so `subversion` does
          # not match (Bug 2). Preserves original whitespace around `=` so
          # reformatting that changes spacing is caught (Bug 4).
          parse_poetry_inline() {
            local value="$1" inner
            _poetry_inline_version=""; _poetry_inline_skeleton=""
            if [[ "$value" =~ ^[[:space:]]*\{(.*)\}[[:space:]]*$ ]]; then
              inner="${BASH_REMATCH[1]}"
              if [[ "$inner" =~ (^|[,[:space:]])version[[:space:]]*=[[:space:]]*\"([^\"]*)\" ]]; then
                _poetry_inline_version="${BASH_REMATCH[2]}"
                _poetry_inline_skeleton=$(printf '%s' "$inner" | sed -E 's/(^|[,[:space:]])(version[[:space:]]*=[[:space:]]*)"[^"]*"/\1\2"__VER__"/')
                return 0
              fi
            fi
            return 1
          }
          
          # extract_operator "$spec" — returns the operator portion on stdout.
          # "^", "~=", "~", ">=", "==" → printed verbatim; bare version → empty string.
          # Unsupported operators (<, <=, >, !=) → return 1 (caller treats as disqualify).
          extract_operator() {
            local spec="$1" trimmed
            trimmed="${spec#"${spec%%[![:space:]]*}"}"
            case "$trimmed" in
              \^*)   printf '%s' '^' ;;
              \~=*)  printf '%s' '~=' ;;
              \~*)   printf '%s' '~' ;;
              \>=*)  printf '%s' '>=' ;;
              ==*)   printf '%s' '==' ;;
              \<=*|\<*|\>*|!=*) return 1 ;;
              *)     printf '%s' '' ;;
            esac
            return 0
          }
          
          emit_bump() {
            local name="$1" plus_spec="$2" minus_spec="$3" target plus_op minus_op
            if [ "$plus_spec" = "$minus_spec" ]; then verdict="disqualified"; return; fi
            plus_op=$(extract_operator "$plus_spec") || { verdict="disqualified"; return; }
            minus_op=$(extract_operator "$minus_spec") || { verdict="disqualified"; return; }
            if [ "$plus_op" != "$minus_op" ]; then verdict="disqualified"; return; fi
            target=$(extract_target_version "$plus_spec") || { verdict="disqualified"; return; }
            extract_target_version "$minus_spec" >/dev/null || { verdict="disqualified"; return; }
            file_rows="${file_rows}${name}	${target}	pypi"$'\n'
          }
          
          clear_pending() {
            pending_kind=""
            pending_name=""
            pending_skeleton=""
            pending_minus_version=""
          }
          
          flush_pending_as_disqualified() {
            if [ -n "$pending_kind" ]; then
              verdict="disqualified"
              clear_pending
            fi
          }
          
          flush_file() {
            flush_pending_as_disqualified
            if [ -z "$current_basename" ] || [ "$current_basename" != "pyproject.toml" ]; then
              return
            fi
            if [ "$verdict" = "clean" ]; then
              while IFS= read -r row; do
                [ -z "$row" ] && continue
                local name="${row%%	*}"
                local key="pypi:$name"
                case "$seen" in *$'\n'"$key"$'\n'*) continue ;; esac
                seen="${seen}${key}"$'\n'
                out_deps_rows+=("$row")
              done <<< "$file_rows"
              out_cleared_paths+=("$current_path")
            fi
          }
          
          reset_file_state() {
            current_table=""
            current_key=""
            verdict="clean"
            file_rows=$'\n'
            clear_pending
          }
          
          # --- Main parse loop ---
          while IFS= read -r line; do
            line="${line%$'\r'}"
          
            # File boundary.
            if [[ "$line" =~ ^diff[[:space:]]--git[[:space:]]a/([^[:space:]]+)[[:space:]]b/([^[:space:]]+) ]]; then
              flush_file
              current_path="${BASH_REMATCH[2]}"
              current_basename="${current_path##*/}"
              reset_file_state
              continue
            fi
          
            [[ "$line" == +++* ]] && continue
            [[ "$line" == ---* ]] && continue
          
            if [[ "$line" =~ ^@@ ]]; then
              flush_pending_as_disqualified
              current_table=""
              current_key=""
              continue
            fi
          
            [ "$current_basename" != "pyproject.toml" ] && continue
            [ "$verdict" = "disqualified" ] && continue
          
            prefix="${line:0:1}"
            content="${line:1}"
          
            # ---------------- Centralized pending consumption ----------------
            # If pending is set, this line MUST be the matching + (same kind/name/skeleton)
            # or the file is disqualified. No other line type may consume or pass through
            # pending state.
            if [ -n "$pending_kind" ]; then
              consumed=false
              if [ "$prefix" = "+" ]; then
                case "$pending_kind" in
                  pep508)
                    if parse_pep508_entry "$content"; then
                      plus_skeleton="${_pep_name}${_pep_extras}__VER__${_pep_marker}"
                      if [ "$_pep_name" = "$pending_name" ] && [ "$plus_skeleton" = "$pending_skeleton" ]; then
                        emit_bump "$_pep_name" "$_pep_version_spec" "$pending_minus_version"
                        consumed=true
                      fi
                    fi
                    ;;
                  poetry_keyval)
                    if [[ "$content" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_-]*)[[:space:]]*=[[:space:]]*(.*)$ ]]; then
                      plus_key="${BASH_REMATCH[1]}"
                      plus_value="${BASH_REMATCH[2]}"
                      if [ "$plus_key" = "$pending_name" ] && parse_poetry_keyval "$plus_value"; then
                        emit_bump "$plus_key" "$_poetry_keyval_version" "$pending_minus_version"
                        consumed=true
                      fi
                    fi
                    ;;
                  poetry_inline)
                    if [[ "$content" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_-]*)[[:space:]]*=[[:space:]]*(.*)$ ]]; then
                      plus_key="${BASH_REMATCH[1]}"
                      plus_value="${BASH_REMATCH[2]}"
                      if [ "$plus_key" = "$pending_name" ] && parse_poetry_inline "$plus_value"; then
                        if [ "$_poetry_inline_skeleton" = "$pending_skeleton" ]; then
                          emit_bump "$plus_key" "$_poetry_inline_version" "$pending_minus_version"
                          consumed=true
                        fi
                      fi
                    fi
                    ;;
                esac
              fi
              clear_pending
              if [ "$consumed" = "false" ]; then
                verdict="disqualified"
              fi
              continue
            fi
            # ---------------- End pending consumption ----------------
          
            # Comment / whitespace allowance anywhere (§3.4 rule 2).
            if [[ "$content" =~ ^[[:space:]]*# ]]; then continue; fi
            if [[ "$content" =~ ^[[:space:]]*$ ]]; then continue; fi
          
            # Table header detection.
            if [[ "$content" =~ ^[[:space:]]*\[([^]]+)\] ]]; then
              header="${BASH_REMATCH[1]}"
              case "$header" in
                project)                          current_table="project_other"; current_key="" ;;
                project.optional-dependencies)    current_table="project_optional_deps"; current_key="" ;;
                dependency-groups)                current_table="dependency_groups"; current_key="" ;;
                tool.uv)                          current_table="tool_uv"; current_key="" ;;
                tool.poetry.dependencies)         current_table="poetry_main"; current_key="" ;;
                tool.poetry.dev-dependencies)     current_table="poetry_dev"; current_key="" ;;
                build-system)                     current_table="build_system"; current_key="" ;;
                *)
                  case "$header" in
                    tool.poetry.group.*.dependencies) current_table="poetry_group"; current_key="" ;;
                    *) current_table="other"; current_key="" ;;
                  esac
                  ;;
              esac
              # Changed table header = structural change → disqualify.
              if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
              continue
            fi
          
            # Key = ... line — per-table routing.
            if [[ "$content" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_-]*)[[:space:]]*=[[:space:]]*(.*)$ ]]; then
              key="${BASH_REMATCH[1]}"
              value="${BASH_REMATCH[2]}"
              case "$current_table" in
                project_other)
                  if [ "$key" = "dependencies" ]; then
                    # `dependencies = [` on +/- = structural change.
                    if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; continue; fi
                    current_key="dependencies"
                  else
                    # Any other [project] key on +/- (name, version, description, ...) disqualifies.
                    current_key=""
                    if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
                  fi
                  ;;
                project_optional_deps|dependency_groups)
                  # Adding/renaming an extras key or dep group is structural.
                  if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; continue; fi
                  current_key="$key"
                  ;;
                tool_uv)
                  case "$key" in
                    constraint-dependencies|override-dependencies)
                      if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; continue; fi
                      current_key="$key"
                      ;;
                    *)
                      current_key=""
                      if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
                      ;;
                  esac
                  ;;
                poetry_main|poetry_group|poetry_dev)
                  if [ "$key" = "python" ]; then
                    if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
                    continue
                  fi
                  # String form? Try first.
                  if parse_poetry_keyval "$value"; then
                    if [ "$prefix" = "-" ]; then
                      pending_kind="poetry_keyval"
                      pending_name="$key"
                      pending_skeleton=""
                      pending_minus_version="$_poetry_keyval_version"
                      continue
                    fi
                    if [ "$prefix" = "+" ]; then
                      # Unmatched + (no preceding -) → new-dep addition → disqualify.
                      verdict="disqualified"
                      continue
                    fi
                    # Context line: nothing.
                    continue
                  fi
                  # Inline-table form?
                  if parse_poetry_inline "$value"; then
                    if [ "$prefix" = "-" ]; then
                      pending_kind="poetry_inline"
                      pending_name="$key"
                      pending_skeleton="$_poetry_inline_skeleton"
                      pending_minus_version="$_poetry_inline_version"
                      continue
                    fi
                    if [ "$prefix" = "+" ]; then
                      verdict="disqualified"
                      continue
                    fi
                    continue
                  fi
                  # Unrecognized poetry value form on a changed line → disqualify
                  # (git URL, path, editable, etc.).
                  if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
                  ;;
                build_system|other)
                  if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
                  ;;
              esac
              continue
            fi
          
            # PEP 508 string-in-array entry.
            if parse_pep508_entry "$content"; then
              # Positively-established array context required (Blocker 3).
              in_array=false
              case "$current_table" in
                project_other)
                  [ "$current_key" = "dependencies" ] && in_array=true
                  ;;
                project_optional_deps|dependency_groups)
                  [ -n "$current_key" ] && in_array=true
                  ;;
                tool_uv)
                  case "$current_key" in
                    constraint-dependencies|override-dependencies) in_array=true ;;
                  esac
                  ;;
              esac
              if [ "$in_array" = "false" ]; then
                if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
                continue
              fi
              if [ "$prefix" = "-" ]; then
                pending_kind="pep508"
                pending_name="$_pep_name"
                pending_skeleton="${_pep_name}${_pep_extras}__VER__${_pep_marker}"
                pending_minus_version="$_pep_version_spec"
                continue
              fi
              if [ "$prefix" = "+" ]; then
                # Unmatched + (no preceding -) → new-dep addition → disqualify.
                verdict="disqualified"
                continue
              fi
              continue
            fi
          
            # Closing `]` of an array. On +/- this is reformatting/structural → disqualify.
            # On a context line, the array we were tracking has closed → reset current_key
            # so subsequent PEP 508-shaped lines do not inherit dependency-array context
            # (any later entries need fresh context to re-establish in_array).
            if [[ "$content" =~ ^[[:space:]]*\] ]]; then
              if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
              current_key=""
              continue
            fi
          
            # Anything else changed in pyproject.toml → disqualify.
            if [ "$prefix" = "+" ] || [ "$prefix" = "-" ]; then verdict="disqualified"; fi
          done <<< "$input"
          
          flush_file
          
          if [ "$MODE" = "deps" ]; then
            if [ ${#out_deps_rows[@]} -gt 0 ]; then
              printf '%s\n' "${out_deps_rows[@]}" | sort -t$'\t' -k1,1 -u
            fi
          else
            if [ ${#out_cleared_paths[@]} -gt 0 ]; then
              printf '%s\n' "${out_cleared_paths[@]}" | sort -u
            fi
          fi
          )
          # --- END inline:scripts/pyproject-bump-extract.sh ---

          # --- BEGIN inline:scripts/npm-bump-extract.sh ---
          npm_bump_extract() (
          # npm-bump-extract.sh — diff-aware extractor for package.json + pnpm-lock.yaml.
          #
          # Owns all npm-ecosystem diff semantics for the dependency-safety workflow.
          # Emits tier-1 declared dependency rows (mode=deps), tier-2 newly introduced
          # lockfile versions (mode=lockfile-entries), or the paths it proved parseable
          # (mode=cleared-paths). Files with any unrecognized changed line are
          # disqualified and left unsupported so the fail-loud guard fires.
          #
          # Input:  unified diff on stdin
          # Flag:   --mode=deps | --mode=lockfile-entries | --mode=cleared-paths (exactly one)
          # Output (deps):             TSV <name>\t<version>\tnpm, sorted by name, deduped
          # Output (lockfile-entries): TSV <name>\t<version>\tnpm, sorted by name, deduped
          # Output (cleared-paths):    newline-delimited paths, sorted, deduped
          # Exit:   0 on success (possibly zero rows)
          #         2 on malformed input, missing --mode, repeated --mode, unknown argument
          #
          # Bash 3.2 compatible: no `declare -A`, no `mapfile`/`readarray`. Dedup uses a
          # newline-delimited string sentinel, matching scripts/extract-deps.sh.
          #
          # See docs/superpowers/specs/2026-08-04-npm-pnpm-dependency-safety-design.md.

          set -euo pipefail

          # Maximum tier-2 entries per PR. Exceeding it disqualifies the lockfile rather
          # than truncating the sweep — a truncated scan reported as complete is the one
          # outcome this helper must never produce. 1000 is ~4x the largest observed real
          # Dependabot pnpm PR (253 entries).
          TIER2_MAX_ENTRIES=1000

          # Lockfile format versions this parser understands. The parser keys on the
          # declared format version and on structure, never on which pnpm produced the
          # file — a future divergence must be a clean red gate, not a silent
          # correctness bug.
          SUPPORTED_LOCKFILE_VERSIONS=$'\n9.0\n'

          MODE=""
          for arg in "$@"; do
            case "$arg" in
              --mode=deps|--mode=lockfile-entries|--mode=cleared-paths)
                if [ -n "$MODE" ]; then
                  echo "npm-bump-extract.sh: --mode specified more than once" >&2
                  exit 2
                fi
                MODE="${arg#--mode=}"
                ;;
              *)
                echo "npm-bump-extract.sh: unknown argument: $arg" >&2
                exit 2
                ;;
            esac
          done

          if [ -z "$MODE" ]; then
            echo "npm-bump-extract.sh: --mode=deps, --mode=lockfile-entries, or --mode=cleared-paths required" >&2
            exit 2
          fi

          input=$(cat)

          # Empty input → exit 0 with no output (matches extract-deps.sh).
          if [ -z "$input" ]; then
            exit 0
          fi

          # Malformed input detection: here-string (not pipeline) to avoid SIGPIPE under
          # pipefail on large valid diffs (issue #50 pattern).
          if ! grep -qE '^(\+\+\+|---|@@|diff --git)' <<< "$input"; then
            echo "npm-bump-extract.sh: input is not a unified diff" >&2
            exit 2
          fi

          # --- Path classification ---
          # Only these two filenames are in scope. package-lock.json and yarn.lock are
          # deliberately NOT handled here; they stay unsupported and fail closed.
          classify_path() {
            local path="$1" base="${path##*/}"
            case "$base" in
              pnpm-lock.yaml) printf 'lock' ;;
              package.json)   printf 'manifest' ;;
              *)              printf '' ;;
            esac
          }

          # --- Globals ---
          lock_path=""
          lock_verdict="absent"          # absent | clean | disqualified
          manifest_paths=$'\n'           # newline-delimited, leading+trailing newline
          tier1_rows=()
          tier2_rows=()
          corroborate=$'\n'              # "\n<name>\n" for names whose lock entry changed
          seen_tier1=$'\n'
          seen_tier2=$'\n'

          # disqualify_lock <reason> — mark the lockfile unusable and explain why.
          disqualify_lock() {
            lock_verdict="disqualified"
            echo "npm-bump-extract.sh: ${lock_path:-pnpm-lock.yaml}: $1" >&2
          }

          # Disposition of each pnpm-lock.yaml top-level section (spec §6.1).
          # The complete column-0 key set was taken from a real pnpm 12.0.0-beta.4
          # lockfile. Anything absent from this list disqualifies, so a
          # dependency-bearing section added by a future pnpm release produces a red
          # gate rather than a silent gap in the completeness claim.
          section_disposition() {
            case "$1" in
              importers:|catalogs:)                     printf 'tier1' ;;
              packages:)                                printf 'tier2' ;;
              snapshots:)                               printf 'inert' ;;
              lockfileVersion:)                         printf 'version' ;;
              settings:)                                printf 'disqualify' ;;
              overrides:|patchedDependencies:)          printf 'disqualify' ;;
              pnpmfileChecksum:)                        printf 'disqualify' ;;
              packageExtensionsChecksum:)               printf 'disqualify' ;;
              *)                                        printf 'unknown' ;;
            esac
          }

          # set_section <section-with-colon> — apply a section and its disposition.
          # A disqualifying section only trips the verdict when a line under it actually
          # changed; merely passing through it in context is harmless.
          set_section() {
            current_section="$1"
            current_disposition=$(section_disposition "$1")
            seen_column0=1
            tier2_key_prefix=""
          }

          # base_version <version-string> — strip pnpm's peer-dependency suffix.
          # "21.0.2(@types/node@22.19.9)" → "21.0.2"
          base_version() {
            printf '%s' "${1%%(*}"
          }

          # note_corroborated <name> — record that this dependency's lock entry changed.
          note_corroborated() {
            case "$corroborate" in
              *$'\n'"$1"$'\n'*) return 0 ;;
            esac
            corroborate="${corroborate}${1}"$'\n'
          }

          # emit_tier1 <name> <version>
          # Dedup key is name@version, NOT name. A pnpm workspace can resolve the same
          # package at different versions in different importers; keying on name alone
          # drops one of them and produces a scanned-claim over an unscanned version.
          emit_tier1() {
            local key="$1@$2"
            case "$seen_tier1" in
              *$'\n'"$key"$'\n'*) return 0 ;;
            esac
            seen_tier1="${seen_tier1}${key}"$'\n'
            tier1_rows+=("$1"$'\t'"$2"$'\t'"npm")
          }

          # flush_entry — called at each entry/section/file boundary. Emits a tier-1 row
          # when the base version changed, and records corroboration when either the
          # specifier or the base version changed.
          flush_entry() {
            local name="$1" minus="$2" plus="$3" spec="$4"
            [ -z "$name" ] && return 0
            local mb pb
            mb=$(base_version "$minus")
            pb=$(base_version "$plus")
            if [ -n "$plus" ] && [ "$mb" != "$pb" ]; then
              emit_tier1 "$name" "$pb"
              note_corroborated "$name"
            elif [ "$spec" -eq 1 ]; then
              note_corroborated "$name"
            fi
          }

          # emit_tier2 <name> <version>
          # Keyed on name@version for the same reason as emit_tier1 (§6.4).
          emit_tier2() {
            local key="$1@$2"
            case "$seen_tier2" in
              *$'\n'"$key"$'\n'*) return 0 ;;
            esac
            seen_tier2="${seen_tier2}${key}"$'\n'
            tier2_rows+=("$1"$'\t'"$2"$'\t'"npm")
          }

          # split_package_key <'name@version'> — sets _pkg_name and _pkg_version.
          # Scoped names start with '@', so the split is on the LAST '@'.
          split_package_key() {
            local key="$1"
            _pkg_name="${key%@*}"
            _pkg_version="${key##*@}"
            [ -n "$_pkg_name" ] && [ -n "$_pkg_version" ]
          }

          # Lifecycle-script keys. Corroboration already excludes these structurally —
          # a lifecycle key can never appear in an importers-derived dependency set —
          # but the denylist makes the security property visible in the code rather
          # than implied.
          #
          # Lifecycle script names ONLY. `version` and `dependencies` were removed: there
          # is a real npm package named `version`, and denylisting it would reject a
          # legitimate bump. A denylist must not overlap the namespace it sits beside.
          LIFECYCLE_KEYS=$'\npreinstall\ninstall\npostinstall\npreprepare\nprepare\npostprepare\nprepublish\nprepublishOnly\npublish\npostpublish\nprepack\npostpack\npreuninstall\nuninstall\npostuninstall\npreversion\npostversion\n'

          # is_valid_range <specifier> — npm version-range grammar. A shell command is
          # not a range, which is what keeps `"postinstall": "curl … | sh"` out.
          #
          # The grammar must accept everything npm permits, or it becomes a
          # false-positive generator that red-gates real manifests on unrelated bumps.
          # Verified against live registry data: eslint declares `"jiti": "*"`, and vite
          # declares `"esbuild": "^0.27.0 || ^0.28.0"` and
          # `"@types/node": "^20.19.0 || >=22.12.0"`.
          is_valid_range() {
            local spec="$1" part rest
            # Protocol forms are whole-string.
            case "$spec" in
              workspace:*|catalog:*|npm:*) return 0 ;;
            esac
            # `||` unions: every alternative must itself be a valid range.
            case "$spec" in
              *\|\|*)
                rest="$spec"
                while [ -n "$rest" ]; do
                  part="${rest%%\|\|*}"
                  is_valid_simple_range "$part" || return 1
                  [ "$part" = "$rest" ] && break
                  rest="${rest#*\|\|}"
                done
                return 0
                ;;
            esac
            is_valid_simple_range "$spec"
          }

          # is_valid_simple_range <specifier> — one alternative of a range union.
          # Accepts space-joined intersections (">=1.0.0 <2.0.0") and hyphen ranges
          # ("1.2.3 - 2.3.4") by validating each whitespace-separated token.
          #
          # GLOBBING MUST BE OFF around the word-split loop. With globbing on, an
          # unquoted `$spec` of `*` is expanded against the working directory, so the
          # bare `*` range (eslint declares `"jiti": "*"`) is accepted or rejected
          # depending on whether the cwd happens to contain files. That makes the
          # result environment-dependent — the test suite would pass locally and fail
          # in CI, or vice versa. Verified: without `set -f`, `*` is rejected from a
          # populated directory and accepted from an empty one.
          is_valid_simple_range() {
            local spec="$1" tok rc=0 restore_glob=0
            # Trim.
            spec="${spec#"${spec%%[![:space:]]*}"}"
            spec="${spec%"${spec##*[![:space:]]}"}"
            [ -z "$spec" ] && return 1
            case "$-" in *f*) ;; *) restore_glob=1; set -f ;; esac
            for tok in $spec; do
              case "$tok" in
                -) continue ;;                 # hyphen-range separator
                \*|x|X) continue ;;            # bare wildcard
              esac
              # Comparator/caret/tilde prefix, then a (possibly partial, possibly
              # wildcarded) version with optional prerelease/build metadata.
              if ! [[ "$tok" =~ ^(\^|~\>?|\>=|\<=|\>|\<|=|v)?[0-9]+(\.([0-9]+|[xX\*]))*([-+][0-9A-Za-z.-]+)?$ ]]; then
                rc=1
                break
              fi
            done
            # Restore on every exit path — a bare `return 1` inside the loop would leave
            # globbing disabled for the rest of the script.
            [ "$restore_glob" -eq 1 ] && set +f
            return "$rc"
          }

          manifest_verdict="clean"
          minus_names=$'\n'
          plus_names=$'\n'

          disqualify_manifest() {
            manifest_verdict="disqualified"
            echo "npm-bump-extract.sh: $1" >&2
          }

          # --- Pass 2: manifests ---
          pass2_manifests() {
            local line path kind name spec prefix
            local in_manifest=0 current=""
            while IFS= read -r line; do
              line="${line%$'\r'}"
              if [[ "$line" =~ ^diff[[:space:]]--git[[:space:]]a/([^[:space:]]+)[[:space:]]b/([^[:space:]]+) ]]; then
                path="${BASH_REMATCH[2]}"
                kind=$(classify_path "$path")
                if [ "$kind" = "manifest" ]; then
                  in_manifest=1
                  current="$path"
                else
                  in_manifest=0
                fi
                continue
              fi
              [ "$in_manifest" -eq 1 ] || continue
              [[ "$line" == +++* ]] && continue
              [[ "$line" == ---[[:space:]]* ]] && continue
              [[ "$line" =~ ^@@ ]] && continue
              # Only changed lines are judged; context lines are inert.
              [[ "$line" =~ ^[+-] ]] || continue

              if ! [[ "$line" =~ ^([+-])[[:space:]]*\"([^\"]+)\"[[:space:]]*:[[:space:]]*\"([^\"]*)\"[[:space:]]*,?[[:space:]]*$ ]]; then
                disqualify_manifest "$current: unrecognized changed line: ${line}"
                continue
              fi
              prefix="${BASH_REMATCH[1]}"
              name="${BASH_REMATCH[2]}"
              spec="${BASH_REMATCH[3]}"

              case "$LIFECYCLE_KEYS" in
                *$'\n'"$name"$'\n'*)
                  disqualify_manifest "$current: lifecycle key changed: $name"
                  continue
                  ;;
              esac

              if ! is_valid_range "$spec"; then
                disqualify_manifest "$current: value is not a valid npm range: \"$name\": \"$spec\""
                continue
              fi

              case "$corroborate" in
                *$'\n'"$name"$'\n'*) ;;
                *)
                  disqualify_manifest "$current: \"$name\" changed with no matching lockfile entry"
                  continue
                  ;;
              esac

              # Record the side this name appeared on, scoped to the file. Duplicates on
              # the same side mean the same key changed twice, which is malformed.
              if [ "$prefix" = "-" ]; then
                case "$minus_names" in
                  *$'\n'"$current|$name"$'\n'*)
                    disqualify_manifest "$current: duplicate removed key: $name"
                    continue
                    ;;
                esac
                minus_names="${minus_names}${current}|${name}"$'\n'
              else
                case "$plus_names" in
                  *$'\n'"$current|$name"$'\n'*)
                    disqualify_manifest "$current: duplicate added key: $name"
                    continue
                    ;;
                esac
                plus_names="${plus_names}${current}|${name}"$'\n'
              fi
            done <<< "$input"

            # Pairing check (spec §6.2). Every changed dependency must appear on BOTH
            # sides — a replacement. An unmatched `+` is a dependency ADDED and an
            # unmatched `-` is one REMOVED; both are unusual shapes for a Dependabot
            # version-update PR and get human review. A new package entering the tree
            # through a dependency-safety PR is the typosquat vector, and a freshly
            # published malicious package has no advisories yet, so it scans clean.
            local entry
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              case "$plus_names" in
                *$'\n'"$entry"$'\n'*) ;;
                *) disqualify_manifest "${entry%%|*}: dependency removed without replacement: ${entry##*|}" ;;
              esac
            done <<< "$(printf '%s' "$minus_names")"

            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              case "$minus_names" in
                *$'\n'"$entry"$'\n'*) ;;
                *) disqualify_manifest "${entry%%|*}: dependency added without replacement: ${entry##*|}" ;;
              esac
            done <<< "$(printf '%s' "$plus_names")"
          }

          # --- Pass 1: lockfile ---
          pass1_lock() {
            local line kind path
            local in_lock=0
            local current_section=""
            local current_disposition=""
            local seen_column0=0
            local section=""
            local declared=""
            local entry_name="" minus_ver="" plus_ver="" spec_changed=0
            local tier2_key_prefix=""
            while IFS= read -r line; do
              line="${line%$'\r'}"
              if [[ "$line" =~ ^diff[[:space:]]--git[[:space:]]a/([^[:space:]]+)[[:space:]]b/([^[:space:]]+) ]]; then
                path="${BASH_REMATCH[2]}"
                kind=$(classify_path "$path")
                if [ "$kind" = "lock" ]; then
                  in_lock=1
                  lock_path="$path"
                  [ "$lock_verdict" = "absent" ] && lock_verdict="clean"
                else
                  in_lock=0
                  if [ "$kind" = "manifest" ]; then
                    case "$manifest_paths" in
                      *$'\n'"$path"$'\n'*) ;;
                      *) manifest_paths="${manifest_paths}${path}"$'\n' ;;
                    esac
                  fi
                fi
                continue
              fi
              [ "$in_lock" -eq 1 ] || continue
              [[ "$line" == +++* ]] && continue
              [[ "$line" == ---[[:space:]]* ]] && continue

              # A document separator means sections may repeat, which the completeness
              # reasoning does not cover. Distinguished from the diff's own file header
              # (`--- a/path`), which always carries a path after the marker.
              if [[ "$line" =~ ^[+\ -]---$ ]]; then
                disqualify_lock "multi-document lockfile is not supported"
                continue
              fi

              # Hunk header seeds the section. git's function-context heuristic reports
              # the nearest column-0 line, which for pnpm-lock.yaml is a section name.
              # Verified across 1004 hunk headers in three real Dependabot PRs.
              if [[ "$line" =~ ^@@ ]]; then
                # Take the section from the text AFTER the closing "@@" only.
                # `${line##*@@ }` is WRONG here: on a whole-file-add header
                # `@@ -0,0 +1,8 @@` the closing "@@" has no trailing space, so the glob
                # matches the LEADING "@@ " instead and yields "-0,0" — a non-empty
                # string that satisfies `[ -n "$section" ]` and silently skips the
                # no-section-context disqualification below. A brand-new lockfile would
                # then be reported as parseable and cleared. Verified on bash 3.2.57.
                # `[^@]*` is safe because a hunk range contains only digits, commas,
                # spaces and +/-, so it cannot swallow an "@" in a section name
                # (e.g. `@@ -1,2 +1,2 @@ lodash@4.17.21:` still yields the full key).
                section=""
                if [[ "$line" =~ ^@@[^@]*@@[[:space:]]*(.*)$ ]]; then
                  section="${BASH_REMATCH[1]}"
                  section="${section%%[[:space:]]*}"
                fi
                if [ -n "$section" ]; then
                  set_section "$section"
                elif [ "$seen_column0" -eq 0 ]; then
                  # No trailing context and no column-0 key seen yet: this is a newly
                  # created lockfile arriving as one @@ -0,0 +1,N @@ hunk. Nothing
                  # anchors the section state, so nothing can be proven.
                  disqualify_lock "hunk header carries no section context"
                fi
                continue
              fi

              # A column-0 key inside the hunk body updates the section. Without this a
              # hunk that crosses a section boundary would keep parsing under the
              # previous section's rules — the catalogs:/overrides: adjacency case.
              if [[ "$line" =~ ^[+\ -]([A-Za-z][A-Za-z0-9]*:)[[:space:]]*$ ]] \
                 || [[ "$line" =~ ^[+\ -]([A-Za-z][A-Za-z0-9]*:)[[:space:]] ]]; then
                set_section "${BASH_REMATCH[1]}"
                # A format-version change is always visible in the diff, because a
                # changed line appears in a hunk by definition. When absent, the format
                # did not change. Safe to clobber BASH_REMATCH here: set_section above
                # already consumed the section capture.
                if [ "$current_disposition" = "version" ] \
                   && [[ "$line" =~ ^\+lockfileVersion:[[:space:]]*\'?([0-9.]+)\'?[[:space:]]*$ ]]; then
                  declared="${BASH_REMATCH[1]}"
                  case "$SUPPORTED_LOCKFILE_VERSIONS" in
                    *$'\n'"$declared"$'\n'*) ;;
                    *) disqualify_lock "unsupported lockfileVersion: $declared" ;;
                  esac
                fi
                # A changed line that IS the section key still counts as a change under
                # that section (e.g. `-pnpmfileChecksum: sha256-AAAA`).
                if [[ "$line" =~ ^[+-] ]] && [ "$current_disposition" != "version" ]; then
                  case "$current_disposition" in
                    disqualify|unknown)
                      disqualify_lock "change under unsupported lockfile section: $current_section"
                      ;;
                  esac
                fi
                continue
              fi

              if [ "$current_disposition" = "tier1" ]; then
                # Entry key line: a bare quoted-or-plain key with no value.
                if [[ "$line" =~ ^[+\ -][[:space:]]+\'?([^\':]+)\'?:[[:space:]]*$ ]]; then
                  flush_entry "$entry_name" "$minus_ver" "$plus_ver" "$spec_changed"
                  entry_name="${BASH_REMATCH[1]}"
                  minus_ver=""; plus_ver=""; spec_changed=0
                  continue
                fi
                if [[ "$line" =~ ^[+-][[:space:]]+specifier:[[:space:]]*(.*)$ ]]; then
                  spec_changed=1
                  continue
                fi
                if [[ "$line" =~ ^-[[:space:]]+version:[[:space:]]*(.*)$ ]]; then
                  minus_ver="${BASH_REMATCH[1]}"
                  continue
                fi
                if [[ "$line" =~ ^\+[[:space:]]+version:[[:space:]]*(.*)$ ]]; then
                  plus_ver="${BASH_REMATCH[1]}"
                  continue
                fi
                # Anything else that CHANGED under a tier-1 section is unaccounted for.
                # Falling through here is the §6.1 fail-open: it would clear the file with
                # an unexamined change. Context lines remain inert.
                if [[ "$line" =~ ^[+-] ]]; then
                  disqualify_lock "unrecognized changed line under ${current_section}: ${line}"
                fi
                continue
              fi

              if [ "$current_disposition" = "tier2" ]; then
                # Package-key line. A legitimate version replacement changes the key AND
                # its metadata on the same side, which is why the side is still recorded.
                if [[ "$line" =~ ^([+\ -])[[:space:]]+\'?([^\'[:space:]]+)\'?:[[:space:]]*$ ]]; then
                  tier2_key_prefix="${BASH_REMATCH[1]}"
                  if [ "$tier2_key_prefix" = "+" ]; then
                    if split_package_key "${BASH_REMATCH[2]}"; then
                      emit_tier2 "$_pkg_name" "$_pkg_version"
                    else
                      disqualify_lock "unparseable package key under packages:: ${BASH_REMATCH[2]}"
                    fi
                  fi
                  continue
                fi
                # A changed metadata line is only accounted for when the enclosing
                # package key changed on the SAME side. Under a CONTEXT key it means the
                # version did not move but its tarball did. Fail closed.
                if [[ "$line" =~ ^([+-]) ]]; then
                  if [ "${BASH_REMATCH[1]}" != "$tier2_key_prefix" ]; then
                    disqualify_lock "changed metadata for an unchanged package version under packages:: ${line}"
                  fi
                fi
                continue
              fi

              # Any changed line under a disqualifying or unknown section fails the file.
              if [[ "$line" =~ ^[+-] ]]; then
                case "$current_disposition" in
                  disqualify|unknown)
                    disqualify_lock "change under unsupported lockfile section: ${current_section:-<none>}"
                    continue
                    ;;
                esac
              fi
            done <<< "$input"
            flush_entry "$entry_name" "$minus_ver" "$plus_ver" "$spec_changed"
            if [ ${#tier2_rows[@]} -gt "$TIER2_MAX_ENTRIES" ]; then
              disqualify_lock "tier-2 entries (${#tier2_rows[@]}) exceed cap of ${TIER2_MAX_ENTRIES}"
            fi
            return 0
          }

          pass1_lock
          pass2_manifests

          # A manifest cannot be corroborated without a parseable lockfile, so a
          # disqualified or absent lockfile poisons every manifest in the diff.
          if [ "$lock_verdict" != "clean" ]; then
            manifest_verdict="disqualified"
          fi
          if [ "$manifest_verdict" != "clean" ]; then
            lock_verdict="disqualified"
          fi

          case "$MODE" in
            deps)
              # `sort -u` over the whole line. NEVER `sort -k1,1 -u` — see Task 5.
              if [ "$lock_verdict" = "clean" ] && [ ${#tier1_rows[@]} -gt 0 ]; then
                printf '%s\n' "${tier1_rows[@]}" | sort -u
              fi
              ;;
            lockfile-entries)
              if [ "$lock_verdict" = "clean" ] && [ ${#tier2_rows[@]} -gt 0 ]; then
                printf '%s\n' "${tier2_rows[@]}" | sort -u
              fi
              ;;
            cleared-paths)
              if [ "$lock_verdict" = "clean" ]; then
                {
                  [ -n "$lock_path" ] && printf '%s\n' "$lock_path"
                  printf '%s' "$manifest_paths" | sed '/^$/d'
                } | sort -u
              fi
              ;;
          esac

          exit 0
          )
          # --- END inline:scripts/npm-bump-extract.sh ---

          # --- BEGIN inline:scripts/pr-body-to-deps.sh ---
          pr_body_to_deps() (
          # pr-body-to-deps.sh — extract Dependabot dep bumps from a PR body, emit TSV.
          # Defense-in-depth fallback for when extract-deps.sh returns zero rows.
          #
          # Arg:    <ecosystem>  — 'pypi', 'actions', or 'npm'; emitted verbatim in TSV col 3.
          # Input:  PR body text on stdin.
          # Output: <name>\t<version>\t<ecosystem>  sorted, deduplicated.
          # Exit:   0 on success (including zero rows), 2 if ecosystem arg invalid.

          set -euo pipefail

          ecosystem="${1:-}"
          case "$ecosystem" in
            pypi|actions|npm) ;;
            *) echo "pr-body-to-deps.sh: ecosystem must be 'pypi', 'actions', or 'npm'" >&2; exit 2 ;;
          esac

          input=$(cat)
          [ -z "$input" ] && exit 0

          seen=$'\n'
          rows=()
          VER='[0-9][0-9A-Za-z.+!\-]*'

          # Regex patterns stored in variables — bash 3.2 on macOS cannot parse certain
          # metacharacters (like `)`) inline within [[ =~ ]] conditionals.
          # Pattern A — Bumps [name](url) from X to Y. The URL is consumed explicitly
          # via \([^)]+\) rather than a character class, because earlier attempts using
          # [^f]* silently dropped any bump whose URL contained `f` (e.g. `ruff`).
          re_a="^Bumps[[:space:]]\[([^]]+)\]\([^)]+\)[[:space:]]+from[[:space:]]+${VER}[[:space:]]+to[[:space:]]+(${VER})"
          # Pattern B — Updates `name` from X to Y (anchored at column 0 to avoid
          # matching blockquote/release-notes content which is typically indented)
          re_b="^Updates[[:space:]]\`([^\`]+)\`[[:space:]]+from[[:space:]]+${VER}[[:space:]]+to[[:space:]]+(${VER})"
          # Pattern C — | [name](url) | `fromVer` | `toVer` |
          re_c="^\|[[:space:]]+\[([^]]+)\]\([^)]+\)[[:space:]]+\|[[:space:]]+\`${VER}\`[[:space:]]+\|[[:space:]]+\`(${VER})\`[[:space:]]+\|"

          while IFS= read -r line; do
            line="${line%$'\r'}"
            name=""
            version=""

            if [[ "$line" =~ $re_a ]]; then
              name="${BASH_REMATCH[1]}"; version="${BASH_REMATCH[2]}"
            elif [[ "$line" =~ $re_b ]]; then
              name="${BASH_REMATCH[1]}"; version="${BASH_REMATCH[2]}"
            elif [[ "$line" =~ $re_c ]]; then
              name="${BASH_REMATCH[1]}"; version="${BASH_REMATCH[2]}"
            fi

            [ -z "$name" ] && continue

            # Strip trailing sentence punctuation from the version (e.g. "2.13.0."
            # in Pattern A's "Bumps ... from X to Y." lines).
            version="${version%.}"

            key="$ecosystem:$name"
            case "$seen" in *$'\n'"$key"$'\n'*) continue ;; esac
            seen="${seen}${key}"$'\n'
            rows+=("$name"$'\t'"$version"$'\t'"$ecosystem")
          done <<< "$input"

          if [ ${#rows[@]} -gt 0 ]; then
            printf '%s\n' "${rows[@]}" | sort -t$'\t' -k1,1
          fi
          )
          # --- END inline:scripts/pr-body-to-deps.sh ---

          # --- BEGIN inline:scripts/check-release-age.sh ---
          check_release_age() (
          # check-release-age.sh — read dep TSV on stdin, emit verdict TSV on stdout
          #
          # Schema:
          #   in:  <name>\t<version>\t<ecosystem>
          #   out: <name>\t<version>\t<ecosystem>\t<published_iso>\t<age_days>\t<verdict>\t<reason>
          #
          # Ecosystems: actions (GitHub releases API), pypi (PyPI JSON API),
          # npm (deps.dev stable v3).
          #
          # Verdicts: pass | fail | error
          # Exit: always 0; failures are per-row.
          #
          # Bash 3.2 compatible (macOS system bash).

          set -uo pipefail

          : "${COOLDOWN_DAYS:?COOLDOWN_DAYS env var is required}"
          : "${NOW_EPOCH:=$(date +%s)}"

          # iso_to_epoch <iso> — print unix epoch on stdout, return 1 on parse failure.
          # Handles both GitHub ("2026-03-29T12:00:00Z") and PyPI ("2026-03-29T12:00:00")
          # ISO variants across GNU and BSD date.
          iso_to_epoch() {
            local iso="$1"
            # GNU date: accepts the ISO string as-is (with or without Z).
            date -u -d "$iso" +%s 2>/dev/null && return 0
            # GNU date: append Z for naive PyPI upload_time.
            date -u -d "${iso}Z" +%s 2>/dev/null && return 0
            # BSD date (macOS): strip trailing Z and parse via -jf.
            local stripped="${iso%Z}"
            date -u -jf '%Y-%m-%dT%H:%M:%S' "$stripped" +%s 2>/dev/null && return 0
            return 1
          }

          # fetch_github <owner> <repo> <version> — print published_at ISO on stdout, return 1 on failure.
          fetch_github() {
            local owner="$1" repo="$2" version="$3"
            if [ -n "${AGE_FIXTURE_DIR:-}" ]; then
              local fx="$AGE_FIXTURE_DIR/github/$owner/$repo/releases/tags/v$version.json"
              [ -f "$fx" ] || return 1
              jq -r '.published_at // empty' "$fx"
              return 0
            fi
            local resp
            if ! resp=$(gh api "repos/$owner/$repo/releases/tags/v$version" 2>/dev/null); then
              sleep 2
              if ! resp=$(gh api "repos/$owner/$repo/releases/tags/v$version" 2>/dev/null); then
                return 1
              fi
            fi
            printf '%s' "$resp" | jq -r '.published_at // empty'
          }

          # fetch_pypi <pkg> <version> — print "<upload_time>\t<yanked_bool>" on stdout, return 1 on failure.
          fetch_pypi() {
            local pkg="$1" version="$2"
            local upload yanked
            if [ -n "${AGE_FIXTURE_DIR:-}" ]; then
              local fx="$AGE_FIXTURE_DIR/pypi/$pkg/$version.json"
              [ -f "$fx" ] || return 1
              upload=$(jq -r '.urls[0].upload_time // empty' "$fx")
              yanked=$(jq -r '.urls[0].yanked // false' "$fx")
              printf '%s\t%s\n' "$upload" "$yanked"
              return 0
            fi
            local resp
            if ! resp=$(curl -sf --max-time 30 "https://pypi.org/pypi/$pkg/$version/json" 2>/dev/null); then
              sleep 2
              if ! resp=$(curl -sf --max-time 30 "https://pypi.org/pypi/$pkg/$version/json" 2>/dev/null); then
                return 1
              fi
            fi
            upload=$(printf '%s' "$resp" | jq -r '.urls[0].upload_time // empty')
            yanked=$(printf '%s' "$resp" | jq -r '.urls[0].yanked // false')
            printf '%s\t%s\n' "$upload" "$yanked"
          }

          # urlencode_segment <value> — percent-encode one URL path segment.
          # jq's @uri leaves only the unreserved set (A-Za-z0-9-_.~) intact, so scope
          # separators ('@', '/'), traversal sequences, and query/fragment delimiters are
          # all neutralised. Applied to the version as well as the name: curl normalises
          # '..' segments client-side, so an unencoded '/' in a version string would let
          # one package's age be reported for another.
          urlencode_segment() {
            jq -rn --arg s "$1" '$s|@uri'
          }

          # fetch_npm <pkg> <version> — print "<publishedAt>\t<isDeprecated>" on stdout,
          # return 1 on failure. Source is deps.dev stable v3: one ~1 KB response
          # carries both facts, where the npm registry needs a multi-MB packument for
          # the timestamp plus a second request for deprecation.
          fetch_npm() {
            local pkg="$1" version="$2"
            local published deprecated
            if [ -n "${AGE_FIXTURE_DIR:-}" ]; then
              local fx="$AGE_FIXTURE_DIR/npm/$pkg/$version.json"
              [ -f "$fx" ] || return 1
              published=$(jq -r '.publishedAt // empty' "$fx")
              deprecated=$(jq -r '.isDeprecated // false' "$fx")
              printf '%s\t%s\n' "$published" "$deprecated"
              return 0
            fi
            local url resp
            url="https://api.deps.dev/v3/systems/npm/packages/$(urlencode_segment "$pkg")/versions/$(urlencode_segment "$version")"
            if ! resp=$(curl -sf --max-time 30 "$url" 2>/dev/null); then
              sleep 2
              if ! resp=$(curl -sf --max-time 30 "$url" 2>/dev/null); then
                return 1
              fi
            fi
            published=$(printf '%s' "$resp" | jq -r '.publishedAt // empty')
            deprecated=$(printf '%s' "$resp" | jq -r '.isDeprecated // false')
            printf '%s\t%s\n' "$published" "$deprecated"
          }

          # emit name version ecosystem published age verdict reason
          emit() {
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "$5" "$6" "$7"
          }

          while IFS=$'\t' read -r name version ecosystem || [ -n "${name:-}" ]; do
            [ -z "${name:-}" ] && continue

            # Escape hatch: COOLDOWN_DAYS=0 → all pass without lookup.
            if [ "$COOLDOWN_DAYS" -eq 0 ]; then
              emit "$name" "$version" "$ecosystem" "-" "-" "pass" ""
              continue
            fi

            case "$ecosystem" in
              actions)
                owner="${name%%/*}"
                remainder="${name#*/}"
                repo="${remainder%%/*}"
                if ! iso=$(fetch_github "$owner" "$repo" "$version"); then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "tier-1-404"
                  continue
                fi
                if [ -z "$iso" ]; then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "transient-failure"
                  continue
                fi
                if ! pub_epoch=$(iso_to_epoch "$iso"); then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "parse-failure"
                  continue
                fi
                age_days=$(( (NOW_EPOCH - pub_epoch) / 86400 ))
                if [ "$age_days" -ge "$COOLDOWN_DAYS" ]; then
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "pass" ""
                else
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "fail" ""
                fi
                ;;

              pypi)
                if ! result=$(fetch_pypi "$name" "$version"); then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "pypi-404"
                  continue
                fi
                iso="${result%%$'\t'*}"
                yanked="${result##*$'\t'}"
                if [ -z "$iso" ]; then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "transient-failure"
                  continue
                fi
                if ! pub_epoch=$(iso_to_epoch "$iso"); then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "parse-failure"
                  continue
                fi
                age_days=$(( (NOW_EPOCH - pub_epoch) / 86400 ))
                if [ "$yanked" = "true" ]; then
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "fail" "yanked"
                elif [ "$age_days" -ge "$COOLDOWN_DAYS" ]; then
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "pass" ""
                else
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "fail" ""
                fi
                ;;

              npm)
                if ! result=$(fetch_npm "$name" "$version"); then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "npm-404"
                  continue
                fi
                iso="${result%%$'\t'*}"
                deprecated="${result##*$'\t'}"
                if [ -z "$iso" ]; then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "transient-failure"
                  continue
                fi
                if ! pub_epoch=$(iso_to_epoch "$iso"); then
                  emit "$name" "$version" "$ecosystem" "-" "-" "error" "parse-failure"
                  continue
                fi
                age_days=$(( (NOW_EPOCH - pub_epoch) / 86400 ))
                if [ "$deprecated" = "true" ]; then
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "fail" "deprecated"
                elif [ "$age_days" -ge "$COOLDOWN_DAYS" ]; then
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "pass" ""
                else
                  emit "$name" "$version" "$ecosystem" "$iso" "$age_days" "fail" ""
                fi
                ;;

              *)
                emit "$name" "$version" "$ecosystem" "-" "-" "error" "unknown-ecosystem"
                ;;
            esac
          done

          exit 0
          )
          # --- END inline:scripts/check-release-age.sh ---

          # --- BEGIN inline:scripts/safety-verdict.sh ---
          safety_verdict() (
          # safety-verdict.sh — translate dependency-safety scan facts to a gate verdict.
          #
          # Pure logic: no network, no `gh` calls, no I/O beyond stdin/stdout.
          # Fail-closed: invalid/missing env → diagnostic on stderr, non-zero exit.
          # The workflow MUST treat non-zero exit as: gate_state=error,
          # has_safety_error=true, auto_merge_ok=false.
          #
          # Inputs (env vars, all required):
          #   GUARD_TRIGGERED         true|false
          #   AGE_ERROR_COUNT         int >=0
          #   AGE_VIOLATION_COUNT     int >=0
          #   SCAN_ERROR_COUNT        int >=0  (GHSA/OSV only — scorecard failures excluded)
          #   ADVISORY_COUNT          int >=0  (post version-aware filtering)
          #   RELEASE_AGE_POLICY      off|advisory|blocking
          #   MINIMUM_RELEASE_AGE_DAYS int >=0 (status text only; ignored when policy=off)
          #   AUTO_MERGE              true|false
          #
          # Contract invariant: RELEASE_AGE_POLICY=off requires AGE_ERROR_COUNT=0 and
          # AGE_VIOLATION_COUNT=0 — no age data may exist when no lookup ran. A
          # violation indicates an orchestrator bug and fails closed (exit 2).
          #
          # Output (stdout, single TSV line, six fields, no trailing newline beyond one):
          #   gate_state\tauto_merge_ok\thas_safety_error\thas_age_violation\thas_security_review\tstatus_desc
          #
          # Bash 3.2 compatible (macOS system bash).

          set -uo pipefail

          die() {
            printf 'safety-verdict.sh: %s\n' "$1" >&2
            exit 2
          }

          require_bool() {
            local name="$1"
            local val
            eval "val=\${$name-__unset__}"
            case "$val" in
              __unset__) die "missing required env: $name" ;;
              true|false) ;;
              *) die "$name must be 'true' or 'false', got: $val" ;;
            esac
          }

          require_nonneg_int() {
            local name="$1"
            local val
            eval "val=\${$name-__unset__}"
            if [ "$val" = "__unset__" ]; then
              die "missing required env: $name"
            fi
            case "$val" in
              ''|*[!0-9]*) die "$name must be a non-negative integer, got: $val" ;;
            esac
          }

          require_policy() {
            local val
            val=${RELEASE_AGE_POLICY-__unset__}
            case "$val" in
              __unset__) die "missing required env: RELEASE_AGE_POLICY" ;;
              off|advisory|blocking) ;;
              false) die "RELEASE_AGE_POLICY must be off|advisory|blocking, got: false (unquoted YAML off parses as boolean false — quote it: \"off\")" ;;
              *) die "RELEASE_AGE_POLICY must be off|advisory|blocking, got: $val" ;;
            esac
          }

          require_bool GUARD_TRIGGERED
          require_policy
          require_bool AUTO_MERGE
          require_nonneg_int AGE_ERROR_COUNT
          require_nonneg_int AGE_VIOLATION_COUNT
          require_nonneg_int SCAN_ERROR_COUNT
          require_nonneg_int ADVISORY_COUNT
          require_nonneg_int MINIMUM_RELEASE_AGE_DAYS

          # Contract invariant (see header): no age data may exist when policy is off.
          if [ "$RELEASE_AGE_POLICY" = "off" ]; then
            if [ "$AGE_VIOLATION_COUNT" -gt 0 ]; then
              die "RELEASE_AGE_POLICY=off but AGE_VIOLATION_COUNT=$AGE_VIOLATION_COUNT (orchestrator bug)"
            fi
            if [ "$AGE_ERROR_COUNT" -gt 0 ]; then
              die "RELEASE_AGE_POLICY=off but AGE_ERROR_COUNT=$AGE_ERROR_COUNT (orchestrator bug)"
            fi
          fi

          error_total=$(( AGE_ERROR_COUNT + SCAN_ERROR_COUNT ))

          # --- gate_state (priority order) ---
          if [ "$GUARD_TRIGGERED" = "true" ]; then
            gate_state="error"
          elif [ "$error_total" -gt 0 ]; then
            gate_state="error"
          elif [ "$AGE_VIOLATION_COUNT" -gt 0 ] && [ "$RELEASE_AGE_POLICY" = "blocking" ]; then
            gate_state="failure"
          else
            gate_state="success"
          fi

          # --- label booleans (independent facts) ---
          if [ "$GUARD_TRIGGERED" = "true" ] || [ "$error_total" -gt 0 ]; then
            has_safety_error="true"
          else
            has_safety_error="false"
          fi

          if [ "$AGE_VIOLATION_COUNT" -gt 0 ]; then
            has_age_violation="true"
          else
            has_age_violation="false"
          fi

          if [ "$ADVISORY_COUNT" -gt 0 ]; then
            has_security_review="true"
          else
            has_security_review="false"
          fi

          # --- auto_merge_ok (final boolean) ---
          if [ "$AUTO_MERGE" = "true" ] \
             && [ "$GUARD_TRIGGERED" = "false" ] \
             && [ "$error_total" -eq 0 ] \
             && [ "$AGE_VIOLATION_COUNT" -eq 0 ] \
             && [ "$ADVISORY_COUNT" -eq 0 ]; then
            auto_merge_ok="true"
          else
            auto_merge_ok="false"
          fi

          # --- status_desc (≤140 chars, composed per priority winner) ---
          if [ "$GUARD_TRIGGERED" = "true" ]; then
            status_desc="Could not extract dependencies from diff. Manual review required."
          elif [ "$error_total" -gt 0 ]; then
            status_desc="Scan errors: ${AGE_ERROR_COUNT} age lookup(s), ${SCAN_ERROR_COUNT} advisory query/ies. Re-run or push to retry."
          elif [ "$AGE_VIOLATION_COUNT" -gt 0 ] && [ "$RELEASE_AGE_POLICY" = "blocking" ]; then
            status_desc="${AGE_VIOLATION_COUNT} package(s) younger than ${MINIMUM_RELEASE_AGE_DAYS}d minimum release age (blocking policy)."
          elif [ "$ADVISORY_COUNT" -gt 0 ]; then
            status_desc="${ADVISORY_COUNT} advisory/ies found (version-filtered). Manual review required."
          elif [ "$AGE_VIOLATION_COUNT" -gt 0 ]; then
            status_desc="${AGE_VIOLATION_COUNT} package(s) below ${MINIMUM_RELEASE_AGE_DAYS}d minimum release age (advisory policy). Auto-merge suppressed."
          elif [ "$auto_merge_ok" = "true" ]; then
            if [ "$RELEASE_AGE_POLICY" = "off" ]; then
              status_desc="Clean scan (no advisories). Auto-merge enabled."
            else
              status_desc="Clean scan (≥${MINIMUM_RELEASE_AGE_DAYS}d, no advisories). Auto-merge enabled."
            fi
          else
            if [ "$RELEASE_AGE_POLICY" = "off" ]; then
              status_desc="Clean scan (no advisories). Ready for merge."
            else
              status_desc="Clean scan (≥${MINIMUM_RELEASE_AGE_DAYS}d, no advisories). Ready for merge."
            fi
          fi

          printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$gate_state" "$auto_merge_ok" \
            "$has_safety_error" "$has_age_violation" "$has_security_review" \
            "$status_desc"
          )
          # --- END inline:scripts/safety-verdict.sh ---

          DIFF=$(gh pr diff "$PR_NUMBER" --repo "$GH_REPO")

          DEPS=""
          SCAN_RESULTS=""
          GHSA_TOTAL=0
          OSV_TOTAL=0
          HAS_ERROR=""
          SCAN_ERROR_COUNT=0
          declare -A ACTION_VERSIONS PY_VERSIONS
          FILTERED_RESULTS=""
          FILTERED_TOTAL=0

          # Fetch PR body for Dependabot version fallback
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json body --jq '.body // ""')

          # --- Extract dependencies via standalone script (Task 8) ---
          # Layer 1: extract deps from supported file shapes.
          # --- BEGIN npm composition ---
          EXTRACTED=$(echo "$DIFF" | extract_deps)
          PYPROJECT_DEPS=$(printf '%s' "$DIFF" | pyproject_bump_extract --mode=deps 2>/dev/null || true)
          NPM_DEPS_TSV=$(printf '%s' "$DIFF" | npm_bump_extract --mode=deps 2>/dev/null || true)
          DEPS_TSV=$(printf '%s\n%s\n%s\n' "$EXTRACTED" "$PYPROJECT_DEPS" "$NPM_DEPS_TSV" | sed '/^$/d' | sort -u)

          # --- Compute touched paths and unsupported subset ONCE, up front. ---
          # Layer 2: identify unsupported dependency-relevant paths.
          # CLEARED_ALL is computed in the same hoist so Layer 2 and Layer 3
          # both see a consistent view of which paths the diff-aware helpers proved
          # are bump-only (fix for issue #66 — uv/poetry Dependabot PRs; extended to
          # npm/pnpm below).
          TOUCHED_PATHS=$(echo "$DIFF" | diff_touches_lockfile 2>/dev/null || true)
          BASE_UNSUPPORTED=$(printf '%s\n' "$TOUCHED_PATHS" | classify_touched_paths 2>/dev/null || true)
          CLEARED_PYPROJECT=$(printf '%s' "$DIFF" | pyproject_bump_extract --mode=cleared-paths 2>/dev/null || true)
          CLEARED_NPM=$(printf '%s' "$DIFF" | npm_bump_extract --mode=cleared-paths 2>/dev/null || true)
          CLEARED_ALL=$(printf '%s\n%s\n' "$CLEARED_PYPROJECT" "$CLEARED_NPM" | sed '/^$/d' | sort -u)

          # Subtract cleared paths from BOTH the unsupported set and the touched
          # set used by Layer 3's zero-row guard. A pyproject.toml or package.json/
          # pnpm-lock.yaml cleared with zero extracted deps (e.g., comment-only or
          # lockfile-only churn) represents proof that the scan was complete —
          # there is nothing to scan. Without this subtraction, a comment-only
          # pyproject PR or a lockfile-only npm PR would trip the zero-row guard.
          UNSUPPORTED_PATHS="$BASE_UNSUPPORTED"
          EFFECTIVE_TOUCHED="$TOUCHED_PATHS"
          if [ -n "$(printf '%s\n' "$CLEARED_ALL" | sed '/^$/d')" ]; then
            cleared_file=$(mktemp "${RUNNER_TEMP:-/tmp}/cleared-paths.XXXXXX")
            printf '%s\n' "$CLEARED_ALL" | sed '/^$/d' | sort -u > "$cleared_file"
            UNSUPPORTED_PATHS=$(printf '%s\n' "$BASE_UNSUPPORTED" | sed '/^$/d' | grep -vFxf "$cleared_file" || true)
            EFFECTIVE_TOUCHED=$(printf '%s\n' "$TOUCHED_PATHS" | sed '/^$/d' | grep -vFxf "$cleared_file" || true)
            rm -f "$cleared_file"
          fi

          # --- Layer 2: PR-body fallback (defense in depth for issue #52) ---
          # pyproject.toml and Pipfile remain pypi-routable for PR-body fallback.
          # Layer 3 still fires on Pipfile and on any pyproject.toml whose hunks
          # pyproject_bump_extract did not clear; cleared pyproject.toml and npm
          # paths are subtracted from UNSUPPORTED_PATHS in the composition block
          # above.
          if [ -z "$(echo "$DEPS_TSV" | sed '/^$/d')" ]; then
            ECO_HINT=""
            if echo "$TOUCHED_PATHS" | grep -qE '((^|/)(uv|poetry)\.lock$|requirements[^/]*\.txt$|pyproject\.toml$|Pipfile$)'; then
              ECO_HINT="pypi"
            elif echo "$TOUCHED_PATHS" | grep -qE '(^|/)(package\.json|pnpm-lock\.yaml)$' \
                 && [ -z "$(printf '%s' "$CLEARED_NPM" | sed '/^$/d')" ]; then
              # npm body fallback is available ONLY when the helper proved
              # nothing — which is already a guard-red state. When CLEARED_NPM
              # is non-empty the helper succeeded, and zero tier-1 rows is the
              # CORRECT answer for a lockfile-only security update. Promoting
              # PR-body prose there would scan what the body claims instead of
              # what the diff shows, inverting the trust model, and would feed
              # unresolvable version strings into release-age lookups.
              ECO_HINT="npm"
            elif echo "$TOUCHED_PATHS" | grep -qE '\.github/workflows/.*\.ya?ml$'; then
              ECO_HINT="actions"
            fi
            if [ -n "$ECO_HINT" ]; then
              DEPS_TSV=$(echo "$PR_BODY" | pr_body_to_deps "$ECO_HINT" 2>/dev/null || true)
              [ -n "$(echo "$DEPS_TSV" | sed '/^$/d')" ] && \
                echo "Recovered $(echo "$DEPS_TSV" | wc -l | tr -d ' ') dep(s) via PR-body fallback (${ECO_HINT})"
            fi
          fi
          # --- END npm composition ---

          # --- Layer 3: Fail-loud guard (fixes for issues #52 and #62) ---
          # Two composed conditions:
          #  (a) Unsupported paths touched: scan cannot be proven complete (issue #62).
          #  (b) All touched paths supported but extraction yielded zero rows: parser
          #      miss on a supported file (issue #52).
          # Unsupported takes message precedence — it's the more specific diagnosis.
          GUARD_TRIGGERED=false
          if [ -n "$UNSUPPORTED_PATHS" ]; then
            GUARD_TRIGGERED=true
            UNSUPPORTED_LIST=$(echo "$UNSUPPORTED_PATHS" | paste -sd, -)
            EXTRACTION_WARNING="⚠️ Diff touches dependency files the parser does not support (${UNSUPPORTED_LIST}). Manual review required; the dependency-safety gate cannot scan these."
          elif [ -z "$(echo "$DEPS_TSV" | sed '/^$/d')" ] && [ -n "$EFFECTIVE_TOUCHED" ]; then
            GUARD_TRIGGERED=true
            TOUCHED_LIST=$(echo "$EFFECTIVE_TOUCHED" | paste -sd, -)
            EXTRACTION_WARNING="⚠️ Parser could not extract dependencies from this diff (touched: ${TOUCHED_LIST}). Manual review required before merge."
          fi

          # Populate ACTIONS, PY_DEPS, ACTION_VERSIONS, PY_VERSIONS from DEPS_TSV
          # so the existing advisory-scan loops below can consume them unchanged.
          ACTIONS=""
          PY_DEPS=""
          NPM_ROWS=""
          while IFS=$'\t' read -r _name _ver _eco; do
            [ -z "$_name" ] && continue
            case "$_eco" in
              actions)
                ACTIONS="$(printf '%s\n%s' "$ACTIONS" "$_name")"
                ACTION_VERSIONS["$_name"]="$_ver"
                ;;
              pypi)
                PY_DEPS="$(printf '%s\n%s' "$PY_DEPS" "$_name")"
                PY_VERSIONS["$_name"]="$_ver"
                ;;
              npm)
                NPM_ROWS="$(printf '%s\n%s\t%s' "$NPM_ROWS" "$_name" "$_ver")"
                ;;
            esac
          done <<< "$DEPS_TSV"
          ACTIONS=$(echo "$ACTIONS" | sed '/^$/d' | sort -u)
          PY_DEPS=$(echo "$PY_DEPS" | sed '/^$/d' | sort -u)
          NPM_ROWS=$(printf '%s' "$NPM_ROWS" | sed '/^$/d' | sort -u)

          # PR-body version fallback for deps without inline version (preserved from v2.0.1)
          for ACTION in $ACTIONS; do
            [ -z "$ACTION" ] && continue
            if [ -z "${ACTION_VERSIONS[$ACTION]:-}" ]; then
              _dep_ver=$(echo "$PR_BODY" | grep -F "[$ACTION]" | grep -oE 'to [0-9][0-9.]*' | head -1 | sed 's/^to //' || true)
              ACTION_VERSIONS["$ACTION"]="$_dep_ver"
            fi
          done
          for PKG in $PY_DEPS; do
            [ -z "$PKG" ] && continue
            if [ -z "${PY_VERSIONS[$PKG]:-}" ]; then
              _dep_ver=$(echo "$PR_BODY" | grep -Fi "[$PKG]" | grep -oE 'to [0-9][0-9.]*' | head -1 | sed 's/^to //' || true)
              PY_VERSIONS["$PKG"]="$_dep_ver"
            fi
          done

          # Sanity-check: count UNIQUE action names in the diff vs extracted actions.
          # Filters ./ (local) and docker:// actions because the extractor at
          # scripts/extract-deps.sh:51-52 intentionally skips them — counting them
          # here would produce a false-positive extraction-mismatch warning on any
          # PR adding a local or docker action reference.
          # (Task 13c — fixes regression introduced by Task 13b)
          EXPECTED_ACTIONS=$(echo "$DIFF" \
            | grep -oE '^\+[[:space:]]+(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]@]+' \
            | sed -E 's/^\+[[:space:]]+(-[[:space:]]+)?uses:[[:space:]]+//' \
            | grep -vE '^(\./|docker://)' \
            | sort -u | wc -l | tr -d ' ')
          EXTRACTED_ACTIONS=$(echo "$ACTIONS" | sed '/^$/d' | wc -l | tr -d ' ')
          # Do not overwrite a guard-set EXTRACTION_WARNING.
          if [ -z "${EXTRACTION_WARNING:-}" ]; then
            EXTRACTION_WARNING=""
            if [ "$EXPECTED_ACTIONS" != "$EXTRACTED_ACTIONS" ]; then
              EXTRACTION_WARNING="⚠️ Extraction mismatch: diff contains ${EXPECTED_ACTIONS} unique action(s), extractor returned ${EXTRACTED_ACTIONS}. This may indicate a silent parsing failure. Please report."
            fi
          fi

          # --- Check release age via standalone script (opt-in per release_age_policy) ---
          # Positive allowlist: only the two known-enabled policies run lookups.
          # Invalid values (e.g. "false" from unquoted YAML off, or typos) fall
          # through with AGE_TSV empty — no network calls, no Release Age
          # section — and the verdict layer then fails closed on the bad enum.
          COOLDOWN_FAILURES=0
          AGE_TSV=""
          case "$RELEASE_AGE_POLICY" in
            advisory|blocking)
              if [ "$COOLDOWN_DAYS" -gt 0 ]; then
                # check_release_age must be invoked via command substitution so
                # bash's parent -e is dropped — this preserves per-row error
                # tolerance (404s, parse failures, etc. emit error verdicts
                # instead of killing the step). Do not convert to a direct call.
                AGE_TSV=$(echo "$DEPS_TSV" | check_release_age)
                COOLDOWN_FAILURES=$(echo "$AGE_TSV" | awk -F'\t' '$6=="fail" || $6=="error"' | wc -l | tr -d ' ')
              fi
              ;;
          esac

          for ACTION in $ACTIONS; do
            [ -z "$ACTION" ] && continue
            _ver="${ACTION_VERSIONS[$ACTION]}"
            if [ -n "$_ver" ]; then
              DEPS="${DEPS}\`${ACTION}\` (v${_ver}), "
            else
              DEPS="${DEPS}\`${ACTION}\`, "
            fi

            GHSA_RESULT=$(gh api graphql -f query='
              query($name: String!) {
                securityVulnerabilities(
                  ecosystem: ACTIONS
                  package: $name
                  first: 10
                ) {
                  nodes {
                    advisory {
                      ghsaId
                      severity
                      summary
                    }
                    vulnerableVersionRange
                    firstPatchedVersion {
                      identifier
                    }
                  }
                }
              }
            ' -f "name=${ACTION}" 2>&1) || {
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              SCAN_RESULTS="${SCAN_RESULTS}| (GHSA query failed for \`${ACTION}\`) | - | - | GHSA |"$'\n'
              GHSA_RESULT=""
            }

            if [ -n "$GHSA_RESULT" ] && echo "$GHSA_RESULT" | jq -e '.errors' > /dev/null 2>&1; then
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              GHSA_ERR=$(echo "$GHSA_RESULT" | jq -r '.errors[0].message // "unknown error"')
              SCAN_RESULTS="${SCAN_RESULTS}| (GHSA error for \`${ACTION}\`: ${GHSA_ERR}) | - | - | GHSA |"$'\n'
              GHSA_RESULT=""
            fi

            if [ -n "$GHSA_RESULT" ]; then
              _target_ver="${ACTION_VERSIONS[$ACTION]}"

              if [ -n "$_target_ver" ]; then
                while IFS=$'\t' read -r _g_id _g_sev _g_sum _g_patched; do
                  [ -z "$_g_id" ] && continue
                  if [ -n "$_g_patched" ]; then
                    _lowest=$(printf '%s\n' "$_g_patched" "$_target_ver" | sort -V | head -1)
                    if [ "$_lowest" = "$_g_patched" ]; then
                      FILTERED_RESULTS="${FILTERED_RESULTS}| ${_g_id} | ${_g_sev} | ${_g_sum} | GHSA | ${_g_patched} |"$'\n'
                      FILTERED_TOTAL=$((FILTERED_TOTAL + 1))
                      continue
                    fi
                  fi
                  SCAN_RESULTS="${SCAN_RESULTS}| ${_g_id} | ${_g_sev} | ${_g_sum} | GHSA |"$'\n'
                  GHSA_TOTAL=$((GHSA_TOTAL + 1))
                done <<< "$(echo "$GHSA_RESULT" | jq -r '
                  .data.securityVulnerabilities.nodes[] |
                  [.advisory.ghsaId, .advisory.severity, .advisory.summary, ((.firstPatchedVersion.identifier // "") | ltrimstr("v"))] |
                  @tsv
                ' 2>/dev/null || true)"
              else
                GHSA_VULNS=$(echo "$GHSA_RESULT" | jq -r '
                  .data.securityVulnerabilities.nodes[] |
                  "| \(.advisory.ghsaId) | \(.advisory.severity) | \(.advisory.summary) | GHSA |"
                ' 2>/dev/null || true)

                if [ -n "$GHSA_VULNS" ]; then
                  GHSA_COUNT=$(echo "$GHSA_VULNS" | wc -l | tr -d ' ')
                  GHSA_TOTAL=$((GHSA_TOTAL + GHSA_COUNT))
                  SCAN_RESULTS="${SCAN_RESULTS}${GHSA_VULNS}"$'\n'
                fi
              fi
            fi

            _target_ver="${ACTION_VERSIONS[$ACTION]}"
            if [ -n "$_target_ver" ]; then
              OSV_BODY=$(jq -n --arg name "$ACTION" --arg eco "GitHub Actions" --arg ver "$_target_ver" \
                '{"package":{"name":$name,"ecosystem":$eco},"version":$ver}')
            else
              OSV_BODY=$(jq -n --arg name "$ACTION" --arg eco "GitHub Actions" \
                '{"package":{"name":$name,"ecosystem":$eco}}')
            fi
            OSV_RESULT=$(curl -sf --max-time 30 \
              -X POST "https://api.osv.dev/v1/query" \
              -H "Content-Type: application/json" \
              -d "$OSV_BODY" \
              2>&1) || {
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              SCAN_RESULTS="${SCAN_RESULTS}| (OSV query failed for \`${ACTION}\`) | - | - | OSV |"$'\n'
              OSV_RESULT=""
            }

            if [ -n "$OSV_RESULT" ]; then
              OSV_VULNS=$(echo "$OSV_RESULT" | jq -r '
                .vulns[]? |
                "| \(.id) | \(.database_specific.severity // "UNKNOWN") | \(.summary // .details[:80]) | OSV |"
              ' 2>/dev/null || true)

              if [ -n "$OSV_VULNS" ]; then
                OSV_COUNT=$(echo "$OSV_VULNS" | wc -l | tr -d ' ')
                OSV_TOTAL=$((OSV_TOTAL + OSV_COUNT))
                SCAN_RESULTS="${SCAN_RESULTS}${OSV_VULNS}"$'\n'
              fi
            fi
          done

          for PKG in $PY_DEPS; do
            [ -z "$PKG" ] && continue
            _ver="${PY_VERSIONS[$PKG]}"
            if [ -n "$_ver" ]; then
              DEPS="${DEPS}\`${PKG}\` (v${_ver}), "
            else
              DEPS="${DEPS}\`${PKG}\`, "
            fi

            GHSA_RESULT=$(gh api graphql -f query='
              query($name: String!) {
                securityVulnerabilities(
                  ecosystem: PIP
                  package: $name
                  first: 10
                ) {
                  nodes {
                    advisory {
                      ghsaId
                      severity
                      summary
                    }
                    vulnerableVersionRange
                    firstPatchedVersion {
                      identifier
                    }
                  }
                }
              }
            ' -f "name=${PKG}" 2>&1) || {
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              SCAN_RESULTS="${SCAN_RESULTS}| (GHSA query failed for \`${PKG}\`) | - | - | GHSA |"$'\n'
              GHSA_RESULT=""
            }

            if [ -n "$GHSA_RESULT" ] && echo "$GHSA_RESULT" | jq -e '.errors' > /dev/null 2>&1; then
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              GHSA_ERR=$(echo "$GHSA_RESULT" | jq -r '.errors[0].message // "unknown error"')
              SCAN_RESULTS="${SCAN_RESULTS}| (GHSA error for \`${PKG}\`: ${GHSA_ERR}) | - | - | GHSA |"$'\n'
              GHSA_RESULT=""
            fi

            if [ -n "$GHSA_RESULT" ]; then
              _target_ver="${PY_VERSIONS[$PKG]}"

              if [ -n "$_target_ver" ]; then
                while IFS=$'\t' read -r _g_id _g_sev _g_sum _g_patched; do
                  [ -z "$_g_id" ] && continue
                  if [ -n "$_g_patched" ]; then
                    _lowest=$(printf '%s\n' "$_g_patched" "$_target_ver" | sort -V | head -1)
                    if [ "$_lowest" = "$_g_patched" ]; then
                      FILTERED_RESULTS="${FILTERED_RESULTS}| ${_g_id} | ${_g_sev} | ${_g_sum} | GHSA | ${_g_patched} |"$'\n'
                      FILTERED_TOTAL=$((FILTERED_TOTAL + 1))
                      continue
                    fi
                  fi
                  SCAN_RESULTS="${SCAN_RESULTS}| ${_g_id} | ${_g_sev} | ${_g_sum} | GHSA |"$'\n'
                  GHSA_TOTAL=$((GHSA_TOTAL + 1))
                done <<< "$(echo "$GHSA_RESULT" | jq -r '
                  .data.securityVulnerabilities.nodes[] |
                  [.advisory.ghsaId, .advisory.severity, .advisory.summary, ((.firstPatchedVersion.identifier // "") | ltrimstr("v"))] |
                  @tsv
                ' 2>/dev/null || true)"
              else
                GHSA_VULNS=$(echo "$GHSA_RESULT" | jq -r '
                  .data.securityVulnerabilities.nodes[] |
                  "| \(.advisory.ghsaId) | \(.advisory.severity) | \(.advisory.summary) | GHSA |"
                ' 2>/dev/null || true)

                if [ -n "$GHSA_VULNS" ]; then
                  GHSA_COUNT=$(echo "$GHSA_VULNS" | wc -l | tr -d ' ')
                  GHSA_TOTAL=$((GHSA_TOTAL + GHSA_COUNT))
                  SCAN_RESULTS="${SCAN_RESULTS}${GHSA_VULNS}"$'\n'
                fi
              fi
            fi

            _target_ver="${PY_VERSIONS[$PKG]}"
            if [ -n "$_target_ver" ]; then
              OSV_BODY=$(jq -n --arg name "$PKG" --arg eco "PyPI" --arg ver "$_target_ver" \
                '{"package":{"name":$name,"ecosystem":$eco},"version":$ver}')
            else
              OSV_BODY=$(jq -n --arg name "$PKG" --arg eco "PyPI" \
                '{"package":{"name":$name,"ecosystem":$eco}}')
            fi
            OSV_RESULT=$(curl -sf --max-time 30 \
              -X POST "https://api.osv.dev/v1/query" \
              -H "Content-Type: application/json" \
              -d "$OSV_BODY" \
              2>&1) || {
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              SCAN_RESULTS="${SCAN_RESULTS}| (OSV query failed for \`${PKG}\`) | - | - | OSV |"$'\n'
              OSV_RESULT=""
            }

            if [ -n "$OSV_RESULT" ]; then
              OSV_VULNS=$(echo "$OSV_RESULT" | jq -r '
                .vulns[]? |
                "| \(.id) | \(.database_specific.severity // "UNKNOWN") | \(.summary // .details[:80]) | OSV |"
              ' 2>/dev/null || true)

              if [ -n "$OSV_VULNS" ]; then
                OSV_COUNT=$(echo "$OSV_VULNS" | wc -l | tr -d ' ')
                OSV_TOTAL=$((OSV_TOTAL + OSV_COUNT))
                SCAN_RESULTS="${SCAN_RESULTS}${OSV_VULNS}"$'\n'
              fi
            fi
          done

          while IFS=$'\t' read -r PKG _npm_ver; do
            [ -z "$PKG" ] && continue
            if [ -n "$_npm_ver" ]; then
              DEPS="${DEPS}\`${PKG}\` (${_npm_ver}), "
            else
              DEPS="${DEPS}\`${PKG}\`, "
            fi

            GHSA_RESULT=$(gh api graphql -f query='
              query($name: String!) {
                securityVulnerabilities(
                  ecosystem: NPM
                  package: $name
                  first: 10
                ) {
                  nodes {
                    advisory {
                      ghsaId
                      severity
                      summary
                    }
                    vulnerableVersionRange
                    firstPatchedVersion {
                      identifier
                    }
                  }
                }
              }
            ' -f "name=${PKG}" 2>&1) || {
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              SCAN_RESULTS="${SCAN_RESULTS}| (GHSA query failed for \`${PKG}\`) | - | - | GHSA |"$'\n'
              GHSA_RESULT=""
            }

            if [ -n "$GHSA_RESULT" ] && echo "$GHSA_RESULT" | jq -e '.errors' > /dev/null 2>&1; then
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              GHSA_ERR=$(echo "$GHSA_RESULT" | jq -r '.errors[0].message // "unknown error"')
              SCAN_RESULTS="${SCAN_RESULTS}| (GHSA error for \`${PKG}\`: ${GHSA_ERR}) | - | - | GHSA |"$'\n'
              GHSA_RESULT=""
            fi

            if [ -n "$GHSA_RESULT" ]; then
              # Version-aware filtering is MANDATORY (spec §7.1), mirroring the
              # pypi loop. Without it, every npm bump of a package carrying any
              # historical CVE — which is most widely-used packages — lands
              # security-review-needed and suppresses auto-merge. The gate would
              # be useless through false positives rather than unsafe.
              if [ -n "$_npm_ver" ]; then
                while IFS=$'\t' read -r _g_id _g_sev _g_sum _g_patched; do
                  [ -z "$_g_id" ] && continue
                  if [ -n "$_g_patched" ] && [ "$_g_patched" != "null" ] \
                     && printf '%s\n%s\n' "$_g_patched" "$_npm_ver" \
                        | sort -V -C 2>/dev/null; then
                    # firstPatchedVersion <= target: already fixed in this bump.
                    FILTERED_RESULTS="${FILTERED_RESULTS}| ${_g_id} | ${_g_sev} | ${_g_sum} | GHSA | ${_g_patched} |"$'\n'
                    FILTERED_TOTAL=$((FILTERED_TOTAL + 1))
                  else
                    SCAN_RESULTS="${SCAN_RESULTS}| ${_g_id} | ${_g_sev} | ${_g_sum} | GHSA |"$'\n'
                    GHSA_TOTAL=$((GHSA_TOTAL + 1))
                  fi
                done <<< "$(echo "$GHSA_RESULT" | jq -r '
                  .data.securityVulnerabilities.nodes[]? |
                  [.advisory.ghsaId, .advisory.severity, .advisory.summary,
                   (.firstPatchedVersion.identifier // "")] | @tsv
                ' 2>/dev/null || true)"
              else
                # No target version: report everything. Safer default, matching
                # the existing Actions and pypi behavior.
                GHSA_VULNS=$(echo "$GHSA_RESULT" | jq -r '
                  .data.securityVulnerabilities.nodes[]? |
                  "| \(.advisory.ghsaId) | \(.advisory.severity) | \(.advisory.summary) | GHSA |"
                ' 2>/dev/null || true)
                if [ -n "$GHSA_VULNS" ]; then
                  GHSA_COUNT=$(echo "$GHSA_VULNS" | wc -l | tr -d ' ')
                  GHSA_TOTAL=$((GHSA_TOTAL + GHSA_COUNT))
                  SCAN_RESULTS="${SCAN_RESULTS}${GHSA_VULNS}"$'\n'
                fi
              fi
            fi

            if [ -n "$_npm_ver" ]; then
              OSV_BODY=$(jq -n --arg name "$PKG" --arg eco "npm" --arg ver "$_npm_ver" \
                '{"package":{"name":$name,"ecosystem":$eco},"version":$ver}')
            else
              OSV_BODY=$(jq -n --arg name "$PKG" --arg eco "npm" \
                '{"package":{"name":$name,"ecosystem":$eco}}')
            fi
            OSV_RESULT=$(curl -sf --max-time 30 \
              -X POST "https://api.osv.dev/v1/query" \
              -H "Content-Type: application/json" \
              -d "$OSV_BODY" \
              2>/dev/null) || {
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              SCAN_RESULTS="${SCAN_RESULTS}| (OSV query failed for \`${PKG}\`) | - | - | OSV |"$'\n'
              OSV_RESULT=""
            }

            if [ -n "$OSV_RESULT" ]; then
              OSV_VULNS=$(echo "$OSV_RESULT" | jq -r '
                .vulns[]? |
                "| \(.id) | \(.database_specific.severity // "UNKNOWN") | \(.summary // .details[:80]) | OSV |"
              ' 2>/dev/null || true)
              if [ -n "$OSV_VULNS" ]; then
                OSV_COUNT=$(echo "$OSV_VULNS" | wc -l | tr -d ' ')
                OSV_TOTAL=$((OSV_TOTAL + OSV_COUNT))
                SCAN_RESULTS="${SCAN_RESULTS}${OSV_VULNS}"$'\n'
              fi
            fi
          done <<< "$NPM_ROWS"

          # --- BEGIN tier-2 sweep ---
          # --- Tier 2: batched OSV sweep over newly introduced lockfile versions ---
          # Completeness claim: every package version this diff introduces into
          # the tree was checked. Chunked at 100 per request; a continuation
          # signal means the sweep was incomplete and must fail closed rather
          # than report a partial result as complete.
          TIER2_SECTION=""
          TIER2_TSV=$(printf '%s' "$DIFF" | npm_bump_extract --mode=lockfile-entries 2>/dev/null || true)
          TIER2_COUNT=$(printf '%s' "$TIER2_TSV" | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$TIER2_COUNT" -gt 0 ]; then
            tier2_hits=""
            tier2_failed=false
            chunk_file=$(mktemp "${RUNNER_TEMP:-/tmp}/tier2-chunk.XXXXXX")
            printf '%s' "$TIER2_TSV" | sed '/^$/d' > "$chunk_file"

            split_dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/tier2-split.XXXXXX")
            split -l 100 "$chunk_file" "$split_dir/chunk-"

            for chunk in "$split_dir"/chunk-*; do
              [ -f "$chunk" ] || continue
              QB_BODY=$(awk -F'\t' 'BEGIN{printf "{\"queries\":["} {if(NR>1)printf ","; printf "{\"package\":{\"name\":\"%s\",\"ecosystem\":\"npm\"},\"version\":\"%s\"}", $1, $2} END{printf "]}"}' "$chunk")
              QB_RESULT=$(curl -sf --max-time 60 \
                -X POST "https://api.osv.dev/v1/querybatch" \
                -H "Content-Type: application/json" \
                -d "$QB_BODY" \
                2>/dev/null) || {
                tier2_failed=true
                continue
              }

              # --- Response validation. Each check fails CLOSED. ---
              # Without these, `jq … 2>/dev/null || true` downstream converts a
              # malformed or short response into "no advisories found" — a
              # silent green over an unscanned chunk.

              # 1. Parseable JSON with a results array.
              if ! echo "$QB_RESULT" | jq -e 'has("results") and (.results | type == "array")' > /dev/null 2>&1; then
                tier2_failed=true
                continue
              fi

              # 2. Cardinality. Hit indices map back to packages by position,
              # so a short array both under-covers and MISATTRIBUTES.
              QB_SENT=$(wc -l < "$chunk" | tr -d ' ')
              QB_GOT=$(echo "$QB_RESULT" | jq -r '.results | length')
              if [ "$QB_GOT" != "$QB_SENT" ]; then
                tier2_failed=true
                continue
              fi

              # 3. Pagination. Confirmed per-result field name `next_page_token`
              # (https://google.github.io/osv.dev/post-v1-querybatch/). A token
              # means that query's results were truncated.
              if echo "$QB_RESULT" | jq -e '.results[]? | select(has("next_page_token"))' > /dev/null 2>&1; then
                tier2_failed=true
                continue
              fi

              # 5. Every result member must be an object; any `vulns` present
              # must be an array; every vulnerability must carry a non-empty
              # string id. Checks 1-4 validate the ENVELOPE only — without this
              # one, a malformed MEMBER still degrades to "0 advisories" through
              # the `.results[]?` / `// []` / `|| true` combination that used to
              # guard the extraction below. That is a green gate over an
              # unscanned chunk: the exact outcome this validation block exists
              # to prevent.
              if ! echo "$QB_RESULT" | jq -e '
                .results | all(
                  type == "object"
                  and (if has("vulns") then (.vulns | type == "array") else true end)
                  and ((.vulns // []) | all(
                    type == "object"
                    and (.id | type == "string")
                    and (.id | length > 0)
                  ))
                )
              ' > /dev/null 2>&1; then
                tier2_failed=true
                continue
              fi

              # Map each hit index back to its package via the chunk file.
              # No `?`, no `2>/dev/null`, no `|| true` — the response is proven
              # well-formed above, so a jq failure here is a real fault and must
              # fail closed rather than read as "no hits".
              HIT_IDS=$(echo "$QB_RESULT" | jq -r '
                [.results[] | (.vulns // []) | map(.id)] | to_entries[] |
                select(.value | length > 0) | "\(.key)\t\(.value | join(","))"
              ') || {
                tier2_failed=true
                continue
              }

              while IFS=$'\t' read -r idx ids; do
                [ -z "$idx" ] && continue
                pkg_line=$(sed -n "$((idx + 1))p" "$chunk")
                pkg_name=$(printf '%s' "$pkg_line" | cut -f1)
                pkg_ver=$(printf '%s' "$pkg_line" | cut -f2)
                OLD_IFS="$IFS"; IFS=','
                for vid in $ids; do
                  IFS="$OLD_IFS"
                  if [ -n "${OSV_DETAIL_FIXTURE_DIR:-}" ]; then
                    # Offline seam, mirroring AGE_FIXTURE_DIR. A missing fixture
                    # is a failure, never an empty advisory.
                    VD=$(cat "${OSV_DETAIL_FIXTURE_DIR}/${vid}.json" 2>/dev/null) || {
                      tier2_failed=true
                      continue
                    }
                  else
                    VD=$(curl -sf --max-time 30 "https://api.osv.dev/v1/vulns/${vid}" 2>/dev/null) || {
                      tier2_failed=true
                      continue
                    }
                  fi
                  # The detail response is a separate request and carries its own
                  # failure modes. An unvalidated malformed body would yield an
                  # empty severity and summary, publishing a row that looks like a
                  # scanned advisory carrying no information.
                  if ! echo "$VD" | jq -e 'type == "object" and (.id | type == "string")' > /dev/null 2>&1; then
                    tier2_failed=true
                    continue
                  fi
                  vsev=$(echo "$VD" | jq -r '.database_specific.severity // "UNKNOWN"') || vsev="UNKNOWN"
                  vsum=$(echo "$VD" | jq -r 'if (.summary | type) == "string" then .summary elif (.details | type) == "string" then (.details[:80]) else "" end') || vsum=""
                  tier2_hits="${tier2_hits}| \`${pkg_name}@${pkg_ver}\` | ${vid} | ${vsev} | ${vsum} |"$'\n'
                  OSV_TOTAL=$((OSV_TOTAL + 1))
                done
                IFS="$OLD_IFS"
              done <<< "$HIT_IDS"
            done

            rm -rf "$split_dir" "$chunk_file"

            if [ "$tier2_failed" = "true" ]; then
              HAS_ERROR="true"
              SCAN_ERROR_COUNT=$((SCAN_ERROR_COUNT + 1))
              TIER2_SECTION=$(printf '\n### Transitive lockfile sweep\n\n⚠️ Sweep incomplete for %s newly introduced package version(s). Manual review required.\n' "$TIER2_COUNT")
            elif [ -n "$tier2_hits" ]; then
              TIER2_SECTION=$(printf '\n### Transitive lockfile sweep\n\n%s new package version(s) entered the tree; advisories found:\n\n| Package | ID | Severity | Summary |\n|---|---|---|---|\n%s' "$TIER2_COUNT" "$tier2_hits")
            else
              TIER2_SECTION=$(printf '\n### Transitive lockfile sweep\n\n%s new package version(s) entered the tree, 0 advisories.\n' "$TIER2_COUNT")
            fi
          fi
          # --- END tier-2 sweep ---

          # --- OpenSSF Scorecard (GitHub Actions only) ---
          SCORECARD_TABLE=""
          if [[ "$ENABLE_SCORECARD" == "true" ]]; then
            for ACTION in $ACTIONS; do
              [ -z "$ACTION" ] && continue
              SC_RESULT=$(curl -sf --max-time 30 \
                "https://api.securityscorecards.dev/projects/github.com/${ACTION}" \
                2>/dev/null) || SC_RESULT=""

              if [ -z "$SC_RESULT" ]; then
                SCORECARD_TABLE="${SCORECARD_TABLE}| \`${ACTION}\` | Not available | - |"$'\n'
              else
                SC_SCORE=$(echo "$SC_RESULT" | jq -r '.score // "N/A"')
                SC_URL="https://scorecard.dev/viewer/?uri=github.com/${ACTION}"
                SCORECARD_TABLE="${SCORECARD_TABLE}| \`${ACTION}\` | ${SC_SCORE}/10 | [View](${SC_URL}) |"$'\n'
              fi
            done
          fi

          SCORECARD_SECTION=""
          if [ -n "$SCORECARD_TABLE" ]; then
            SC_HDR="| Action | Score | Details |"
            SC_SEP="|--------|-------|---------|"
            SCORECARD_SECTION="$(printf '\n### Project Health (OpenSSF Scorecard)\n\n%s\n%s\n%s' \
              "$SC_HDR" "$SC_SEP" "$SCORECARD_TABLE")"
          fi

          # Strip trailing comma-space from DEPS
          DEPS=$(echo "$DEPS" | sed 's/, $//')

          if [ -z "$DEPS" ]; then
            DEPS="(no dependencies extracted from diff)"
          fi

          # --- Build comment body ---
          TOTAL=$((GHSA_TOTAL + OSV_TOTAL))

          # --- Compute verdict via safety_verdict (inline copy of scripts/safety-verdict.sh) ---
          # Split COOLDOWN_FAILURES into age_error_count vs age_violation_count by
          # re-reading AGE_TSV (verdicts: 'fail' = violation, 'error' = lookup error).
          AGE_VIOLATION_COUNT=$(echo "$AGE_TSV" | awk -F'\t' '$6=="fail"'  | wc -l | tr -d ' ')
          AGE_ERROR_COUNT=$(    echo "$AGE_TSV" | awk -F'\t' '$6=="error"' | wc -l | tr -d ' ')

          # SCAN_ERROR_COUNT is incremented at each GHSA/OSV failure point in the
          # scan loops above (scorecard failures are NOT counted — they're not
          # blocking). HAS_ERROR is preserved alongside as the legacy boolean
          # consumers below still test for.

          # Map GUARD_TRIGGERED to lowercase string the script expects.
          if [ "$GUARD_TRIGGERED" = "true" ]; then
            _gt_bool="true"
          else
            _gt_bool="false"
          fi

          # Call safety_verdict with `if ...; then`. NOT VAR=$(...); RC=$?
          # — under `bash -e` a failing command substitution can abort the
          # step before $? is captured, defeating fail-closed semantics.
          if VERDICT_TSV=$(GUARD_TRIGGERED="$_gt_bool" \
                           AGE_ERROR_COUNT="$AGE_ERROR_COUNT" \
                           AGE_VIOLATION_COUNT="$AGE_VIOLATION_COUNT" \
                           SCAN_ERROR_COUNT="$SCAN_ERROR_COUNT" \
                           ADVISORY_COUNT="$TOTAL" \
                           RELEASE_AGE_POLICY="$RELEASE_AGE_POLICY" \
                           MINIMUM_RELEASE_AGE_DAYS="$MINIMUM_RELEASE_AGE_DAYS" \
                           AUTO_MERGE="$AUTO_MERGE" \
                           safety_verdict); then
            VERDICT_RC=0
          else
            VERDICT_RC=$?
          fi

          if [ "$VERDICT_RC" -ne 0 ] || [ -z "$VERDICT_TSV" ]; then
            # Fail-closed: synthesize an error verdict so the gate is red and
            # auto-merge is suppressed even if the script crashed unexpectedly.
            GATE_STATE="error"
            AUTO_MERGE_OK="false"
            HAS_SAFETY_ERROR="true"
            HAS_AGE_VIOLATION="false"
            HAS_SECURITY_REVIEW="false"
            STATUS_DESC="Internal: verdict script rejected inputs — see workflow logs."
          else
            IFS=$'\t' read -r GATE_STATE AUTO_MERGE_OK HAS_SAFETY_ERROR \
                              HAS_AGE_VIOLATION HAS_SECURITY_REVIEW STATUS_DESC \
                              <<< "$VERDICT_TSV"
          fi

          # Map verdict's HAS_SAFETY_ERROR to the legacy HAS_ERROR variable that
          # reconcile_label() inspects for the conservative-preserve rule.
          # Escalates only — never demotes a HAS_ERROR=true that the scan loop set.
          if [ "$HAS_SAFETY_ERROR" = "true" ]; then HAS_ERROR="true"; fi

          # --- Label reconciliation (Task 13b — authoritative on clean runs, additive-only on HAS_ERROR paths) ---
          LABEL_COLOR_security_review_needed="B60205"
          LABEL_DESC_security_review_needed="Dependency scan found advisories — manual review required"
          LABEL_COLOR_dependency_age_violation="FBCA04"
          LABEL_DESC_dependency_age_violation="Target version younger than the configured minimum release age (release_age_policy)"
          LABEL_COLOR_dependency_safety_error="6E7781"
          LABEL_DESC_dependency_safety_error="dependency-safety scan could not complete reliably — see scan comment"

          reconcile_label() {
            local label="$1"
            local should_be_present="$2"
            local color="$3"
            local desc="$4"
            local current has_it
            current=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name]')
            has_it=$(echo "$current" | jq -e --arg l "$label" 'contains([$l])' >/dev/null && echo true || echo false)

            if [ "$should_be_present" = "true" ] && [ "$has_it" = "false" ]; then
              gh label create "$label" --repo "$GH_REPO" --color "$color" --description "$desc" --force >/dev/null 2>&1 || true
              gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label "$label" || true
              echo "Applied label: $label"
            elif [ "$should_be_present" = "false" ] && [ "$has_it" = "true" ] && [ -z "${HAS_ERROR:-}" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --remove-label "$label" || true
              echo "Removed stale label: $label"
            elif [ "$should_be_present" = "false" ] && [ "$has_it" = "true" ]; then
              echo "Preserving label $label: scan had API errors, verdict is unreliable"
            fi
          }

          # Label booleans come straight from the verdict (HAS_*) — single source of truth.
          # The reconcile_label function preserves stale labels when HAS_ERROR is set
          # (conservative-preserve rule, spec §6.2).
          #
          # This workflow does not manage the retired `cooldown-pending` label.
          reconcile_label "security-review-needed"    "$HAS_SECURITY_REVIEW" "$LABEL_COLOR_security_review_needed"    "$LABEL_DESC_security_review_needed"
          reconcile_label "dependency-age-violation" "$HAS_AGE_VIOLATION"   "$LABEL_COLOR_dependency_age_violation" "$LABEL_DESC_dependency_age_violation"
          reconcile_label "dependency-safety-error"  "$HAS_SAFETY_ERROR"    "$LABEL_COLOR_dependency_safety_error"  "$LABEL_DESC_dependency_safety_error"

          # --- Conditional auto-merge ---
          # AUTO_MERGE_OK is the FINAL boolean from safety-verdict.sh —
          # do NOT additionally gate on $AUTO_MERGE here (the script already did).
          # Sets AUTO_MERGE_COMMENT_NOTE on SETUP failure (consumed by the
          # comment composition below). "Required checks not yet satisfied" is
          # NOT a setup failure — that is the normal case --auto handles.
          # Must run BEFORE comment composition so the comment can attach the note.
          AUTO_MERGE_COMMENT_NOTE=""
          if [ "$AUTO_MERGE_OK" = "true" ]; then
            if gh pr merge --auto --squash "$PR_NUMBER" --repo "$GH_REPO"; then
              echo "Auto-merge enabled for PR #${PR_NUMBER}"
            else
              AUTO_MERGE_COMMENT_NOTE="Auto-merge could not be enabled: gh pr merge --auto rejected the request (auto-merge disabled, insufficient permission, or PR not mergeable). Merge manually."
              echo "WARNING: gh pr merge failed for PR #${PR_NUMBER} — see comment note"
            fi
          fi

          # --- Compose results section: table (from scan state) + header/footer (from verdict priority) ---
          # The two are independent so that a multi-condition PR (e.g. age violation + advisories)
          # shows both signals: header per priority, table reflecting actual scan data.

          # ---- Results table (from scan state only) ----
          if [ "$GUARD_TRIGGERED" = "true" ] && [ "$TOTAL" -eq 0 ]; then
            # Extraction failed AND no advisories from any subset that did get scanned:
            # show "(not scanned)". With the issue #62 fix the guard can ALSO fire on a
            # partial-extraction PR where DEPS_TSV is non-empty and scans found
            # advisories — that case falls through to the TOTAL>0 branch so the actual
            # advisory IDs are preserved.
            TABLE_HDR="| Source | Vulnerabilities |"
            TABLE_SEP="|--------|----------------|"
            ROW1="| GitHub Advisory (GHSA) | (not scanned) |"
            ROW2="| OSV.dev | (not scanned) |"
            RESULTS_TABLE="$(printf '%s\n%s\n%s\n%s' "$TABLE_HDR" "$TABLE_SEP" "$ROW1" "$ROW2")"
          elif [ "$TOTAL" -gt 0 ]; then
            # Advisories present — show the actual scan results. This branch wins over
            # "scan errored with partial results" because partial > nothing.
            TABLE_HDR="| ID | Severity | Summary | Source |"
            TABLE_SEP="|----|----------|---------|--------|"
            RESULTS_TABLE="$(printf '%s\n%s\n%s' "$TABLE_HDR" "$TABLE_SEP" "$SCAN_RESULTS")"
          elif [ "$HAS_SAFETY_ERROR" = "true" ]; then
            # Scan errored AND no advisories tallied — table is empty/unknown.
            TABLE_HDR="| ID | Severity | Summary | Source |"
            TABLE_SEP="|----|----------|---------|--------|"
            RESULTS_TABLE="$(printf '%s\n%s\n| (scan failed — see logs) | - | - | - |' "$TABLE_HDR" "$TABLE_SEP")"
          else
            # Clean scan.
            TABLE_HDR="| Source | Vulnerabilities |"
            TABLE_SEP="|--------|----------------|"
            ROW1="| GitHub Advisory (GHSA) | 0 affecting target |"
            ROW2="| OSV.dev | 0 affecting target |"
            RESULTS_TABLE="$(printf '%s\n%s\n%s\n%s' "$TABLE_HDR" "$TABLE_SEP" "$ROW1" "$ROW2")"
          fi

          # ---- Header + footer (from verdict priority — must match safety-verdict.sh order) ----
          # Priority: guard > error > blocking-age > advisories > advisory-age > clean.
          # Spec §6.1 — keep this order in sync with the script.
          if [ "$GUARD_TRIGGERED" = "true" ]; then
            RESULTS_HEADER="Dependency extraction failed — manual review required."
            RESULTS_FOOTER="> Parser could not extract dependencies. Manual review required."
            if [ "$TOTAL" -gt 0 ]; then
              # Partial extraction: scans of the supported subset DID surface advisories.
              # Cross-reference so the IDs aren't lost under the guard header.
              RESULTS_FOOTER="${RESULTS_FOOTER}"$'\n'"> Also: ${TOTAL} advisory/ies were found in the scanned subset — see table above."
            fi
          elif [ "$HAS_SAFETY_ERROR" = "true" ]; then
            RESULTS_HEADER="Scan completed with errors — see workflow logs."
            RESULTS_FOOTER="> Scan errors prevented a clean verdict. Re-run or push to retry."
          elif [ "$HAS_AGE_VIOLATION" = "true" ] && [ "$RELEASE_AGE_POLICY" = "blocking" ]; then
            RESULTS_HEADER="${AGE_VIOLATION_COUNT} package(s) younger than the ${MINIMUM_RELEASE_AGE_DAYS}-day minimum release age (blocking policy)."
            RESULTS_FOOTER="> Re-run by rebasing or recreating the PR after the age-compliant date below."
            if [ "$TOTAL" -gt 0 ]; then
              # Cross-reference: advisories are present too. Don't lose that signal under the age-violation header.
              RESULTS_FOOTER="${RESULTS_FOOTER}"$'\n'"> Also: ${TOTAL} advisory/ies affect target versions — see table above."
            fi
          elif [ "$TOTAL" -gt 0 ]; then
            RESULTS_HEADER="**${TOTAL} advisory/ies found** affecting target versions — review before merging."
            RESULTS_FOOTER="> Review the advisories above before deciding to merge."
          elif [ "$HAS_AGE_VIOLATION" = "true" ]; then
            # release_age_policy: advisory — reported, not blocking.
            RESULTS_HEADER="${AGE_VIOLATION_COUNT} package(s) below the ${MINIMUM_RELEASE_AGE_DAYS}-day minimum release age (advisory policy — not blocking)."
            RESULTS_FOOTER="> Release-age violation reported (advisory policy — not blocking). Auto-merge suppressed."
          else
            RESULTS_HEADER="No known exploits found affecting the target versions."
            if [ "$AUTO_MERGE_OK" = "true" ]; then
              RESULTS_FOOTER="> Auto-merge enabled. PR will merge once all required checks pass."
            else
              RESULTS_FOOTER="> Ready for manual review and merge."
            fi
          fi

          # Attach auto-merge SETUP failure note (from the auto-merge block above) to the footer.
          # Auto-merge "required checks not satisfied" is NOT an error and not surfaced
          # here — only SETUP failures (gh pr merge --auto rejected by API).
          if [ -n "${AUTO_MERGE_COMMENT_NOTE:-}" ]; then
            RESULTS_FOOTER="${RESULTS_FOOTER}"$'\n'"> ${AUTO_MERGE_COMMENT_NOTE}"
          fi

          # Build collapsed historical section (non-blocking, for transparency)
          HISTORICAL_SECTION=""
          if [ "$FILTERED_TOTAL" -gt 0 ]; then
            HIST_HDR="| ID | Severity | Summary | Source | Patched In |"
            HIST_SEP="|----|----------|---------|--------|------------|"
            HISTORICAL_SECTION="$(printf '\n\n<details>\n<summary>%d historical advisory/ies (patched at or before target version — not blocking)</summary>\n\n%s\n%s\n%s</details>' \
              "$FILTERED_TOTAL" "$HIST_HDR" "$HIST_SEP" "$FILTERED_RESULTS")"
          fi

          # --- Release Age section (Task 12 — fixes #25 UX) ---
          RELEASE_AGE_SECTION=""
          if [ -n "$AGE_TSV" ]; then
            AGE_TABLE_HDR="| Package | Version | Published | Age | Status |"
            AGE_TABLE_SEP="|---------|---------|-----------|-----|--------|"
            AGE_ROWS=""
            MAX_FAIL_EPOCH=0
            while IFS=$'\t' read -r _name _ver _eco _iso _days _verdict _reason; do
              [ -z "$_name" ] && continue
              case "$_verdict" in
                pass)  _status="✅ passed" ;;
                fail)  if [ -n "$_reason" ]; then _status="❌ blocked (${_reason})"; else _status="❌ blocked"; fi ;;
                error) _status="⚠️ error (${_reason})" ;;
                *)     _status="?" ;;
              esac
              if [ "$_iso" = "-" ]; then
                _published_short="-"
              else
                _published_short="${_iso%T*}"
              fi
              AGE_ROWS="${AGE_ROWS}| \`${_name}\` | v${_ver} | ${_published_short} | ${_days}d | ${_status} |"$'\n'

              # Track max fail epoch for "earliest unblock" footer
              if [ "$_verdict" = "fail" ] && [ "$_iso" != "-" ]; then
                _pub_epoch=$(date -u -d "$_iso" +%s 2>/dev/null \
                  || date -u -d "${_iso}Z" +%s 2>/dev/null \
                  || date -u -jf '%Y-%m-%dT%H:%M:%SZ' "$_iso" +%s 2>/dev/null \
                  || date -u -jf '%Y-%m-%dT%H:%M:%S' "${_iso%Z}" +%s 2>/dev/null \
                  || echo 0)
                if [ "$_pub_epoch" -gt "$MAX_FAIL_EPOCH" ]; then
                  MAX_FAIL_EPOCH="$_pub_epoch"
                fi
              fi
            done <<< "$AGE_TSV"

            AGE_FOOTER=""
            if [ "$AGE_VIOLATION_COUNT" -gt 0 ] && [ "$MAX_FAIL_EPOCH" -gt 0 ]; then
              _unblock_epoch=$(( MAX_FAIL_EPOCH + MINIMUM_RELEASE_AGE_DAYS * 86400 ))
              _unblock_iso=$(date -u -d "@$_unblock_epoch" '+%Y-%m-%d' 2>/dev/null \
                || date -u -r "$_unblock_epoch" '+%Y-%m-%d' 2>/dev/null \
                || echo "unknown")
              AGE_FOOTER="$(printf '\n> %d package(s) below minimum. Earliest age-compliant date: %s.\n> Re-run by rebasing or recreating the PR after that date.' \
                "$AGE_VIOLATION_COUNT" "$_unblock_iso")"
            fi

            RELEASE_AGE_SECTION="$(printf '\n### Release Age (minimum: %s days)\n\n%s\n%s\n%s%s' \
              "$MINIMUM_RELEASE_AGE_DAYS" "$AGE_TABLE_HDR" "$AGE_TABLE_SEP" "$AGE_ROWS" "$AGE_FOOTER")"
          fi

          # --- Extraction warning section (Task 12 — surfaces #27 silent drops) ---
          EXTRACTION_WARNING_SECTION=""
          if [ -n "$EXTRACTION_WARNING" ]; then
            EXTRACTION_WARNING_SECTION="$(printf '\n> %s\n' "$EXTRACTION_WARNING")"
          fi

          COMMENT_BODY="$(printf '%s%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s%s%s%s%s' \
            "## Dependency Safety Scan" \
            "$EXTRACTION_WARNING_SECTION" \
            "**Packages scanned:** ${DEPS}" \
            "### Results" \
            "$RESULTS_HEADER" \
            "$RESULTS_TABLE" \
            "$RESULTS_FOOTER" \
            "$HISTORICAL_SECTION" \
            "$RELEASE_AGE_SECTION" \
            "$TIER2_SECTION" \
            "$SCORECARD_SECTION")"

          # --- Comment management: update-or-create with change detection ---
          COMMENTS_JSON=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate)
          EXISTING_COMMENT_ID=$(echo "$COMMENTS_JSON" | jq -r "
            [.[] | select(
              (.body | contains(\"<!-- dependency-safety-\")) or
              (.body | contains(\"## Dependency Safety Scan\"))
            )][0].id // empty")

          PREV_IDS=""
          if [ -n "$EXISTING_COMMENT_ID" ]; then
            PREV_BODY=$(echo "$COMMENTS_JSON" | jq -r "
              [.[] | select(.id == ${EXISTING_COMMENT_ID})][0].body")
            PREV_ACTIVE=$(echo "$PREV_BODY" | sed '/<details>/,$d')
            PREV_IDS=$(echo "$PREV_ACTIVE" | \
              grep -oE '(GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}|PYSEC-[0-9]+-[0-9]+)' | \
              sort -u | tr '\n' ',' | sed 's/,$//' || true)
          fi

          CURRENT_IDS=$(echo "$SCAN_RESULTS" | \
            grep -oE '(GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}|PYSEC-[0-9]+-[0-9]+)' | \
            sort -u | tr '\n' ',' | sed 's/,$//' || true)

          SCAN_MARKER="<!-- dependency-safety-${PR_NUMBER} -->"
          TIMESTAMP="Last scanned: $(date -u +'%Y-%m-%d %H:%M') UTC"
          DIVIDER="---"
          COMMENT_BODY="$(printf '%s\n%s\n\n%s\n_%s_' \
            "$SCAN_MARKER" \
            "$COMMENT_BODY" \
            "$DIVIDER" \
            "$TIMESTAMP")"

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -X PATCH \
              -f body="$COMMENT_BODY"
            echo "Updated existing scan comment (ID: ${EXISTING_COMMENT_ID})"
          else
            gh pr comment "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --body "$COMMENT_BODY"
            echo "Created new scan comment"
          fi

          if [ -n "$EXISTING_COMMENT_ID" ] && [ "$PREV_IDS" != "$CURRENT_IDS" ]; then
            CHANGE_NOTE="Advisory status changed since last scan — review updated findings above."
            gh pr comment "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --body "$CHANGE_NOTE"
            echo "Posted change notification"
          fi

          # --- Set final status ---
          gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state="$GATE_STATE" \
            -f context="dependency-safety / gate" \
            -f description="$STATUS_DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
